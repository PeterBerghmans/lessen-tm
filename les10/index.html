<script id="content" type="application/json">{"lang": "en", "course": "Data protection", "module": "Lesson 10", "title": "Cooperation and authority", "subtitle": "Chapter IV of the GDPR, second group: the processing agreement in practice, processing under authority, joint controllers and cooperation with the supervisory authority", "duration": "± 20 minutes of presentation, 2 look-up exercises, 2 think-along exercises and 10 questions", "ui": {"start": "Start the presentation", "intro_lead": "What you will be able to do after this module", "goals": ["Placing the four groups of obligations of Chapter IV and seeing that cooperation with others, too, gives concrete form to accountability.", "Mastering the processing agreement: who bears the obligation, what it must contain, and why the work starts after the signature: applying the instructions, reviewing and auditing.", "Knowing the difference between a processor, someone acting under authority and a joint controller, and choosing the right instrument for each: agreement, instructions or arrangement.", "Knowing what cooperation with the supervisory authority involves and how you organise it as DPO."], "slide_of": "Slide {n} of {total}", "play": "Play", "pause": "Pause", "replay": "Replay", "prev": "Previous", "next": "Next", "autoplay": "Continue automatically", "to_quiz": "Go to the exercises", "quiz_intro_title": "Test your knowledge", "quiz_intro_text": "Ten questions, each with four possible answers of which exactly one is correct. You get feedback immediately after each answer. Nothing is recorded: practise as often as you like.", "quiz_start": "Start the exercises", "question_of": "Question {n} of {total}", "correct": "Correct", "incorrect": "Incorrect", "next_question": "Next question", "show_result": "See your result", "result_title": "Your result", "result_text": "You answered {score} of the {total} questions correctly.", "result_good": "Well done. You have mastered the essentials of this module.", "result_mid": "Good progress. Review the feedback on the questions you missed and try again.", "result_low": "Watch the presentation again and then try once more. The feedback on each question will help you.", "retry": "Practise again", "review": "Review the presentation", "your_answer": "Your answer", "open_link": "Open the link in a new tab", "practice_hint": "Practical exercise: pause, carry out the steps, then click Next.", "back_to_slides": "Back to the slides", "resume_quiz": "Continue the exercises", "download_pdf": "Download your result as PDF", "pdf_title": "Exercise results", "pdf_question": "Question", "pdf_your": "Your answer", "pdf_correct": "Correct answer", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "not answered", "transcript": "Spoken text", "show_text": "Show text", "hide_text": "Hide text", "ai_notice_title": "Transparency about AI", "ai_notice": "The voice in this module was generated by AI from the voice of Peter Berghmans, with his consent. The text and slides were produced with AI assistance and reviewed for content by the trainer.", "ai_voice_label": "AI voice", "ai_icon_alt": "Official EU label: AI-generated content", "ai_footer": "Voice generated by AI (with the speaker's consent); text and slides produced with AI support and reviewed by the lecturer.", "skip_to_quiz": "Go straight to the exercises", "nav_home": "Home", "nav_slides": "Presentation", "nav_quiz": "Exercises", "speed": "Speed", "reveal_question": "What do you think?", "reveal_show": "Show the answer", "optional_label": "Deep dive (optional)", "optional_skip": "Skip the deep dive", "optional_intro": "The next slides are an optional deep dive. You can skip them and go straight to the exercises.", "autoplay_short": "Auto", "read_label": "Open the GDPR on EUR-Lex", "deep_label": "Deep dive", "deep_btn": "Open the deep dive"}, "slides": [{"id": 1, "type": "title", "title": "Working together under the GDPR: processor, authority, joint responsibility and the supervisory authority", "subtitle": "Chapter IV, second group of obligations: the processing agreement in practice, who works under authority, the arrangement between joint controllers, and cooperation with the authority", "script": "A new DPO gets three questions in her first week. The HR department asks whether a processing agreement is needed with the supplier of the payroll software. The legal department asks whether such an agreement is also needed with the staff who work in that software. And the management asks what has to be agreed with the partner organisation with which a joint platform is being set up. Three forms of cooperation, and three different answers: an agreement, instructions, and an arrangement. That is the subject of this module: the second group of obligations from the chapter on the controller and the processor, cooperation with other parties. We start with the most common form of cooperation, the one with the processor, and with the question of what still has to happen after the agreement is signed. Then we look at who works under authority, after that at joint controllers, and we close with cooperation of a different kind: that with the supervisory authority. Afterwards you will choose the right instrument for each form of cooperation, and you will know what is still expected of you after that."}, {"id": 2, "type": "table", "chip": "The overview", "title": "Chapter IV: four groups of obligations, today the second", "head": ["Group", "About", "Articles"], "rows": [["1 · Technical and organisational measures", "data protection policy, privacy by design and by default, record of processing activities, technical and organisational security, notification of breaches", "24, 25, 30, 32, 33, 34"], ["2 · Cooperation with other parties", "joint controllers, the processor and the processing agreement, processing under authority, cooperation with the supervisory authority", "26, 28, 29, 31"], ["3 · High-risk processing", "data protection impact assessment and prior consultation", "35, 36"], ["4 · The data protection officer", "designation, position and tasks of the DPO", "37, 38, 39"]], "hl": [1], "read": {"text": "Read Article 5(2) and look at the structure of Chapter IV: cooperation with others is also a way of complying with and demonstrating accountability.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "First the place in the whole. We divide the chapter on the obligations into four groups, and you know them from the previous module: the technical and organisational measures, cooperation with other parties, the obligations in case of a high risk, and the data protection officer. Today we work out the second group, highlighted in the table: joint controllers, the processor and the processing agreement, processing under authority, and cooperation with the supervisory authority. This group, too, gives concrete form to the accountability principle. The controller must ensure and demonstrate compliance not only for what it does itself, but also for what others do for it: its suppliers, its staff and its partners. Every obligation in this group is therefore an answer to the same question: how do you demonstrate that a processing operation you share with others is still under control? So remember: working together does not release you from accountability, it obliges you to organise it."}, {"id": 3, "type": "reveal", "chip": "Exercise · look it up yourself", "title": "Who bears the obligation to draw up the processing agreement?", "question": "Pause the audio, open the Regulation and read, in Article 28 on the processor, the first and the third paragraph. According to the text, who must make sure there is an agreement: the controller, the processor, or both? Pay attention to the subject of each sentence.", "verdict": "Both: the controller may only work with a processor that is bound, and processing by a processor must be governed by an agreement", "answer": [{"k": "Paragraph 1", "t": "the controller uses only processors providing sufficient guarantees; it chooses, checks and in practice takes the initiative."}, {"k": "Paragraph 3", "t": "processing by a processor is governed by a contract that is binding on the processor: the sentence has no acting subject, and the European guidelines conclude from this that both parties are responsible for the existence of the agreement."}, {"k": "In practice", "t": "the controller puts forward its model, but a processor that processes without an agreement itself infringes the Regulation; large processors therefore often put forward their own terms."}, {"k": "What the supervisory authorities do", "t": "an incomplete agreement earned a Belgian housing company a reprimand; an organisation that had Twitter data analysed without agreements was fined; and an Italian hotel chain without agreements with the maintenance firms of its cameras received 200,000 euros."}], "read": {"text": "Read Article 28(1) and (3); the EDPB Guidelines 07/2020 on controller and processor; decision 149/2022 of the DPA.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://edpb.europa.eu/our-work-tools/our-documents/guidelines/guidelines-072020-concepts-controller-and-processor-gdpr_nl", "label": "EDPB Guidelines 07/2020"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-149-2022.pdf", "label": "DPA 149/2022 · incomplete processing agreement"}]}, "script": "We start with the form of cooperation that occurs most often: that between the controller and the processor. You know the roles from an earlier module; here it is about the instrument that connects them, the processing agreement. And the first question is immediately an exercise. Pause the audio, open the Regulation and read, in Article 28 on the processor, the first and the third paragraph. According to the text, who must make sure there is an agreement: the controller, the processor, or both? Pay attention to the subject of each sentence. Take your time. … The first paragraph is clear: the controller uses only processors providing sufficient guarantees. It chooses, it checks, and in practice it takes the initiative. But read the third paragraph. Processing by a processor is governed by a contract that is binding on the processor. That sentence has no acting subject. The European guidelines on the roles conclude from this that both parties are responsible for the existence of the agreement. A processor that processes without an agreement therefore itself infringes the Regulation, and that is why large processors in practice often put forward their own terms. The supervisory authorities take this seriously. A Belgian social housing company received a reprimand because its agreement with a research agency was incomplete. An organisation that had Twitter data analysed without agreements was fined. And an Italian hotel chain without agreements with the firms that maintained its cameras received two hundred thousand euros, because whoever potentially has access to the images is a processor too."}, {"id": 4, "type": "table", "chip": "The content", "title": "What the processing agreement must contain", "head": ["Element", "What it governs"], "rows": [["The framework", "subject-matter and duration, nature and purpose of the processing, type of personal data, categories of data subjects, rights and obligations of the controller"], ["a · Instructions", "the processor processes only on documented instructions, including for transfers outside the Union; if a law requires it to do otherwise, it says so beforehand"], ["b · Confidentiality", "whoever works with the data at the processor is committed to confidentiality"], ["c · Security", "all the measures that the security of processing requires"], ["d · Sub-processors", "no other processor without prior authorisation; the same obligations are passed on"], ["e · Rights of the data subject", "assistance in responding to requests"], ["f · Security, breaches, impact assessment", "assistance with security, the notification of breaches and the impact assessment"], ["g · End", "delete or return, and remove copies"], ["h · Demonstrating and audits", "all information needed to demonstrate compliance, and allowing audits and inspections; and the processor informs immediately if, in its opinion, an instruction infringes the law"]], "hl": [1, 8], "read": {"text": "Read Article 28(3)(a) to (h), and the closing sentence on an instruction that infringes the law.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "What must such an agreement contain? Article 28, paragraph 3 lists it, and the table follows that list. First the framework: the subject-matter and the duration, the nature and the purpose of the processing, the type of personal data, the categories of data subjects, and the rights and obligations of the controller. Then eight obligations of the processor. It processes only on documented instructions, including for transfers outside the Union. Whoever works with the data at the processor is committed to confidentiality. It takes all the security measures. It engages no other processor without prior authorisation, and passes the same obligations on to that sub-processor. It helps in responding to requests from data subjects. It helps with security, the notification of breaches and the impact assessment. It deletes or returns the data at the end. And it makes all information available to demonstrate compliance, and allows audits and inspections. Two rows are highlighted, and we come back to them shortly: the instructions and the audits. Note also the closing sentence of the article: the processor immediately informs the controller if, in its opinion, an instruction infringes the law. So the processor is not a passive instrument; it has to think along."}, {"id": 5, "type": "bullets", "chip": "After the signature", "title": "The agreement is the beginning: applying the instructions, reviewing and auditing", "bullets": [{"k": "Much energy in the text, little in practice", "t": "organisations negotiate the agreement for months, but the instructions in it must be carried out by the staff of both parties; that takes working arrangements, training and a contact person on each side."}, {"k": "Incomplete instructions", "t": "the processor may only do what the instructions cover; if an operation is not in them, it is stuck: whoever determines the purpose itself without an instruction becomes the controller for that processing, with all the consequences."}, {"k": "Periodic review", "t": "are the instructions still adequate, are there new sub-processors, new transfers, new services? An agreement from 2018 rarely covers today's processing; lay down an annual review."}, {"k": "Audits: frequency and costs", "t": "the Regulation gives the right to audits but says nothing about frequency or costs; the guidelines ask for cooperation in good faith, with the controller ultimately deciding; agree beforehand: how often, remotely or on site, on the basis of certificates or reports, and who pays for an ordinary and for an extraordinary audit."}, {"k": "What happens without", "t": "a Polish energy company had a right of audit but never used it and did not check its processor; after a breach at that processor both parties were fined, the controller over 1 million euros."}], "read": {"text": "Read Article 28(3)(a) and (h), and paragraph 10; the EDPB Guidelines 07/2020 on audits (Part II); decision UODO 2023.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://edpb.europa.eu/our-work-tools/our-documents/guidelines/guidelines-072020-concepts-controller-and-processor-gdpr_nl", "label": "EDPB Guidelines 07/2020"}, {"url": "https://orzeczenia.uodo.gov.pl/document/urn:ndoc:gov:pl:uodo:2020:dkn_5130_2215/content", "label": "UODO 2023 · energy company and archiving processor"}]}, "script": "Now the point that is most underestimated in practice. Organisations put a lot of energy into drawing up the agreement: lawyers negotiate every clause for months. But that agreement contains instructions, and those instructions must be carried out by people: the staff of the processor, and also those of the controller, who have to give the instructions and follow them up. So the real work starts after the signature: working arrangements, training, a contact person on each side. And that is often harder than expected. A first pitfall is incomplete instructions. The processor may only do what the instructions cover. If an operation is not in them, say an export for a new report, the processor is in a difficult position: if it does not do it, the client is unhappy; if it does, and thereby determines the purpose itself, it becomes the controller for that processing, with all the consequences. That is why the agreement must be reviewed periodically: are the instructions still adequate, are there new sub-processors, new transfers, new services? An agreement from the early days of the Regulation rarely covers today's processing; lay down an annual review. A second point of discussion is the audits. The Regulation gives the controller the right to audits, but says nothing about the frequency or the costs, and that is often what negotiations are about. So agree it beforehand: how often an audit takes place, remotely or on site, and who pays for an ordinary audit and for an extraordinary audit after an incident. A Polish energy company had a right of audit, never used it, and did not check its processor. After a breach at that processor both parties were fined, the controller over a million euros. So remember: the agreement is the beginning, the instructions must be alive, and audits you have to agree on and carry out."}, {"id": 6, "type": "reveal", "chip": "Think-along exercise 1", "title": "The payroll software and the three requests", "question": "A supplier of payroll software is the processor for hundreds of employers. Three requests come in. One: a client asks for an export of all payroll data to a new pension partner, something the instructions do not mention. Two: the supplier wants to use the payroll data of all its clients to sell a benchmark product on pay levels of its own. Three: a client asks to keep the data of dismissed employees for ten years in case of disputes. What must the supplier do in each case?", "verdict": "Ask for a documented instruction, refuse or become controller itself, and carry out the instruction but warn if it infringes the law", "answer": [{"k": "The export", "t": "not covered by the instructions: the processor does not carry it out on its own initiative, but asks for a documented instruction and an addition to the agreement, because the pension partner is a new recipient."}, {"k": "The benchmark product", "t": "here the supplier determines the purposes and means itself; if it does so, it becomes the controller for that processing and needs a legal basis of its own, which for the payroll data of other people's employees usually does not exist; the instructions do not cover this."}, {"k": "Keeping for ten years", "t": "the processor carries out the instruction, because the retention period is a choice of the controller; but if it finds the period excessive, it immediately informs that in its opinion the instruction infringes storage limitation, and documents that."}], "read": {"text": "Read Article 28(3)(a), the closing sentence of paragraph 3, and paragraph 10.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "First think-along exercise. A supplier of payroll software is the processor for hundreds of employers. Three requests come in. One: a client asks for an export of all payroll data to a new pension partner, something the instructions do not mention. Two: the supplier wants to use the payroll data of all its clients to sell a benchmark product on pay levels of its own. Three: a client asks to keep the data of dismissed employees for ten years in case of disputes. What must the supplier do in each case? Think about it for a moment. … The export is not covered by the instructions. So the processor does not carry it out on its own initiative, but asks for a documented instruction and an addition to the agreement, because the pension partner is a new recipient. The benchmark product is different: here the supplier would determine the purposes and means itself. If it does so, it becomes the controller for that processing, and then it needs a legal basis of its own, which for the payroll data of other people's employees usually does not exist. The instructions do not cover this, and the clients will not allow it either. And the ten-year retention period? That is the controller's choice, so the processor carries out the instruction. But if it finds the period excessive, the closing sentence of the article says that it immediately informs the controller that in its opinion the instruction infringes storage limitation, and documents that. So: if an instruction is not covered, as processor you ask the controller for an instruction on paper."}, {"id": 7, "type": "quote", "chip": "Under authority", "title": "Whoever works under authority is not a processor: staff get instructions, not an agreement", "source": "Article 29 GDPR", "quote": "The processor and any person acting under the authority of the controller or of the processor, who has access to personal data, shall not process those data except on instructions from the controller, unless required to do so by Union or Member State law.", "bullets": [{"k": "Authority", "t": "whoever works under the authority of the controller or the processor, such as an employee, a temporary agency worker or a trainee, is not a processor but part of the organisation; the Belgian supervisory authority confirmed this for a medical adviser employed by a health insurance fund."}, {"k": "Instructions", "t": "they too process only on instructions; those instructions are found in work orders and in general rules of conduct: the work rules, an ICT and data protection policy, a confidentiality clause."}, {"k": "Making known, periodically", "t": "the supervisory authorities require not only that the rules exist, but that they are known: training and campaigns that are repeated periodically and that you can demonstrate took place."}, {"k": "No capacity of their own, unless", "t": "under the Regulation an employee has no capacity of his own and cannot himself be fined for a mistake; whoever deliberately acts outside the instructions, for instance by consulting a file for private purposes, becomes the controller himself for that act."}, {"k": "No agreement needed", "t": "you do not conclude a processing agreement with an employee, nor is he a joint controller; what you need are clear instructions, awareness and checks."}], "read": {"text": "Read Article 29 and Article 32(4); decisions 76/2021 (medical adviser), 64/2025 (hierarchical superior) and 188/2025 (municipal officials) of the DPA.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-76-2021.pdf", "label": "DPA 76/2021 · medical adviser of a health insurance fund"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-64-2025.pdf", "label": "DPA 64/2025 · manager reads medical file"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-188-2025.pdf", "label": "DPA 188/2025 · officials and the National Register"}]}, "script": "The second form of cooperation is that with your own people, and Article 29 on this is short. Read it on the slide. The processor and any person acting under the authority of the controller or of the processor, who has access to personal data, shall not process those data except on instructions from the controller. What is authority? The power to direct and to impose instructions: the employer over its employees, but also over temporary agency workers and trainees. Whoever works under authority is not a processor. He is part of the organisation, not a separate party. The Belgian supervisory authority confirmed this for a medical adviser employed by a health insurance fund: an employee is in a hierarchical relationship and therefore cannot be a processor. But whoever works under authority also processes only on instructions, and so he must be given clear instructions. These are found in work orders, but above all in general rules of conduct: the work rules, a policy for ICT and data protection, a confidentiality clause. And here the supervisory authorities look beyond the paper. They require that the rules exist, but also that they are made known, and periodically at that: training and campaigns that are repeated, and that you can demonstrate took place, with lists and dates. What if an employee makes a mistake? Under the Regulation an employee has no capacity of his own: he is neither controller nor processor, and so he cannot himself be fined for a mistake he makes within his assignment; that is the responsibility of the organisation. Unless he deliberately acts outside the instructions. A manager in a hospital who consulted the medical file of a subordinate late in the evening to see whether he could dismiss him acted, according to the Litigation Chamber, as an independent controller. And so did two municipal officials who consulted the National Register for private purposes; although the municipality still received a reprimand, because it had no control mechanism. So you do not conclude a processing agreement with an employee, nor is he a joint controller. So remember: under authority means instructions, awareness and checks, not an agreement."}, {"id": 8, "type": "reveal", "chip": "Exercise · look it up yourself", "title": "Read the two articles side by side: what is the essential difference in the instrument?", "question": "Open the Regulation and read the first paragraph of Article 26, on joint controllers, and compare it with the third paragraph of Article 28 on the processor. Which instrument does each article name, and what, according to the article on joint responsibility, must happen towards the data subject?", "verdict": "Not an agreement but an arrangement between them; and its essence must be made available to the data subject", "answer": [{"k": "The word", "t": "for the processor the text speaks of a contract or other legal act that is binding on the processor; for joint controllers of an arrangement between them by which the parties determine their respective responsibilities in a transparent manner."}, {"k": "Why the difference", "t": "a processor follows instructions, so a binding agreement is needed; joint controllers are equals that determine the purposes and means together, so they divide tasks: who informs, who answers requests, who secures, who notifies."}, {"k": "The data subject", "t": "the essence of the arrangement is made available to the data subject, and a contact point may be designated; but irrespective of the arrangement, the data subject may exercise his rights against each of them."}], "read": {"text": "Read Article 26(1) to (3), next to Article 28(3).", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "The third form of cooperation is that between joint controllers, and here too you start with an exercise. Open the Regulation and read the first paragraph of Article 26, on joint controllers. Compare it with the third paragraph of Article 28 on the processor, which you have just read. Which instrument does each article name? And what, according to the article on joint responsibility, must happen towards the data subject? Take your time. … The difference lies in one word. For the processor the text speaks of a contract or other legal act that is binding on the processor. For joint controllers the text does not speak of a contract, but of an arrangement between them by which the parties determine their respective responsibilities in a transparent manner. Why that difference? A processor follows instructions, and so you need a binding agreement that holds it to those instructions. Joint controllers are equals: they determine the purposes and the means together. They do not give each other instructions, they divide tasks: who informs the data subjects, who answers requests, who secures, who notifies a breach. And the second difference concerns the data subject. The essence of the arrangement must be made available to the data subject, and the parties may designate a contact point. But irrespective of what they agree between themselves, the data subject may exercise his rights against each of them. The arrangement divides the work, not the liability towards the data subject. So remember: a processor you bind with an agreement, with an equal partner you make an arrangement, and that arrangement you share with the data subject."}, {"id": 9, "type": "quote", "chip": "Joint controllers", "title": "The arrangement in practice: who does what, and how the data subject gets to know it", "source": "Article 26(2) GDPR", "quote": "The arrangement referred to in paragraph 1 shall duly reflect the respective roles and relationships of the joint controllers vis-à-vis the data subjects. The essence of the arrangement shall be made available to the data subject.", "bullets": [{"k": "A Belgian example", "t": "a political party passed its membership list to its youth wing, which used it to send a campaign email; the Litigation Chamber qualified both associations as joint controllers, because they determined the purposes and means of the membership administration together."}, {"k": "What went wrong", "t": "the youth wing had no privacy notice of its own; the members only read that the parent party processed their data and could find nowhere who did what; the transparency obligation was infringed."}, {"k": "How to do it properly", "t": "an arrangement that divides the roles (information, requests, security, breaches, retention periods) and a privacy notice that names both parties, summarises the essence of the division and gives one contact point."}, {"k": "Also under a statutory arrangement", "t": "for the vaccination invitations a cooperation agreement determined the roles of the joint controllers and one contact point per government; the Walloon agency still received a reprimand because the essence was not communicated to the citizens."}], "read": {"text": "Decisions 117/2024 (political party and youth wing) and 64/2024 (vaccination invitations) of the DPA.", "links": [{"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-117-2024.pdf", "label": "DPA 117/2024 · political party and youth wing"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-64-2024.pdf", "label": "DPA 64/2024 · vaccination invitations"}, {"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}]}, "script": "What does such an arrangement look like concretely, and how does the data subject get to know it? First read the second paragraph of Article 26 on the slide: the arrangement duly reflects the respective roles and relationships of the joint controllers vis-à-vis the data subjects, and the essence is made available to the data subject. A Belgian example. A political party passed its membership list to its youth wing, and a provincial chair of that wing used it to send a campaign email. A member lodged a complaint. The Litigation Chamber first examined the roles, and qualified both associations as joint controllers: they determined the purposes and the means of the membership administration together, because membership of the youth wing complemented that of the party. And what went wrong? The youth wing had no privacy notice of its own. The members only read that the parent party processed their data, and could find nowhere that the youth wing did so too, let alone who did what. That is an infringement of the transparency obligation. How do you do it properly? You make an arrangement that divides the roles: who informs, who answers requests, who secures, who notifies a breach, who determines the retention periods. And in the privacy notice you put both parties, a summary of that division, and one contact point. That also applies when a law governs the roles. For the vaccination invitations a cooperation agreement determined the roles of the joint controllers, with one contact point per government. Yet the Walloon health agency received a reprimand, because the essence of that arrangement was not communicated to the citizens. So remember: the arrangement divides the work, and the data subject must be able to read its essence."}, {"id": 10, "type": "table", "chip": "The three forms of cooperation side by side", "title": "Processor, under authority, joint controller: three relationships, three instruments", "head": ["", "Processor (28)", "Under authority (29)", "Joint controllers (26)"], "rows": [["Who", "a separate organisation that processes on your behalf", "your own employees, temporary agency workers, trainees", "an equal partner that determines the purposes and means together with you"], ["Instrument", "a binding agreement with instructions and the eight obligations", "instructions: work orders, work rules, policy, confidentiality", "an arrangement between them that divides the tasks transparently"], ["What the data subject sees", "the processor appears as recipient or category in the privacy notice", "nothing separate: the employee is the organisation", "the essence of the arrangement and a contact point"], ["Own liability", "yes: own obligations and fines, and controller if it determines the purpose itself", "no, unless he deliberately acts outside the instructions", "yes: the data subject may exercise his rights against each of them"], ["Checks", "audits and reports, periodic review", "awareness, logging, checks of consultations", "joint review of the arrangement"]], "read": {"text": "Check the table in Articles 26, 28 and 29; in case of doubt the text applies.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "Put the three forms of cooperation side by side, and look at the table. Who is it? The processor is a separate organisation that processes on your behalf. Those who work under authority are your own employees, temporary agency workers and trainees. The joint controller is an equal partner that determines the purposes and the means together with you. The instrument: a binding agreement with instructions and the eight obligations; instructions via work orders, the work rules, a policy and confidentiality; and an arrangement between them that divides the tasks transparently. What the data subject sees: the processor appears as recipient or as category of recipients in the privacy notice; the employee he does not see separately, because the employee is the organisation; and with joint responsibility he sees the essence of the arrangement and a contact point. Own liability: the processor has obligations of its own and can be fined, and becomes controller if it determines the purpose itself; the employee not, unless he deliberately acts outside the instructions; and the joint controllers each fully towards the data subject. And the checks: audits and review for the processor, awareness and logging for the staff, and a joint review of the arrangement for the partners. So remember: agreement, instructions, arrangement, and for each its own form of checks."}, {"id": 11, "type": "reveal", "chip": "Think-along exercise 2", "title": "Three parties around one sports platform", "question": "A city and the provincial sports federation jointly set up a platform on which residents enrol for sports camps; they decide together which data are requested and for what. The platform runs at a cloud service that manages the servers. The enrolments are processed by a temporary agency worker who works for the city for three months. Which relationship is this in each case, and which instrument goes with it?", "verdict": "Joint controllers with an arrangement, a processor with an agreement, and someone under authority with instructions", "answer": [{"k": "City and federation", "t": "they determine the purposes and means together: joint controllers; an arrangement divides who informs, who answers requests, who secures and who notifies, and the platform's privacy notice names both with one contact point."}, {"k": "The cloud service", "t": "processes on their behalf without determining the purpose itself: processor; a processing agreement with instructions, security, sub-processors, assistance and audits, concluded by the controllers together or by one of them according to the arrangement."}, {"k": "The temporary agency worker", "t": "works under the authority of the city: not a processor and no agreement; but instructions, a confidentiality statement, a short training at the start and access that stops after three months."}], "script": "Second think-along exercise. A city and the provincial sports federation jointly set up a platform on which residents enrol for sports camps; they decide together which data are requested and for what. The platform runs at a cloud service that manages the servers. The enrolments are processed by a temporary agency worker who works for the city for three months. Which relationship is this in each case, and which instrument goes with it? Think about it for a moment. … The city and the federation determine the purposes and the means together: they are joint controllers. An arrangement divides who informs, who answers requests, who secures and who notifies a breach, and the platform's privacy notice names both parties, with one contact point. The cloud service processes on their behalf without determining the purpose itself: a processor, so a processing agreement with instructions, security, sub-processors, assistance and audits. Who concludes that agreement? The joint controllers together, or one of them, if the arrangement says so. And the agency worker works under the authority of the city: not a processor, no agreement, but instructions, a confidentiality statement, a short training at the start, and access that stops after three months. So remember: first ask who determines the purpose, then the instrument, and do not forget the agency worker."}, {"id": 12, "type": "quote", "chip": "Cooperation with the supervisory authority", "title": "Cooperation of a different kind: cooperating with the authority on request", "source": "Article 31 GDPR", "quote": "The controller and the processor and, where applicable, their representatives, shall cooperate, on request, with the supervisory authority in the performance of its tasks.", "bullets": [{"k": "What it requires", "t": "the controller and the processor cooperate, on request, with the supervisory authority in the performance of its tasks: answering questions, providing documents, granting access during an investigation."}, {"k": "In Belgium", "t": "the Inspection Service of the Data Protection Authority investigates; it puts written questions with a deadline, can come on site and hold hearings; the framework law requires cooperation and makes obstructing an investigation a criminal offence."}, {"k": "What it earns or costs", "t": "the degree of cooperation is a factor in setting the fine: full cooperation was assessed as neutral to mitigating for a telecom operator; for a landlord of student rooms the Litigation Chamber noted that he was hard to reach and left questions unanswered."}, {"k": "The DPO as contact point", "t": "one of the statutory tasks of the DPO is acting as contact point for the supervisory authority; so organise beforehand who answers, within what deadline, with which documents, and keep the file."}], "read": {"text": "Read Article 31 and Article 39(1)(e); the charter of the Inspection Service; decisions 142/2025 and 107/2024 of the DPA.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/charter-van-de-inspectiedienst.pdf", "label": "Charter of the Inspection Service"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-142-2025.pdf", "label": "DPA 142/2025 · telecom operator, cooperation"}]}, "script": "Finally, cooperation of a different kind: that with the supervisory authority. Read Article 31 on the slide, it is one sentence. The controller and the processor cooperate, on request, with the supervisory authority in the performance of its tasks. On request: so it is not a spontaneous duty, but as soon as the supervisory authority asks for something, you must cooperate: answering questions, providing documents, granting access during an investigation. In Belgium that is the Inspection Service of the Data Protection Authority. It puts written questions with a deadline, can come on site and hold hearings. The Belgian framework law requires cooperation and even makes obstructing an investigation a criminal offence. And the cooperation counts in the outcome. The degree to which you cooperate with the supervisory authority is one of the factors in setting a fine. For a telecom operator that cooperated fully, the Litigation Chamber assessed this as neutral to mitigating. For a landlord of student rooms it noted that he was hard to reach and did not answer part of the questions. And in an older case the Inspection Service described how a company made cooperation difficult, although that was ultimately not considered proven. What does this mean for you as DPO? One of your statutory tasks is acting as contact point for the supervisory authority. Organise that beforehand: who answers, within what deadline, with which documents, and who decides on what you disclose. Answer fully and on time, ask for an extension if it really cannot be done, and keep the file, because what you provide to the supervisory authority must match what you documented earlier. So remember: cooperate on request, fully and on time, and the DPO is the contact point."}, {"id": 13, "type": "summary", "chip": "Summary", "title": "What you take with you", "key": "Working together does not release you from accountability: with a processor you conclude a binding agreement and the work only starts after the signature; whoever works under authority gets instructions, awareness and checks; with an equal partner you make an arrangement whose essence the data subject can read; and the supervisory authority gets full cooperation on request, with the DPO as contact point.", "bullets": [{"k": "The processor", "t": "both responsible for the agreement; the framework and eight obligations; instructions that are alive, an annual review, and audits that you agree on and carry out."}, {"k": "Under authority", "t": "not a processor, no agreement; but instructions in the work rules and the policy, periodic and demonstrable awareness; whoever deliberately goes outside the instructions becomes controller himself."}, {"k": "Joint", "t": "not an agreement but an arrangement between them; the essence with the data subject, with a contact point; each remains fully answerable."}, {"k": "The supervisory authority", "t": "cooperate on request, fully and on time; the cooperation weighs in the fine; the DPO is the contact point."}], "script": "What do you take with you? One key sentence: working together does not release you from accountability, it obliges you to organise it, and for each form of cooperation there is an instrument of its own. Besides that, you remember four things. The processor: both are responsible for the agreement, which contains the framework and eight obligations; but the work starts after the signature, with instructions that are alive, an annual review, and audits that you agree on and carry out. Under authority: not a processor and no agreement, but instructions in the work rules and the policy, with periodic and demonstrable awareness; whoever deliberately goes outside the instructions becomes controller himself. Joint: not an agreement but an arrangement between them, whose essence the data subject can read, with a contact point, and each remains fully answerable. And the supervisory authority: cooperate on request, fully and on time, because the cooperation weighs in the fine, and the DPO is the contact point. Back to the new DPO from the beginning: with the supplier of the payroll software a processing agreement, with the staff instructions and training, and with the partner organisation an arrangement. Before you go to the exercises, one assignment. Pause the audio and look up the processing agreement with your most important supplier: when was it last reviewed, and when was an audit or a report last requested? After that there are ten questions."}], "quiz": [{"q": "Who bears the obligation to have a processing agreement?", "options": ["Only the controller, which chooses the processor, checks it, gives instructions and draws up the agreement.", "Both: the controller chooses a processor that is bound, and the processing must be governed by it.", "Only the processor, because it is the one that actually processes and secures the data.", "Neither of them, as long as the processor's general terms and conditions mention the GDPR."], "answer": 1, "feedback": ["The controller takes the initiative, but the processor too infringes the Regulation if it processes without an agreement.", "Correct. Paragraph 1 addresses the controller, paragraph 3 says that the processing is governed by a contract; the guidelines hold both responsible.", "The controller may only work with processors that are bound; the obligation does not rest on the processor alone.", "A mention in general terms and conditions is not enough; the agreement must contain the mandatory content."]}, {"q": "A processor receives a request from its client that the documented instructions do not cover. What does it do?", "options": ["It carries it out, because the client is the controller and decides on all processing operations.", "It refuses definitively, because a processor may never carry out new operations.", "It reports it to the supervisory authority, which decides whether the operation is allowed.", "It asks for a documented instruction and an addition to the agreement."], "answer": 3, "feedback": ["Without a documented instruction the processor acts outside the agreement; the client must first give the instruction in writing.", "New operations are possible, but only on the basis of a documented instruction.", "The supervisory authority does not intervene here; the instruction is a matter between the parties.", "Correct. The processor processes only on documented instructions; a new operation requires a new instruction and an addition."]}, {"q": "A processor uses its clients' data to develop and sell a new product of its own. What is the consequence?", "options": ["It becomes the controller for that processing, with a legal basis of its own.", "It remains a processor, as long as it informs the clients afterwards about the new product and secures the data.", "It becomes a joint controller together with all of its clients.", "It is allowed to, because the agreement gives it the right to use the data."], "answer": 0, "feedback": ["Correct. A processor that, in breach of the Regulation, determines the purposes and means itself is considered the controller for that processing.", "Whoever determines the purposes and means itself is no longer a processor; informing afterwards does not change that.", "Joint responsibility requires that the parties determine the purposes and means together; here the processor decides alone.", "The agreement limits the processor to the client's instructions; use of its own does not fall under that."]}, {"q": "Why are arrangements on audits at the processor often a point of discussion?", "options": ["Because the Regulation prohibits audits without prior written authorisation from the supervisory authority.", "Because only a certified auditor of the supervisory authority may carry out an audit.", "Because the Regulation gives the right of audit, but says nothing about frequency and costs.", "Because audits are only possible at processors outside the European Union."], "answer": 2, "feedback": ["The Regulation does not require authorisation from the supervisory authority for an audit.", "The controller or an auditor mandated by it may carry out the audit.", "Correct. The right of audit is in the Regulation; frequency, form and costs are agreed by the parties themselves, in good faith, with the controller deciding.", "Audits are possible at every processor, wherever it is established."]}, {"q": "An employee of the HR department accidentally makes a mistake in a payroll file. Who is answerable for this under the Regulation?", "options": ["The employee himself, as processor of the payroll data.", "The employer, because the employee acts under authority.", "The employee and the employer together, as joint controllers.", "Nobody, because a mistake made in good faith falls outside the Regulation and its sanctions."], "answer": 1, "feedback": ["An employee under authority is not a processor.", "Correct. Whoever acts under authority is not a separate party; the responsibility lies with the organisation, unless the employee deliberately acts outside the instructions.", "An employee does not determine the purposes and means together with his employer.", "A mistake can certainly be an infringement; the organisation is answerable for it."]}, {"q": "What do the supervisory authorities expect of the instructions to staff?", "options": ["That they are laid down in a separate processing agreement with each employee.", "That they consist exclusively of technical access restrictions, without rules of conduct.", "That they are signed once on recruitment and are not repeated after that.", "That they exist and are made known periodically and demonstrably."], "answer": 3, "feedback": ["You do not conclude a processing agreement with an employee.", "Instructions also include rules of conduct; technology alone is not enough.", "Signing once is not enough; the awareness must be repeated periodically.", "Correct. The rules must exist, in the work rules or the policy, and be repeated periodically in a way you can demonstrate."]}, {"q": "What is the essential difference between the instrument for joint controllers and that for a processor?", "options": ["Joint controllers make an arrangement between them, a processor gets an agreement.", "Joint controllers conclude a binding agreement, a processor only gets verbal instructions.", "There is no difference: both relationships require the same processing agreement.", "Joint controllers need no instrument if they trust each other."], "answer": 0, "feedback": ["Correct. For joint controllers the text speaks of an arrangement between them that divides the tasks transparently, not of a contract.", "It is the other way round: the processor is bound by an agreement.", "The instruments differ, because the relationship differs: equals divide tasks, a processor follows instructions.", "An arrangement is mandatory, unless a law already lays down the responsibilities."]}, {"q": "What must the data subject get to know in the case of joint controllership?", "options": ["Nothing in particular; the arrangement is an internal agreement between the parties themselves.", "The full text of the arrangement, including the financial agreements.", "The essence of the arrangement, and a contact point.", "Only the name of the party designated as the lead controller."], "answer": 2, "feedback": ["The Regulation expressly requires that the essence be made available to the data subject.", "The full text is not required; it is about the essence.", "Correct. The essence of the division and a contact point; and the data subject may exercise his rights against each of the parties.", "Each party remains answerable; the data subject must know the division of roles, not just one name."]}, {"q": "A manager consults, outside any assignment, the medical file of a subordinate for his own purposes. How did the Belgian Litigation Chamber assess such a situation?", "options": ["The employer is fully liable, because the manager acted under authority.", "The manager was himself the controller for that consultation.", "The manager acted as a processor of the hospital.", "Nobody is liable, because it was an internal consultation."], "answer": 1, "feedback": ["The Litigation Chamber ruled that the manager exceeded his powers and was responsible himself; the organisation must, however, have a control mechanism.", "Correct. Whoever deliberately acts outside his powers determines the purpose of the processing himself and becomes the controller for it himself.", "An employee is not a processor.", "An unlawful consultation is a processing operation for which someone is responsible."]}, {"q": "What does cooperation with the supervisory authority involve?", "options": ["Spontaneously providing the supervisory authority with a report on all processing operations and breaches every year.", "Asking the supervisory authority for prior approval for every new processing operation.", "Cooperating only if the supervisory authority has received a complaint from a data subject.", "Cooperating on request: answering questions, providing documents, granting access."], "answer": 3, "feedback": ["The obligation applies on request; there is no spontaneous annual reporting.", "Prior consultation exists only in case of a high residual risk after an impact assessment, not for every processing operation.", "The supervisory authority can also investigate on its own initiative; the duty to cooperate applies to every request.", "Correct. Cooperating on request in the performance of the supervisory authority's tasks; the degree of cooperation also weighs in a fine."]}]}</script>

  $('btn-prev').addEventListener('click',()=>go(i-1,true));
  $('btn-next').addEventListener('click',()=>{ if(i===S.length-1){ audio.pause(); if(NOQUIZ){ if(C.back){ location.href=backUrl(); } else show('intro'); } else show('quiz-intro'); } else go(i+1,true); });
  $('btn-start').addEventListener('click',()=>{ started=true; show('pres'); go(0,true); });
  if(C.profiles){
    $('btn-start').classList.add('hidden'); $('prof-lead').classList.remove('hidden'); $('prof-lead').textContent = U.profile_lead||'Waar werk je?';
    $('profiles').classList.remove('hidden');
    $('profiles').innerHTML = C.profiles.map(pr=>'<button class="qset" data-p="'+esc(pr.id)+'"><small>'+esc(U.profile_kicker||'Kies je pad')+'</small><b>'+esc(pr.label)+'</b><span>'+esc(pr.desc||'')+'</span></button>').join('');
    $('profiles').addEventListener('click',e=>{ const b=e.target.closest('.qset'); if(!b) return; setProfile(b.dataset.p); started=true; clearResume(); show('pres'); go(0,true); });
  }
  if(U.optional_skip){ $('btn-opt-skip').textContent = U.optional_skip; }
  $('btn-opt-skip').addEventListener('click',()=>{ audio.pause(); let k=i; while(k<S.length && S[k].optional) k++; if(k>=S.length) show('quiz-intro'); else go(k,true); });
  setRate(rate);
  document.addEventListener('keydown',e=>{
    if($('pres').classList.contains('hidden')) return;
    if(e.key==='ArrowRight'){ if(i<S.length-1) go(i+1,true); }
    else if(e.key==='ArrowLeft'){ go(i-1,true); }
    else if(e.key===' '){ e.preventDefault(); $('btn-play').click(); }
  });

  /* ---- opname (Vimeo, ingebed; tijdcodes in seconden) ---- */
  /* één opname (C.recording) of meerdere (C.recordings: [{id,short,vimeo,hash,title,source,chapters}]) */
  const R = RS.length ? RS[0] : null; let cur=null, recReady=false, recFrom=null, recPending=null;
  const VORIGIN='https://player.vimeo.com';
  function recById(v){ return RS.find(r=>r.id===v) || RS[0]; }
  function recShort(v){ return (RS.length>1 && v) ? esc(recById(v).short||'')+' · ' : ''; }
  function recPost(method,value){ const f=$('rec-player').querySelector('iframe'); if(f&&f.contentWindow) f.contentWindow.postMessage(JSON.stringify(value===undefined?{method}:{method,value}), VORIGIN); }
  function recPause(){ if(recReady) recPost('pause'); }
  function recMark(sec){ if(!cur) return; let k=null; cur.chapters.forEach((c,n)=>{ if(c.t<=sec+1) k=cur.id+':'+n; }); [...$('rec-ch').querySelectorAll('button')].forEach(b=>{ const on=b.dataset.k===k; if(on && !b.classList.contains('on')){ const c=$('rec-ch'); c.scrollTop=Math.max(0,b.offsetTop-c.clientHeight/3); } b.classList.toggle('on', on); }); }
  function openRec(t, from, v){
    if(!R) return; audio.pause(); recFrom = (from==null?null:from);
    const want = v ? recById(v) : (cur || R);
    $('btn-rec-back').classList.toggle('hidden', recFrom==null); if(recFrom==='quiz') $('btn-rec-back').textContent = '‹ '+(U.rec_back_quiz||'Terug naar de vraag'); else if(recFrom!=null) $('btn-rec-back').textContent = '‹ '+fmt(U.rec_back||'Terug naar slide {n}',{n:recFrom+1});
    show('rec');
    $('rec-title').textContent = want.title; $('rec-src').textContent = want.source;
    const f=$('rec-player').querySelector('iframe');
    if(!f || want!==cur){ cur=want; recReady=false; recPending=t; $('rec-player').innerHTML='<iframe src="'+VORIGIN+'/video/'+esc(cur.vimeo)+'?'+(cur.hash?'h='+esc(cur.hash)+'&':'')+'autoplay='+(t!=null?1:0)+'&dnt=1&title=0&byline=0&portrait=0#t='+Math.floor(t||0)+'s" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="'+esc(cur.title)+'"></iframe>'; }
    else if(t!=null){ if(recReady){ recPost('setCurrentTime',Math.floor(t)); recPost('play'); } else recPending=t; }
    recMark(t!=null?t:-5);
  }
  if(R){
    $('nav-rec').classList.remove('hidden'); $('nav-rec').textContent = U.nav_rec||'Opname';
    $('nav-rec').addEventListener('click',()=>{ if($('rec').classList.contains('hidden')) openRec(null,null); });
    $('rec-title').textContent = R.title; $('rec-src').textContent = R.source; $('rec-note').textContent = U.rec_note||'';
    let html='';
    RS.forEach(r=>{ let part=null; if(RS.length>1) html+='<h4 class="rv">'+esc(r.short||r.title)+'</h4>';
      r.chapters.forEach((c,n)=>{ if(c.part && c.part!==part){ part=c.part; html+='<h4>'+esc(part)+'</h4>'; } html+='<button data-k="'+esc(r.id)+':'+n+'" data-v="'+esc(r.id)+'" data-t="'+c.t+'" class="'+(c.q?'q':'')+'"><span class="tc">'+hms(c.t)+'</span><span>'+(c.q?'<b class="qp">'+esc(U.rec_q||'Vraag')+' · </b>':'')+esc(c.k)+'</span></button>'; }); });
    $('rec-ch').innerHTML = html;
    $('rec-ch').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) openRec(+b.dataset.t, recFrom, b.dataset.v); });
    $('btn-rec-back').addEventListener('click',()=>{ recPause(); show(recFrom==='quiz'?'quiz':'pres'); });
    window.addEventListener('message',e=>{
      if(e.origin!==VORIGIN) return; let d=e.data; try{ if(typeof d==='string') d=JSON.parse(d); }catch(x){ return; }
      const f=$('rec-player').querySelector('iframe'); if(f && e.source!==f.contentWindow) return;
      if(d.event==='ready'){ recReady=true; recPost('addEventListener','timeupdate'); if(recPending!=null){ recPost('setCurrentTime',Math.floor(recPending)); recPost('play'); recPending=null; } }
      else if(d.event==='timeupdate' && d.data){ recMark(d.data.seconds); }
    });
    if(C.source_line){ $('intro-src').textContent = C.source_line; $('intro-src').classList.remove('hidden'); }
  }

  /* ---- quiz ---- */
  /* quizsets: C.quiz is de hoofdquiz; C.quizzes (optioneel) zijn extra oefenreeksen [{id,title,intro,questions}] */
  const SETS = (C.quizzes && C.quizzes.length) ? C.quizzes : [{id:'main', title:U.quiz_intro_title, intro:U.quiz_intro_text, questions:C.quiz}];
  let curSet = SETS[0], Q = curSet.questions; let qi = 0, answers = [];
  function selectSet(k){ curSet = SETS[k]; Q = curSet.questions; }
  if(SETS.length>1){
    $('qi-title').textContent = U.quiz_choose_title || U.quiz_intro_title;
    $('qi-text').textContent = U.quiz_choose_text || U.quiz_intro_text;
    $('btn-quiz-start').classList.add('hidden');
    $('qsets').classList.remove('hidden');
    $('qsets').innerHTML = SETS.map((st,k)=>'<button class="qset" data-k="'+k+'"><small>'+esc(fmt(U.quiz_set_count||'{n}',{n:st.questions.length}))+'</small><b>'+esc(st.title)+'</b><span>'+esc(st.intro||'')+'</span></button>').join('');
    $('qsets').addEventListener('click',e=>{ const b=e.target.closest('.qset'); if(!b) return; selectSet(+b.dataset.k); startQuiz(); });
    $('btn-sets').classList.remove('hidden'); $('btn-sets').textContent = U.quiz_back_to_sets || U.review;
    $('btn-sets').addEventListener('click',()=>{ clearResume(); show('quiz-intro'); });
  }
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    if(q.context){ $('q-ctx').innerHTML = (U.q_ctx_label?'<span class="ctx-k">'+esc(U.q_ctx_label)+'</span>':'')+esc(q.context); $('q-ctx').classList.remove('hidden'); } else { $('q-ctx').classList.add('hidden'); $('q-ctx').innerHTML=''; }
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');
    $('btn-q-next').textContent = qi===Q.length-1 ? U.show_result : U.next_question;
  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const n = +b.dataset.n, q = Q[qi], ok = n===q.answer;
    answers[qi] = n;
    [...$('opts').children].forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add('ok'); else if(k===n) o.classList.add('bad'); else o.classList.add('dim'); });
    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n])
      + (q.key?'<div class="fb-key"><b>'+esc(U.q_key_label||'À retenir')+' —</b>'+esc(q.key)+'</div>':'')
      + (q.rec&&RS.length?'<div class="fb-rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+q.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')
      + (q.links&&q.links.length?'<div class="fb-rec fb-src"><span>📄 '+esc(U.q_src_label||'La source')+'</span>'+q.links.map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label)+' ↗</a>').join('')+'</div>':'');
    $('fb').querySelectorAll('[data-rect]').forEach(b=>b.addEventListener('click',()=>openRec(+b.dataset.rect,'quiz',b.dataset.recv||null)));
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>'; $('r-title').textContent = SETS.length>1 ? curSet.title+' — '+U.result_title : U.result_title;
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});
    $('r-msg').textContent = score>=tot*0.8 ? U.result_good : (score>=tot*0.5 ? U.result_mid : U.result_low);
    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');
  }
  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
  { const sl=parseInt(QS.get('slide')||'0'); if(sl>=1 && sl<=S.length && !C.profiles){ started=true; show('pres'); go(sl-1,false); history.replaceState(null,'',location.pathname); } }
})();
</script>
