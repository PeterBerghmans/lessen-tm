s mandatory, how to designate one without a conflict of interests, what protects the DPO's position, what the DPO does and how the DPO relates to the supervisory authority", "script": "A medium-sized bank designates its head of audit, risk and compliance as data protection officer. A logical choice, the board thinks: he knows the processes, he already sits in every meeting, and he costs nothing extra. Three years later the supervisory authority imposes a fine of fifty thousand euros. Not because there was a data breach, and not because the man did his job badly, but because, as head of those departments, he himself helped decide how personal data were processed, and so could not independently monitor what he had decided himself. That is the subject of this module: the data protection officer, the DPO, the fourth group of obligations in the chapter on the controller and the processor. Three articles, three questions. When must you designate a DPO, and how do you choose one? What position must the DPO be given, and what is a conflict of interests? And what are the DPO's tasks, what does the organisation do with the DPO's advice, and how does the DPO work with the supervisory authority? You are following this course to take up that function yourself; afterwards you will therefore also know what you may expect from your organisation."}, {"id": 2, "type": "table", "chip": "The overview", "title": "Chapter IV: four groups of obligations, today the fourth", "head": ["Group", "About", "Articles"], "rows": [["1 · Technical and organisational measures", "data protection policy, privacy by design and by default, record of processing activities, technical and organisational security, notification of breaches", "24, 25, 30, 32, 33, 34"], ["2 · Cooperation with other parties", "joint controllers, the processor and the processing agreement, processing under authority, cooperation with the supervisory authority", "26, 28, 29, 31"], ["3 · High-risk processing", "data protection impact assessment and prior consultation", "35, 36"], ["4 · The data protection officer", "designation, position and tasks of the DPO", "37, 38, 39"]], "hl": [3], "read": {"text": "Read Article 5(2): the DPO is one of the ways in which the controller ensures and can demonstrate compliance.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "First, the place in the whole. We divide the chapter on the obligations into four groups: the technical and organisational measures, cooperation with other parties, the obligations in case of a high risk, and the data protection officer. In this module we cover the fourth group, highlighted in the table: the designation, the position and the tasks of the DPO, in Articles 37, 38 and 39. This group too stems from the accountability principle: the controller must ensure compliance and be able to demonstrate it. A DPO is an instrument for that, and a special one. The other measures in the chapter are documents, procedures and technology. The DPO is a person, with a legal position of their own within the organisation, who advises the organisation and monitors it, and who is the face of data protection for the data subjects and the supervisory authority. The Regulation protects that position, and that is unique: for no other function in an organisation does it prescribe that someone may not receive instructions and may not be dismissed for performing their task. So remember: the DPO is the only obligation in this chapter that is a person, and the Regulation protects that person in order to make accountability a reality."}, {"id": 3, "type": "cards", "chip": "Three articles", "title": "Designation, position, tasks: how the three articles are built up", "cols": 3, "cards": [{"k": "Designation", "t": "when a DPO is mandatory (public authority, large-scale monitoring, large-scale special categories); one DPO for a group or for several public authorities; designated on the basis of expert knowledge; internal or external; contact details published and communicated to the supervisory authority.", "sub": "Article 37"}, {"k": "Position", "t": "involved in a timely manner in everything that relates to data protection; supported with access and resources; no instructions, no dismissal or penalty for the tasks; reports to the highest management level; contact point for data subjects; confidentiality; other tasks only without a conflict of interests.", "sub": "Article 38"}, {"k": "Tasks", "t": "informing and advising; monitoring compliance, including responsibilities, awareness-raising, training and audits; advising on the impact assessment; cooperating with the supervisory authority and acting as contact point; always with due regard to the risk.", "sub": "Article 39"}], "read": {"text": "Read Articles 37, 38 and 39 in full, one after the other; the guidelines on the DPO (WP243) explain each paragraph; the DPA summarises them in ten basic rules.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "DPO Guidelines (WP243)"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/de-10-basisregels-over-de-functionaris-voor-gegevensbescherming-dpo.pdf", "label": "DPA · 10 basic rules on the DPO"}]}, "script": "The three articles follow the life cycle of the function, and the cards give the overview. The first article is about the designation: when a DPO is mandatory, that a group or several public authorities may share one, that the DPO is designated on the basis of expert knowledge, that the DPO may be a staff member or an external person, and that the contact details are published and communicated to the supervisory authority. The second article is about the DPO's position: involved in a timely manner in everything that relates to data protection, given access and resources, receiving no instructions and not dismissed or penalised for performing the tasks, reporting to the highest management level, available to data subjects, bound by confidentiality, and taking on other tasks only if they do not result in a conflict of interests. The third article lists the tasks: informing and advising, monitoring compliance, advising on the impact assessment, and cooperating with the supervisory authority as contact point. The European guidelines on the DPO explain each paragraph, and the Belgian supervisory authority summarised them in ten basic rules; both are behind the buttons. We now walk through the three articles, each time asking what that means for you as a future DPO. So remember: designation, position, tasks, in that order."}, {"id": 4, "type": "reveal", "chip": "Article 37(1) · exercise: look it up yourself", "title": "For which of these four organisations is a DPO mandatory?", "question": "Pause the audio and read the first paragraph of the article on designation. Then assess four organisations: a municipality of 8,000 inhabitants; a hospital; a webshop with ten employees that sends a newsletter; and a security firm that watches camera footage for retail chains. For whom is a DPO mandatory, and on the basis of which point?", "verdict": "The municipality (public authority), the hospital (large-scale special categories) and the security firm (regular and systematic monitoring on a large scale); not the webshop, although it may designate one voluntarily", "answer": [{"k": "(a) · Public authority", "t": "any public authority or body, except for courts acting in their judicial capacity; so the municipality, whatever its size, and under the Belgian framework act also private organisations that perform tasks in the public interest for the government."}, {"k": "(b) · Monitoring", "t": "a core activity that requires regular and systematic monitoring on a large scale: the security firm, but also a telecoms operator, a platform that tracks behaviour, or a city with a network of cameras."}, {"k": "(c) · Special categories", "t": "a core activity that consists of large-scale processing of special categories or criminal data: the hospital; not an individual general practitioner, says the recital to the Regulation."}, {"k": "The webshop", "t": "no public authority, no large-scale monitoring, no special categories: not mandatory; if it nevertheless designates a DPO voluntarily, all the rules on position and tasks apply in full."}], "read": {"text": "Read Article 37(1) to (4) and recital 97; the WP243 guidelines on core activity, large scale and monitoring; the DPA page on the DPO.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "DPO Guidelines (WP243)"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/avg/functionaris-voor-gegevensbescherming", "label": "DPA · data protection officer"}]}, "script": "We begin with the designation, and with an exercise. Pause the audio and read the first paragraph of Article 37, on designation. Then assess four organisations: a municipality of eight thousand inhabitants, a hospital, a webshop with ten employees that sends a newsletter, and a security firm that watches camera footage for retail chains. For whom is a DPO mandatory, and on the basis of which point? Take your time. … The paragraph names three cases. The first: any public authority or body, except for courts acting in their judicial capacity. So the municipality, however small. The Belgian framework act extends that to private organisations that perform tasks in the public interest for the government. The second: an organisation whose core activities consist of processing operations that require regular and systematic monitoring on a large scale. That is the security firm, but just as well a telecoms operator, a platform that tracks behaviour, or a city with a network of cameras. Note the words core activities: it is about the main business, not about the staff administration that every organisation has. The third: an organisation whose core activities consist of large-scale processing of special categories or criminal data. So the hospital; not an individual general practitioner, says the recital to the Regulation explicitly. And the webshop? No public authority, no large-scale monitoring, no special categories: not mandatory. But if it nevertheless designates a DPO voluntarily, all the rules on position and tasks apply in full; you cannot have a DPO just a little bit. Be careful: an organisation that need not designate a DPO is not any less bound by the other rules. The record must still exist, and a breach must still be notified."}, {"id": 5, "type": "compare", "chip": "Article 37(5) and (6) · internal or external", "title": "Designated on the basis of expert knowledge: a staff member or an external person, each with advantages and disadvantages", "left": {"head": "Internal DPO (staff member)", "items": ["Advantage: knows the organisation, the people and the systems; is quickly involved in every project", "Disadvantage: often combines the function with other tasks, and then a conflict of interests or a lack of time looms", "Point of attention: dependence on their line manager; the Regulation protects the DPO against instructions and dismissal for performing the tasks", "Requires: a risk analysis of the combination with other tasks, a training budget, and a place in the organisation chart under the highest management level"]}, "right": {"head": "External DPO (service contract)", "items": ["Advantage: no conflict of interests with internal functions, expert knowledge at the right level, often a team behind them", "Disadvantage: knows the internal workings less well and is less visible; risks being involved too late", "Point of attention: the contract must settle independence and availability; an external DPO may not at the same time be your IT supplier", "Requires: a fixed internal contact person, agreements on availability, and access to meetings and documents"]}, "read": {"text": "Read Article 37(5) and (6); the WP243 guidelines on expert knowledge and on the external DPO.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "DPO Guidelines (WP243)"}]}, "script": "Whom do you designate? Article 37 is clear about the criterion, in paragraph 5: the DPO is designated on the basis of professional qualities and, in particular, expert knowledge of data protection law and practices, and the ability to fulfil the tasks. Expert knowledge, then, and above all knowledge of the law. That seems obvious, but in practice the DPO is often chosen because they are available, or because they know IT, or because they already do compliance. That is not a criterion. How deep that knowledge must go depends on the risk of the processing: a hospital requires more than a municipal library. And paragraph 6 makes the choice twofold: a staff member, or an external person on the basis of a service contract. Look at the two columns. The internal DPO knows the organisation, the people and the systems, and is quickly involved in every project. But they often combine the function with other tasks, and then a conflict of interests or simply a lack of time looms. And they depend on their line manager, although the Regulation protects them against instructions and dismissal for performing the tasks. The external DPO has no conflict of interests with internal functions, brings expert knowledge at the right level and often a team. But they know the internal workings less well, are less visible, and risk being involved too late. And they too can be in a conflict: an external DPO who is at the same time your IT supplier assesses their own work. Every choice therefore has advantages and disadvantages, and the organisation must weigh them up and document that assessment. So remember: expert knowledge is the criterion, internal or external is a trade-off, and in both cases you watch out for the conflict of interests."}, {"id": 6, "type": "bullets", "chip": "Article 37(7) · documenting the designation", "title": "Documenting the designation: qualities, risk analysis, organisation chart, publication", "bullets": [{"k": "Qualities checked", "t": "record why this person has expert knowledge: education, experience, certificates, and how that knowledge is maintained; the supervisory authority asks for it in an investigation."}, {"k": "Risk analysis in case of dependence or cumulation", "t": "if the DPO combines the function with other tasks, or in practice reports to someone they have to monitor, you make an analysis of the conflict of interests and document the measures."}, {"k": "Organisation chart and mandate", "t": "the DPO appears in the organisation chart, with a line to the highest management level, and with a written mandate that lays down their tasks, time, resources and access."}, {"k": "Publish and communicate", "t": "the contact details appear in the privacy notice and are communicated to the DPA via a DPO case on the portal; a change or a withdrawal also goes through there; it need not be the name, but it must be a reachable contact point."}, {"k": "Not for a part", "t": "a DPO is designated for the organisation, not for a part of its processing: a DPO who only monitors customer data and not staff data does not exist."}], "read": {"text": "Read Article 37(7); the DPA page on managing a DPO case (registering, changing, withdrawing); the DPA's ten basic rules.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/acties/functionaris-voor-gegevensbescherming-dpo", "label": "DPA · managing a DPO case"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/de-10-basisregels-over-de-functionaris-voor-gegevensbescherming-dpo.pdf", "label": "DPA · 10 basic rules on the DPO"}]}, "script": "The designation is a decision you must be able to demonstrate, and so you document it. Four things. First, the qualities: record why this person has expert knowledge, with education, experience and certificates, although a certificate as such is not mandatory; it does help to demonstrate the knowledge; and record how that knowledge is maintained; in an investigation the supervisory authority asks for that. Second, a risk analysis where there is a suspicion of dependence or of cumulation: if the DPO combines the function with other tasks, or in practice reports to someone they have to monitor, you analyse the conflict of interests and document the measures you take. Third, the organisation chart and the mandate: the DPO appears in the organisation chart, with a line to the highest management level, and with a written mandate that lays down their tasks, their time, their resources and their access. Fourth, publication, paragraph 7 of Article 37: the contact details appear in the privacy notice and are communicated to the Data Protection Authority, in Belgium via a DPO case on the authority's portal; a change or a withdrawal also goes through there. It need not be the name, but it must be a contact point that works. And one thing that is not possible: designating a DPO for a part of the processing. A DPO who only monitors the processing of customer data, but not that of staff, does not exist. The function applies to the whole organisation. So remember: qualities, risk analysis, organisation chart and publication, and always for the whole."}, {"id": 7, "type": "quote", "chip": "Article 38(3) and (6) · independence", "title": "No instructions, no dismissal for performing the tasks, and directly to the highest management level", "source": "Article 38(3) GDPR", "quote": "The controller and processor shall ensure that the data protection officer does not receive any instructions regarding the exercise of those tasks. He or she shall not be dismissed or penalised by the controller or the processor for performing his tasks. The data protection officer shall directly report to the highest management level of the controller or the processor.", "bullets": [{"k": "No instructions", "t": "the organisation does not determine what the DPO advises, how the DPO assesses a complaint or what the DPO says to the supervisory authority; it may ask questions and put forward priorities."}, {"k": "No dismissal or penalty for the tasks", "t": "a DPO may not be dismissed or disadvantaged because the advice is unwelcome; the Court of Justice accepts that Member States may protect the DPO even more broadly, as long as the DPO can still be replaced in case of a conflict of interests or a lack of expert knowledge."}, {"k": "Directly to the highest management level", "t": "the DPO reports to the highest management level, not to a head of department; a bank whose DPO did not report directly to the top and at the same time headed three departments was fined 75,000 euros."}, {"k": "The conflict of interests", "t": "other tasks are allowed, but not if they lead the DPO to determine the purposes and means of processing themselves: head of HR, IT, marketing, audit or compliance are classic conflicts; the Court of Justice assesses it case by case, on the basis of all the circumstances."}], "read": {"text": "Read Article 38(3) and (6); DPA decisions 18/2020 and 141/2021; judgments of the Court of Justice C-534/20 (Leistritz), C-560/21 and C-453/21 (X-FAB).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-18-2020.pdf", "label": "DPA 18/2020 · DPO also head of audit and compliance"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-141-2021.pdf", "label": "DPA 141/2021 · DPO also head of department (bank)"}, {"url": "https://curia.europa.eu/juris/liste.jsf?num=C-453/21", "label": "CJEU C-453/21 X-FAB · conflict of interests DPO"}, {"url": "https://curia.europa.eu/juris/liste.jsf?num=C-534/20", "label": "CJEU C-534/20 Leistritz · dismissal protection DPO"}]}, "script": "Then the position, in Article 38, and read paragraph 3 on the slide, because it is the heart of the status. The controller and the processor ensure that the data protection officer does not receive any instructions regarding the exercise of those tasks. He or she is not dismissed or penalised for performing the tasks. And the DPO reports directly to the highest management level. Three safeguards. No instructions: the organisation does not determine what the DPO advises, how the DPO assesses a complaint or what the DPO says to the supervisory authority. It may ask questions and put forward priorities; independent does not mean unreachable. No dismissal or penalty for the tasks: a DPO may not be dismissed or disadvantaged because the advice is unwelcome. The Court of Justice accepted that Member States may protect the DPO even more broadly, as Germany does, as long as the DPO can still be replaced in case of a conflict of interests or a lack of expert knowledge. And directly to the highest management level: the DPO reports to the highest management level, not to a head of department who can filter the advice. That brings us back to the bank from the beginning, and to a second Belgian case: a bank whose DPO did not report directly to the top and at the same time headed three processing departments was fined seventy-five thousand euros. That brings us to the conflict of interests in paragraph 6. Other tasks are allowed, but not if they lead the DPO to determine the purposes and the means of processing themselves. Head of HR, IT, marketing, audit or compliance: those are the classic conflicts, because whoever decides cannot independently monitor their own decision. The Court of Justice confirmed that and assesses it case by case, on the basis of all the circumstances. So remember: no instructions, no dismissal for the tasks, reporting to the top, and no function in which the DPO decides on processing themselves."}, {"id": 8, "type": "reveal", "chip": "Think-along exercise 1 · Articles 37 and 38", "title": "Three candidates for the function of DPO", "question": "A company with 600 employees is looking for a DPO and has three candidates. One: the HR director, who knows the staff processing inside out. Two: an in-house lawyer, motivated, but without any experience in data protection. Three: an external firm that also manages the company's IT infrastructure. Who is eligible, and under what conditions?", "verdict": "None of the three as they are now: the HR director is in a conflict of interests, the lawyer lacks the required expert knowledge, and the firm assesses its own work", "answer": [{"k": "The HR director", "t": "determines the purposes and means of the staff processing and would have to monitor it as DPO: a conflict of interests, and exactly the case for which the Belgian supervisory authority has already imposed fines; only possible if he gives up that management function."}, {"k": "The in-house lawyer", "t": "no conflict of interests, but the Regulation requires expert knowledge of data protection law and practices; designation is possible only after training, with a documented pathway and, in the meantime, support from an external expert."}, {"k": "The external firm", "t": "an external DPO is allowed, but whoever manages the IT infrastructure helps determine the means and, as DPO, assesses its own security; the contract must separate the roles, or you choose another firm."}, {"k": "What you document", "t": "the assessment per candidate, the risk analysis of the conflict of interests, the chosen solution and the mandate; that documentation is the evidence of accountability."}], "read": {"text": "Read Article 37(5) and Article 38(6); the WP243 guidelines, chapter on the conflict of interests; DPA decision 141/2021.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "DPO Guidelines (WP243)"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-141-2021.pdf", "label": "DPA 141/2021 · DPO also head of department (bank)"}]}, "script": "First think-along exercise. A company with six hundred employees is looking for a DPO and has three candidates. One: the HR director, who knows the staff processing inside out. Two: an in-house lawyer, motivated, but without any experience in data protection. Three: an external firm that also manages the company's IT infrastructure. Who is eligible, and under what conditions? Think about it for a moment. … None of the three, as they are now. The HR director determines the purposes and the means of the staff processing himself, and would have to monitor it as DPO. That is a conflict of interests, and exactly the case for which the Belgian supervisory authority has already imposed fines. It is only possible if he gives up that management function. The in-house lawyer has no conflict of interests, but the Regulation requires expert knowledge of data protection law and practices, and she does not have that yet. Designating her is possible only after training, with a documented pathway, and in the meantime with support from an external expert. Finally the external firm: an external DPO is allowed, but whoever manages the IT infrastructure helps determine the means of the processing and, as DPO, would assess its own security. The contract must separate those roles, with other people and a separate reporting line, or you choose another firm. What you document in any case is the assessment per candidate, the risk analysis of the conflict of interests, the chosen solution and the mandate. So remember: expert knowledge and independence, and the assessment on paper."}, {"id": 9, "type": "quote", "chip": "Article 38(1), (2), (4) and (5) · involved and supported", "title": "Involved in a timely manner, with access and resources, available to data subjects, and bound by confidentiality", "source": "Article 38(1) GDPR", "quote": "The controller and the processor shall ensure that the data protection officer is involved, properly and in a timely manner, in all issues which relate to the protection of personal data.", "bullets": [{"k": "Properly and in a timely manner", "t": "the DPO is there at the design of a project, not at the evaluation afterwards; an organisation that cannot demonstrate that its DPO was involved in security, the record or the impact assessment infringes this obligation, the Litigation Chamber ruled on the Ghent enrolment platform."}, {"k": "Access and resources", "t": "access to personal data and processing operations, time, budget, training and, where necessary, a team; but note: the DPO rarely actually inspects the data themselves; that is possible only when the task requires it, and that is rarely the case."}, {"k": "Contact point for data subjects", "t": "data subjects may contact the DPO about their data and their rights; hence the published contact details; an organisation that could not demonstrate what advice its DPO gave on an access request received a reprimand for that."}, {"k": "Confidentiality", "t": "the DPO is bound by confidentiality concerning what they learn in performing the task; that protects the data subject who approaches them, the employee who reports a problem, and the organisation itself."}], "read": {"text": "Read Article 38(1), (2), (4) and (5); DPA decisions 171/2024 and 59/2025.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-171-2024.pdf", "label": "DPA 171/2024 · Ghent enrolment platform"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/publications/beslissing-ten-gronde-nr.-59-2025.pdf", "label": "DPA 59/2025 · optician, DPO advice on access request"}]}, "script": "Independence alone is not enough; a DPO whom nobody asks anything is useless. Read paragraph 1 of Article 38 on the slide: the DPO is involved, properly and in a timely manner, in all issues which relate to the protection of personal data. In a timely manner means at the design of a project, not at the evaluation afterwards. And it is an obligation that the supervisory authority checks: on the Ghent enrolment platform from an earlier module, the Litigation Chamber ruled that the organisation could not demonstrate that its DPO had been involved in security, the record and the impact assessment, and that is an infringement of this paragraph. Paragraph 2 of Article 38 requires support: access to personal data and processing operations, and the necessary resources: time, budget, training, and where necessary a team. On that access, one nuance that is often misunderstood in practice. The DPO has a right of access, but rarely actually inspects the data themselves. That is possible only when the task requires it, for instance to investigate a complaint, and that is rarely the case. A DPO who looks into the files every day is doing something other than monitoring. Paragraph 4 makes the DPO the contact point for data subjects: they may approach the DPO about their data and their rights, and that is why the contact details are published. The supervisory authority looks at that too: a company that could not demonstrate what advice its DPO had given on an access request received a reprimand for that. And paragraph 5 binds the DPO by confidentiality concerning what they learn in performing the task. That protects the data subject who approaches them, the employee who reports a problem, and the organisation itself. So remember: involved in a timely manner, supported, approachable and discreet, and access to data only when the task requires it."}, {"id": 10, "type": "quote", "chip": "Article 39 · the tasks", "title": "Informing and advising, monitoring, the impact assessment, and the supervisory authority", "source": "Article 39(1) GDPR", "quote": "The data protection officer shall have at least the following tasks:\n(a) to inform and advise the controller or the processor and the employees who carry out processing of their obligations pursuant to this Regulation and to other Union or Member State data protection provisions;\n(b) to monitor compliance with this Regulation, with other Union or Member State data protection provisions and with the policies of the controller or processor in relation to the protection of personal data, including the assignment of responsibilities, awareness-raising and training of staff involved in processing operations, and the related audits;\n(c) to provide advice where requested as regards the data protection impact assessment and monitor its performance pursuant to Article 35;\n(d) to cooperate with the supervisory authority;\n(e) to act as the contact point for the supervisory authority on issues relating to processing, including the prior consultation referred to in Article 36, and to consult, where appropriate, with regard to any other matter.", "bullets": [{"k": "Informing and advising", "t": "the organisation and the employees who carry out processing, of their obligations; the DPO advises, the controller decides."}, {"k": "Monitoring compliance", "t": "with the Regulation and with the organisation's own policies, including the assignment of responsibilities, awareness-raising, training and audits; monitoring is not executing: the DPO does not write the policy and does not carry out the audits, but monitors that it happens."}, {"k": "The impact assessment", "t": "providing advice where requested and monitoring its performance; drawing it up is for the organisation, as in an earlier module."}, {"k": "What about the advice", "t": "the controller takes the advice to heart, or explains in writing why it is not followed; advice that disappears without trace is, for the supervisory authority, a sign that the DPO is not involved."}, {"k": "Tailored to the risk", "t": "in performing the tasks the DPO has due regard to the risk, the nature, scope, context and purposes: the DPO spends time where the risk is greatest."}], "read": {"text": "Read Article 39 in full; the WP243 guidelines on the tasks and on documenting advice that is not followed.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "DPO Guidelines (WP243)"}]}, "script": "Article 39 lists the tasks, and the slide shows them; they are minimum tasks, and the organisation may add to them as long as they do not result in a conflict. The first task: informing and advising the organisation and the employees who carry out processing of their obligations. Note the verb: advising. The DPO advises, the controller decides and bears the responsibility. The second task: monitoring compliance with the Regulation and with the organisation's own policies, including the assignment of responsibilities, awareness-raising, training and audits. Monitoring is not executing. The DPO does not write the policy, does not carry out the audits and does not give every training session; the DPO monitors that it happens, and reports it when it does not. The third task: providing advice where requested on the impact assessment and monitoring its performance, as in an earlier module. The fourth and fifth tasks concern the supervisory authority, and we come to that shortly. Now the point that counts most in practice: what does the organisation do with the advice? The Regulation does not say so in as many words, but the guidelines and the supervisory authorities are clear: the controller takes the advice to heart, or explains in writing why it is not followed. Deviating is allowed, because the controller decides; deviating without reasons is not. Advice that disappears without trace is, for the supervisory authority, a sign that the DPO is not really involved. As DPO, then, you make sure that every piece of advice is in writing, dated, and answered. Finally, paragraph 2 of Article 39 says that in performing the tasks the DPO has due regard to the risk: the DPO spends time where the risk is greatest, and not everywhere equally. So remember: advising and monitoring, not deciding and not executing; and every piece of advice is followed or rejected with reasons."}, {"id": 11, "type": "bullets", "chip": "Article 39(1)(d) and (e) · the supervisory authority", "title": "The DPO and the supervisory authority: contact point and cooperation, but not an extension of the authority", "bullets": [{"k": "Contact point", "t": "the supervisory authority turns to the DPO with questions about processing, in case of a complaint, in an investigation by the Inspection Service and in the prior consultation; that is why the authority knows the contact details via the DPO case."}, {"k": "Cooperating", "t": "the DPO cooperates with the supervisory authority: answering questions, providing documents, guiding the organisation during an investigation; the duty to cooperate itself rests on the controller and the processor, and so do the sanctions."}, {"k": "Not an extension", "t": "the DPO is not an inspector of the authority within the organisation: the DPO is not obliged to report infringements to the supervisory authority on their own initiative, and their confidentiality also applies towards the authority, except where the law obliges them to answer."}, {"k": "Consultation", "t": "the DPO may ask the supervisory authority for advice or consult it on a matter; the Belgian authority organises, among other things, consultations and guidelines for DPOs for that purpose."}, {"k": "Who is sanctioned", "t": "not the DPO: the fines for a poorly filled function, a conflict of interests or a DPO who was not involved hit the organisation; the DPO does bear their professional responsibility."}], "read": {"text": "Read Article 39(1)(d) and (e), and Article 31; the DPA page on the DPO and the DPO case; the WP243 guidelines on cooperation with the supervisory authority.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.gegevensbeschermingsautoriteit.be/professioneel/avg/functionaris-voor-gegevensbescherming", "label": "DPA · data protection officer"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "DPO Guidelines (WP243)"}]}, "script": "Finally, the relationship with the supervisory authority, the fourth and the fifth task in Article 39. The DPO cooperates with the supervisory authority, and is its contact point for everything that relates to processing, including the prior consultation. In practice that means: the authority turns to the DPO with a question, in case of a complaint, in an investigation by the Inspection Service, and in a prior consultation. That is why it knows the contact details, via the DPO case on its portal. The DPO answers questions, provides documents and guides the organisation during an investigation. But note two limits. The first: the duty to cooperate itself rests on the controller and the processor, and so do the sanctions. The DPO organises the cooperation, but does not carry it in place of the organisation. The second limit is more important: the DPO is not an extension of the authority within the organisation. The DPO is not obliged to report infringements to the supervisory authority on their own initiative, and their confidentiality also applies towards the authority, except where the law obliges them to answer. Anyone who sees the DPO as an internal inspector makes the DPO useless: employees then stop reporting anything. The DPO's role is to bring the organisation into compliance, with the supervisory authority as a partner when that is needed. Conversely, the DPO may ask the supervisory authority for advice or consult it, and the Belgian authority organises consultations and publishes guidelines for that purpose. And who is sanctioned when things go wrong? Not the DPO. The fines for a poorly filled function, a conflict of interests or a DPO who was not involved hit the organisation; the DPO bears their professional responsibility, but the Regulation aims its sanctions at the controller and the processor. So remember: contact point and partner of the supervisory authority, but not an inspector in the service of the authority."}, {"id": 12, "type": "reveal", "chip": "Think-along exercise 2 · Articles 38 and 39", "title": "The advice that disappeared into a drawer", "question": "The DPO of a hospital advises in writing not to launch a new patient portal without two-factor authentication and without an impact assessment. The board launches the portal anyway, without replying to the advice. Six months later the portal leaks, and the Inspection Service requests the file. What does the Inspection Service find, and what should the board have done?", "verdict": "That the DPO was involved but the advice was ignored without reasons: the board should have followed the advice or explained in writing why not, and the DPO should have had that recorded", "answer": [{"k": "What the Inspection Service sees", "t": "dated advice from the DPO, no reply, no impact assessment and no two-factor authentication: the organisation knew of the risk and did not act; that aggravates the infringement of security and of the impact assessment, and shows that the DPO was not properly involved."}, {"k": "What the board should have done", "t": "follow the advice, or give reasons in writing why not, with the measures it took instead; deviating is allowed, because the controller decides, but deviating without reasons infringes accountability."}, {"k": "What the DPO should have done", "t": "deliver the advice directly to the highest management level, ask for a reasoned reply and keep the file; not decide alone, not alert the supervisory authority alone, but make sure that the decision and its reasons exist."}, {"k": "Who is sanctioned", "t": "the hospital, as controller; not the DPO, who has performed the task and can demonstrate it."}], "read": {"text": "Read Article 38(1) and (3), and Article 39(1)(a) and (c); the WP243 guidelines on documenting advice that is not followed.", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://www.edpb.europa.eu/documents/guideline/data-protection-officer_en", "label": "DPO Guidelines (WP243)"}]}, "script": "Second think-along exercise. The DPO of a hospital advises in writing not to launch a new patient portal without two-factor authentication and without an impact assessment. The board launches the portal anyway, without replying to the advice. Six months later the portal leaks, and the Inspection Service requests the file. What does the Inspection Service find, and what should the board have done? Think about it for a moment. … The Inspection Service sees dated advice from the DPO, no reply, no impact assessment and no two-factor authentication. So the organisation knew of the risk and did not act. That aggravates the infringement of security and of the impact assessment, and it shows that the DPO was not properly involved, as Article 38 requires: being involved is more than being allowed to send an email. What should the board have done? Follow the advice, or give reasons in writing why not, with the measures it took instead. Deviating is allowed, because the controller decides. Deviating without reasons infringes accountability. And what should the DPO have done? Deliver the advice directly to the highest management level, ask for a reasoned reply, and keep the file. Not decide alone, not alert the supervisory authority alone, but make sure that the decision and its reasons exist. Who is sanctioned? The hospital, as controller. Not the DPO, who has performed the task and can demonstrate it; and that is exactly why, as DPO, you do everything in writing. So remember: advice is followed or rejected with reasons, and the DPO makes sure that that trail exists."}, {"id": 13, "type": "summary", "chip": "Summary", "title": "What you take away", "key": "The DPO is the only obligation in the chapter that is a person: mandatory for public authorities and where large-scale monitoring or special categories are a core activity, designated on the basis of expert knowledge, internal or external but without a conflict of interests, with a documented designation for the whole organisation; involved in a timely manner, supported, without instructions, protected against dismissal and reporting to the top; the DPO advises and monitors but does not decide, the advice is followed or rejected with reasons, and the DPO is the contact point of the supervisory authority without being its extension.", "bullets": [{"k": "Designation", "t": "public authority, large-scale monitoring, large-scale special categories; voluntary means in full; expert knowledge is the criterion; internal or external is a trade-off; document qualities, risk analysis, organisation chart and the DPO case with the DPA; never for a part of the processing."}, {"k": "Position", "t": "involved in a timely manner, access and resources, no instructions, no dismissal or penalty for the tasks, directly to the highest management level, contact point for data subjects, confidentiality, no conflict of interests; inspecting data only if the task requires it."}, {"k": "Tasks", "t": "informing and advising, monitoring, advising on the impact assessment; advising and monitoring, not deciding or executing; every piece of advice followed or rejected with reasons."}, {"k": "Supervisory authority", "t": "contact point and cooperation, but not an inspector in the service of the authority; the sanctions hit the organisation."}], "script": "What do you take away? One key sentence: the DPO is the only obligation in this chapter that is a person, and the Regulation protects that person so that they can advise and monitor independently. Then four things. The designation: mandatory for public authorities and for organisations whose core activity is large-scale monitoring or large-scale special categories; voluntary means in full; expert knowledge is the criterion; internal or external is a trade-off with advantages and disadvantages; and you document qualities, risk analysis, organisation chart and the DPO case with the supervisory authority, always for the whole organisation. The position: involved in a timely manner, with access and resources, without instructions, protected against dismissal and penalty for the tasks, directly to the highest management level, approachable for data subjects, bound by confidentiality, and without a conflict of interests; and inspecting the data only when the task requires it. The tasks: informing and advising, monitoring, advising on the impact assessment; advising and monitoring, not deciding or executing; and every piece of advice is followed or rejected with reasons. And the supervisory authority: the DPO is its contact point and cooperates with it, but is not an inspector in the service of the authority, and the sanctions hit the organisation. Back to the bank from the beginning: the mistake was not the person, but the combination of functions, and the absence of a risk analysis and a direct line to the top. Before the practice questions, one exercise. Pause the audio and find out how your organisation's DPO was designated: is the designation on paper, has it been communicated to the supervisory authority, to whom does the DPO report, and what other tasks does the DPO have? After that there are ten questions."}], "quiz": [{"q": "In which cases is the designation of a DPO mandatory?", "options": ["For every organisation with more than 250 employees, whatever the nature and the scope of its processing.", "Only for organisations that must carry out an impact assessment for a high-risk processing operation.", "For every organisation that processes personal data of customers and publishes a privacy notice.", "For public authorities, and where large-scale monitoring or special categories are a core activity."], "answer": 3, "feedback": ["The number of employees is not a criterion for the DPO.", "The impact assessment and the DPO are separate obligations; one does not entail the other.", "Processing customer data is not enough; it is about the three cases in the article.", "Correct. Public authorities and bodies, and organisations whose core activities consist of regular and systematic monitoring on a large scale or large-scale processing of special categories or criminal data."]}, {"q": "A webshop that is not obliged to designate a DPO does so voluntarily anyway. What is the consequence?", "options": ["The webshop may decide for itself which tasks, which resources and which protection the voluntary DPO receives.", "The rules on the position and tasks of the DPO apply in full, as if the designation were mandatory.", "The DPO need not be communicated to the supervisory authority, because the designation was voluntary.", "The voluntary DPO may be limited to the processing operations that the webshop explicitly assigns to the DPO."], "answer": 1, "feedback": ["The Regulation does not allow a tailor-made DPO; the position and the tasks are laid down.", "Correct. Anyone who designates a DPO voluntarily applies the articles on position and tasks in full; you cannot have a DPO just a little bit.", "A voluntary DPO is also published and communicated to the supervisory authority.", "A DPO is designated for the whole organisation, not for a part of the processing."]}, {"q": "On what basis must the DPO be designated?", "options": ["On the basis of professional qualities, above all expert knowledge of the law and practices.", "On the basis of availability within the organisation and knowledge of the IT systems and the processes.", "On the basis of seniority, so that the DPO has enough authority towards the board and the heads of department.", "On the basis of a certificate that the supervisory authority issues after an exam and renews every year."], "answer": 0, "feedback": ["Correct. Expert knowledge of data protection law and practices, and the ability to fulfil the tasks.", "Availability and IT knowledge are not a legal criterion.", "Seniority is not a criterion; expert knowledge is.", "The Regulation does not require a certificate; the organisation assesses and documents the expert knowledge."]}, {"q": "What is the main risk when a staff member combines the function of DPO with a management function?", "options": ["That the organisation has to pay a salary twice for one person who performs two functions at the same time.", "That the supervisory authority must approve the combination of functions before the designation takes effect.", "That the DPO determines the purposes and means of processing and cannot monitor them independently.", "That as a manager the DPO may no longer be given access to the personal data of their own department."], "answer": 2, "feedback": ["The problem is not financial but the conflict of interests.", "The supervisory authority does not approve designations in advance.", "Correct. Whoever decides on processing cannot monitor it independently; the Belgian supervisory authority imposed fines of 50,000 and 75,000 euros for that.", "Access is precisely a right of the DPO; the problem lies in the decision-making power."]}, {"q": "Which statement about an external DPO is correct?", "options": ["An external DPO is not allowed; the DPO must be a staff member of the organisation.", "An external DPO need not be communicated to the supervisory authority, only an internal one.", "An external DPO can never be in a conflict of interests, because they stand outside the organisation.", "An external DPO is allowed, but they too may not be in a conflict of interests."], "answer": 3, "feedback": ["The Regulation explicitly allows a service contract.", "The contact details of an external DPO are also published and communicated.", "An external DPO can also have a conflict, for instance as a supplier of the organisation.", "Correct. External is allowed, but whoever manages the IT infrastructure, for example, assesses their own work as DPO."]}, {"q": "To whom does the DPO report?", "options": ["To the head of the department the DPO belongs to, such as legal affairs or IT.", "Directly to the highest management level.", "To the supervisory authority, which reviews the DPO's reports every year.", "To the works council, which safeguards the DPO's independence and approves the report."], "answer": 1, "feedback": ["A head of department can filter the advice; the Regulation requires a direct line to the top.", "Correct. Directly to the highest management level; a bank whose DPO did not report to the top was fined for that.", "The DPO reports internally; the DPO is not an extension of the supervisory authority.", "The works council is not a reporting line in the Regulation."]}, {"q": "What must the controller do with advice from the DPO that it does not want to follow?", "options": ["It may deviate, but explains in writing why, and which measures it takes instead.", "It must always follow the advice, because the DPO has the final say on data protection.", "It may set the advice aside without reasons, because it alone decides on the processing.", "It must first submit the disagreement to the supervisory authority, which settles the matter."], "answer": 0, "feedback": ["Correct. Deviating is allowed, deviating without reasons infringes accountability; the advice and the reply belong in the file.", "The DPO advises; the controller decides.", "Without reasons it cannot demonstrate that it has weighed up the risk.", "The supervisory authority does not intervene here; the decision and the reasons are internal."]}, {"q": "What about the DPO's access to personal data?", "options": ["The DPO has no right of access and works solely on the basis of the record, the policy and the procedures.", "The DPO must regularly check the files personally in order to perform the task of monitoring compliance.", "The DPO has a right of access, but only inspects the data themselves when the task requires it.", "The DPO is given access to the data only after approval by the supervisory authority and the highest management level."], "answer": 2, "feedback": ["The Regulation obliges the organisation to provide the DPO with access.", "Monitoring is not the same as consulting the files personally.", "Correct. The organisation provides access to data and processing operations, but actually inspecting the data is rarely needed for the task.", "The supervisory authority does not intervene here."]}, {"q": "Through a complaint from an employee, a DPO learns that a department is processing data unlawfully. Must the DPO report that to the supervisory authority?", "options": ["Yes, the DPO is obliged to report every infringement they find directly and without undue delay to the supervisory authority.", "Yes, but only if the employee who lodged the complaint explicitly asks for it in writing.", "No, because the DPO may never communicate with the supervisory authority without the board's permission.", "No, there is no such obligation; the DPO advises the organisation and is bound by confidentiality."], "answer": 3, "feedback": ["The DPO is not an extension of the authority; the duty to notify breaches rests on the controller.", "The employee's request does not change the role of the DPO.", "The DPO may very well cooperate and consult with the supervisory authority, and needs no permission for that.", "Correct. The DPO advises the organisation to bring the processing into order and documents the advice; the DPO is the contact point for the supervisory authority, not an inspector in its service."]}, {"q": "Who is sanctioned when the DPO is in a conflict of interests or is not involved in projects?", "options": ["The DPO personally, with an administrative fine in their own name.", "The organisation, as controller or processor.", "The highest manager personally, because the DPO reports directly to that person.", "Nobody, as long as no personal data breach has occurred or been notified."], "answer": 1, "feedback": ["The Regulation aims its sanctions at the controller and the processor.", "Correct. The obligations on the DPO rest on the organisation; it was the organisation that received the fine in the Belgian cases.", "The sanction hits the organisation as a legal person.", "A conflict of interests or a DPO who is not involved is in itself an infringement of the Regulation."]}]}</script>

<script>
(function(){
  const C = JSON.parse(document.getElementById('content').textContent);
  const U = C.ui;
  const RS = C.recordings ? C.recordings : (C.recording ? [Object.assign({id:'main'}, C.recording)] : []);
  const AUDIO_DIR = 'audio';
  const $ = id => document.getElementById(id);
  const fmt = (s,o) => s.replace(/\{(\w+)\}/g,(m,k)=>o[k]);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sections = ['intro','pres','quiz-intro','quiz','result','rec'];
  function show(id){ sections.forEach(s=>$(s).classList.toggle('hidden', s!==id)); $('nav-home').classList.toggle('on', id==='intro'); $('nav-slides').classList.toggle('on', id==='pres'); $('nav-quiz').classList.toggle('on', id==='quiz'||id==='quiz-intro'||id==='result'); $('nav-rec').classList.toggle('on', id==='rec'); if(id!=='rec' && typeof recPause==='function') recPause(); document.querySelector('.stage').classList.toggle('wide', id==='pres'); window.scrollTo({top:0,behavior:'smooth'}); }

  /* ---- teksten ---- */
  $('modlabel').textContent = C.course + ' · ' + C.module;
  $('footer').textContent = C.module + ' · ' + C.title + ' · Thomas More';
  $('intro-kicker').textContent = C.course + ' · ' + C.module;
  $('intro-title').textContent = C.title;
  $('intro-sub').textContent = C.subtitle;
  $('intro-lead').textContent = U.intro_lead;
  $('intro-goals').innerHTML = U.goals.map(g=>'<li><span>'+esc(g)+'</span></li>').join('');
  $('intro-meta').textContent = C.duration;
  $('btn-start').querySelector('span').textContent = U.start; $('btn-skip').textContent = U.skip_to_quiz;
  $('btn-skip').addEventListener('click',()=>{ show('quiz-intro'); });
  $('nav-home').textContent = U.nav_home; $('nav-slides').textContent = U.nav_slides; $('nav-quiz').textContent = U.nav_quiz;
  let started = false;
  /* verdieping: terug naar de hoofdmodule, op de slide vanwaar de cursist vertrok (?back=N → ?slide=N) */
  const QS = new URLSearchParams(location.search);
  function backUrl(){ const b=QS.get('back'); return (C.back&&C.back.url||'../../index.html') + (b ? '?slide='+encodeURIComponent(b) : ''); }
  if(C.back){ $('nav-back').textContent = '‹ ' + (C.back.label||U.back_label||U.nav_home); $('nav-back').classList.remove('hidden'); $('nav-back').addEventListener('click',()=>{ audio.pause(); location.href = backUrl(); }); }
  $('nav-home').addEventListener('click',()=>{ audio.pause(); show('intro'); });
  $('nav-slides').addEventListener('click',()=>{ if(C.profiles && !PROFILE){ show('intro'); return; } if($('pres').classList.contains('hidden')){ show('pres'); if(!started){ started=true; go(0,false); } } });
  $('nav-quiz').addEventListener('click',()=>{ audio.pause(); if(!$('quiz').classList.contains('hidden')||!$('result').classList.contains('hidden')) return; if(typeof paused!=='undefined' && paused){ $('btn-resume').click(); } else show('quiz-intro'); });
  $('btn-prev').querySelector('span').textContent = U.prev;
  $('btn-next').querySelector('span').textContent = U.next;
  $('lbl-autoplay').textContent = U.autoplay_short || U.autoplay; $('lbl-autoplay-wrap').title = U.autoplay; $('speed').title = U.speed; $('btn-prev').title = U.prev; $('btn-next').title = U.next;
  let rate = 1; try{ rate = parseFloat(localStorage.getItem('module-speed')) || 1; }catch(e){}
  const RATES=[1,1.25,1.5];
  function setRate(r){ rate = r; audio.playbackRate = r; $('speed').textContent = r+'×'; $('speed').classList.toggle('fast', r!==1); $('speed').title = U.speed + ': ' + r + '×'; try{ localStorage.setItem('module-speed', String(r)); }catch(e){} }
  $('speed').addEventListener('click',()=>{ setRate(RATES[(RATES.indexOf(rate)+1)%RATES.length]); });
  $('qi-title').textContent = U.quiz_intro_title;
  $('qi-text').textContent = U.quiz_intro_text;
  $('btn-quiz-start').textContent = U.quiz_start;
  $('btn-review-1').textContent = U.review;
  $('btn-review-2').textContent = U.review;
  $('btn-retry').textContent = U.retry;
  $('r-title').textContent = U.result_title;
  $('btn-q-back').querySelector('span').textContent = U.back_to_slides;
  $('btn-resume').textContent = U.resume_quiz;
  $('btn-pdf').querySelector('span').textContent = U.download_pdf;
  $('ai-title').textContent = U.ai_notice_title; $('ai-text').textContent = U.ai_notice; $('ai-badge').querySelector('span').textContent = U.ai_voice_label; $('ai-footer').textContent = U.ai_footer; document.querySelectorAll('.ai-notice img,.ai-badge img,.ai-line img').forEach(im=>im.alt=U.ai_icon_alt);
  $('t-title').textContent = U.transcript; $('btn-text-hide').textContent = U.hide_text; $('btn-text-show').textContent = U.show_text;
  const NOQUIZ = !(C.quiz && C.quiz.length) && !(C.quizzes && C.quizzes.length);
  if(NOQUIZ){ $('btn-skip').classList.add('hidden'); $('nav-quiz').classList.add('hidden'); }
  $('btn-text-hide').addEventListener('click',()=>{ if(AV){ const t=$('transcript'); t.classList.toggle('notext'); $('btn-text-hide').textContent = t.classList.contains('notext') ? U.show_text : U.hide_text; return; } $('transcript').classList.add('hidden'); $('pres-grid').classList.remove('with-text'); $('btn-text-show').classList.remove('hidden'); });
  $('btn-text-show').addEventListener('click',()=>{ $('transcript').classList.remove('hidden'); $('pres-grid').classList.add('with-text'); $('btn-text-show').classList.add('hidden'); });
  let sent=[], sentEnds=[];
  function setTranscript(t){ sent = t.split(/(?<=[.!?…])\s+(?=\S)/).filter(x=>x.length).map((x,n,a)=>n<a.length-1?x+' ':x); let acc=0, tot=t.length; sentEnds = sent.map(x=>{ acc+=x.length; return acc/tot; }); $('t-body').innerHTML = sent.map((x,n)=>'<span data-n="'+n+'">'+esc(x)+'</span>').join(''); $('t-body').scrollTop=0; }
  function highlight(){ if(!audio.duration) return; const f=audio.currentTime/audio.duration; let k=sentEnds.findIndex(e=>f<e); if(k<0) k=sent.length-1; [...$('t-body').children].forEach((el,n)=>{ const on=n===k; if(on!==el.classList.contains('now')){ el.classList.toggle('now',on); if(on) el.scrollIntoView({block:'nearest',behavior:'smooth'}); } }); }

  /* ---- slides ---- */
  const ALL = C.slides; let S = ALL; let i = 0; const seen = new Set(); let PROFILE = null;
  function setProfile(id){ PROFILE = id; S = ALL.filter(x=>!x.profiles || x.profiles.includes(id)); seen.clear(); i = 0; const pr=(C.profiles||[]).find(x=>x.id===id); $('modlabel').innerHTML = esc(C.course + ' · ' + C.module) + (pr?'<span class="profchip">'+esc(pr.short||pr.label)+'</span>':''); }
  const AV = C.avatar || null;
  const audio = AV ? $('avatar-video') : new Audio(); audio.preload = 'auto';
  if(AV){ $('avatar-box').classList.remove('hidden'); $('transcript').classList.add('has-avatar'); $('avatar-tag').textContent = AV.label || ''; }

  $('btn-prev').addEventListener('click',()=>go(i-1,true));
  $('btn-next').addEventListener('click',()=>{ if(i===S.length-1){ audio.pause(); if(NOQUIZ){ if(C.back){ location.href=backUrl(); } else show('intro'); } else show('quiz-intro'); } else go(i+1,true); });
  $('btn-start').addEventListener('click',()=>{ started=true; show('pres'); go(0,true); });
  if(C.profiles){
    $('btn-start').classList.add('hidden'); $('prof-lead').classList.remove('hidden'); $('prof-lead').textContent = U.profile_lead||'Waar werk je?';
    $('profiles').classList.remove('hidden');
    $('profiles').innerHTML = C.profiles.map(pr=>'<button class="qset" data-p="'+esc(pr.id)+'"><small>'+esc(U.profile_kicker||'Kies je pad')+'</small><b>'+esc(pr.label)+'</b><span>'+esc(pr.desc||'')+'</span></button>').join('');
    $('profiles').addEventListener('click',e=>{ const b=e.target.closest('.qset'); if(!b) return; setProfile(b.dataset.p); started=true; clearResume(); show('pres'); go(0,true); });
  }
  if(U.optional_skip){ $('btn-opt-skip').textContent = U.optional_skip; }
  $('btn-opt-skip').addEventListener('click',()=>{ audio.pause(); let k=i; while(k<S.length && S[k].optional) k++; if(k>=S.length) show('quiz-intro'); else go(k,true); });
  setRate(rate);
  document.addEventListener('keydown',e=>{
    if($('pres').classList.contains('hidden')) return;
    if(e.key==='ArrowRight'){ if(i<S.length-1) go(i+1,true); }
    else if(e.key==='ArrowLeft'){ go(i-1,true); }
    else if(e.key===' '){ e.preventDefault(); $('btn-play').click(); }
  });

  /* ---- opname (Vimeo, ingebed; tijdcodes in seconden) ---- */
  /* één opname (C.recording) of meerdere (C.recordings: [{id,short,vimeo,hash,title,source,chapters}]) */
  const R = RS.length ? RS[0] : null; let cur=null, recReady=false, recFrom=null, recPending=null;
  const VORIGIN='https://player.vimeo.com';
  function recById(v){ return RS.find(r=>r.id===v) || RS[0]; }
  function recShort(v){ return (RS.length>1 && v) ? esc(recById(v).short||'')+' · ' : ''; }
  function recPost(method,value){ const f=$('rec-player').querySelector('iframe'); if(f&&f.contentWindow) f.contentWindow.postMessage(JSON.stringify(value===undefined?{method}:{method,value}), VORIGIN); }
  function recPause(){ if(recReady) recPost('pause'); }
  function recMark(sec){ if(!cur) return; let k=null; cur.chapters.forEach((c,n)=>{ if(c.t<=sec+1) k=cur.id+':'+n; }); [...$('rec-ch').querySelectorAll('button')].forEach(b=>{ const on=b.dataset.k===k; if(on && !b.classList.contains('on')){ const c=$('rec-ch'); c.scrollTop=Math.max(0,b.offsetTop-c.clientHeight/3); } b.classList.toggle('on', on); }); }
  function openRec(t, from, v){
    if(!R) return; audio.pause(); recFrom = (from==null?null:from);
    const want = v ? recById(v) : (cur || R);
    $('btn-rec-back').classList.toggle('hidden', recFrom==null); if(recFrom==='quiz') $('btn-rec-back').textContent = '‹ '+(U.rec_back_quiz||'Terug naar de vraag'); else if(recFrom!=null) $('btn-rec-back').textContent = '‹ '+fmt(U.rec_back||'Terug naar slide {n}',{n:recFrom+1});
    show('rec');
    $('rec-title').textContent = want.title; $('rec-src').textContent = want.source;
    const f=$('rec-player').querySelector('iframe');
    if(!f || want!==cur){ cur=want; recReady=false; recPending=t; $('rec-player').innerHTML='<iframe src="'+VORIGIN+'/video/'+esc(cur.vimeo)+'?'+(cur.hash?'h='+esc(cur.hash)+'&':'')+'autoplay='+(t!=null?1:0)+'&dnt=1&title=0&byline=0&portrait=0#t='+Math.floor(t||0)+'s" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="'+esc(cur.title)+'"></iframe>'; }
    else if(t!=null){ if(recReady){ recPost('setCurrentTime',Math.floor(t)); recPost('play'); } else recPending=t; }
    recMark(t!=null?t:-5);
  }
  if(R){
    $('nav-rec').classList.remove('hidden'); $('nav-rec').textContent = U.nav_rec||'Opname';
    $('nav-rec').addEventListener('click',()=>{ if($('rec').classList.contains('hidden')) openRec(null,null); });
    $('rec-title').textContent = R.title; $('rec-src').textContent = R.source; $('rec-note').textContent = U.rec_note||'';
    let html='';
    RS.forEach(r=>{ let part=null; if(RS.length>1) html+='<h4 class="rv">'+esc(r.short||r.title)+'</h4>';
      r.chapters.forEach((c,n)=>{ if(c.part && c.part!==part){ part=c.part; html+='<h4>'+esc(part)+'</h4>'; } html+='<button data-k="'+esc(r.id)+':'+n+'" data-v="'+esc(r.id)+'" data-t="'+c.t+'" class="'+(c.q?'q':'')+'"><span class="tc">'+hms(c.t)+'</span><span>'+(c.q?'<b class="qp">'+esc(U.rec_q||'Vraag')+' · </b>':'')+esc(c.k)+'</span></button>'; }); });
    $('rec-ch').innerHTML = html;
    $('rec-ch').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) openRec(+b.dataset.t, recFrom, b.dataset.v); });
    $('btn-rec-back').addEventListener('click',()=>{ recPause(); show(recFrom==='quiz'?'quiz':'pres'); });
    window.addEventListener('message',e=>{
      if(e.origin!==VORIGIN) return; let d=e.data; try{ if(typeof d==='string') d=JSON.parse(d); }catch(x){ return; }
      const f=$('rec-player').querySelector('iframe'); if(f && e.source!==f.contentWindow) return;
      if(d.event==='ready'){ recReady=true; recPost('addEventListener','timeupdate'); if(recPending!=null){ recPost('setCurrentTime',Math.floor(recPending)); recPost('play'); recPending=null; } }
      else if(d.event==='timeupdate' && d.data){ recMark(d.data.seconds); }
    });
    if(C.source_line){ $('intro-src').textContent = C.source_line; $('intro-src').classList.remove('hidden'); }
  }

  /* ---- quiz ---- */
  /* quizsets: C.quiz is de hoofdquiz; C.quizzes (optioneel) zijn extra oefenreeksen [{id,title,intro,questions}] */
  const SETS = (C.quizzes && C.quizzes.length) ? C.quizzes : [{id:'main', title:U.quiz_intro_title, intro:U.quiz_intro_text, questions:C.quiz}];
  let curSet = SETS[0], Q = curSet.questions; let qi = 0, answers = [];
  function selectSet(k){ curSet = SETS[k]; Q = curSet.questions; }
  if(SETS.length>1){
    $('qi-title').textContent = U.quiz_choose_title || U.quiz_intro_title;
    $('qi-text').textContent = U.quiz_choose_text || U.quiz_intro_text;
    $('btn-quiz-start').classList.add('hidden');
    $('qsets').classList.remove('hidden');
    $('qsets').innerHTML = SETS.map((st,k)=>'<button class="qset" data-k="'+k+'"><small>'+esc(fmt(U.quiz_set_count||'{n}',{n:st.questions.length}))+'</small><b>'+esc(st.title)+'</b><span>'+esc(st.intro||'')+'</span></button>').join('');
    $('qsets').addEventListener('click',e=>{ const b=e.target.closest('.qset'); if(!b) return; selectSet(+b.dataset.k); startQuiz(); });
    $('btn-sets').classList.remove('hidden'); $('btn-sets').textContent = U.quiz_back_to_sets || U.review;
    $('btn-sets').addEventListener('click',()=>{ clearResume(); show('quiz-intro'); });
  }
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    if(q.context){ $('q-ctx').innerHTML = (U.q_ctx_label?'<span class="ctx-k">'+esc(U.q_ctx_label)+'</span>':'')+esc(q.context); $('q-ctx').classList.remove('hidden'); } else { $('q-ctx').classList.add('hidden'); $('q-ctx').innerHTML=''; }
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');
    $('btn-q-next').textContent = qi===Q.length-1 ? U.show_result : U.next_question;
  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const n = +b.dataset.n, q = Q[qi], ok = n===q.answer;
    answers[qi] = n;
    [...$('opts').children].forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add('ok'); else if(k===n) o.classList.add('bad'); else o.classList.add('dim'); });
    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n])
      + (q.key?'<div class="fb-key"><b>'+esc(U.q_key_label||'À retenir')+' —</b>'+esc(q.key)+'</div>':'')
      + (q.rec&&RS.length?'<div class="fb-rec"><span>▶ '+esc(U.rec_btn_text||'In de opname')+'</span>'+q.rec.map(r=>'<button class="btn ghost" data-rect="'+r.t+'" data-recv="'+esc(r.v||'')+'">'+esc(r.label)+'<small>'+recShort(r.v)+hms(r.t)+'</small></button>').join('')+'</div>':'')
      + (q.links&&q.links.length?'<div class="fb-rec fb-src"><span>📄 '+esc(U.q_src_label||'La source')+'</span>'+q.links.map(l=>'<a class="btn ghost" target="_blank" rel="noopener" href="'+esc(l.url)+'">'+esc(l.label)+' ↗</a>').join('')+'</div>':'');
    $('fb').querySelectorAll('[data-rect]').forEach(b=>b.addEventListener('click',()=>openRec(+b.dataset.rect,'quiz',b.dataset.recv||null)));
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>'; $('r-title').textContent = SETS.length>1 ? curSet.title+' — '+U.result_title : U.result_title;
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});
    $('r-msg').textContent = score>=tot*0.8 ? U.result_good : (score>=tot*0.5 ? U.result_mid : U.result_low);
    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');
  }
  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
  { const sl=parseInt(QS.get('slide')||'0'); if(sl>=1 && sl<=S.length && !C.profiles){ started=true; show('pres'); go(sl-1,false); history.replaceState(null,'',location.pathname); } }
})();
</script>
