 "title": "The rights of the data subject: from information to restriction", "subtitle": "Chapter III of the GDPR: how the rights fit together, which ground rules apply to every request, and when a right does and does not apply", "script": "A customer of a webshop sends an email. What do you all know about me, and please delete it. Customer service forwards the email to IT, IT to the legal department, and six weeks later it lands with the data protection officer. In the meantime the customer has already lodged a complaint with the supervisory authority. Not because the webshop did anything wrong with his data, but because nobody knew what those two sentences meant legally, and who had to answer within what deadline. In this quarter of an hour we look at the chapter of the GDPR that deals with exactly that: the rights of the data subject. First the structure and the interplay, then the ground rules for every request, and then each right in brief: what it means, and when it does and does not apply. For each right you can click straight through to a short deep dive. Afterwards you will recognise those two sentences as two requests, and you will know what has to happen within the month."}, {"id": 2, "type": "table", "chip": "Where we are", "title": "Chapter III: the rights of the data subject, between the principles and the obligations", "head": ["Chapter", "Subject"], "rows": [["I", "General provisions: scope and definitions"], ["II", "Principles: the basic principles, the legal bases, the special categories"], ["III", "Rights of the data subject (Articles 12 to 23)"], ["IV", "Controller and processor: register, security, data breaches, DPIA, data protection officer"], ["V", "Transfers to third countries"], ["VI–VII", "Supervisory authorities and cooperation"], ["VIII", "Remedies, liability and penalties"], ["IX–XI", "Specific situations, delegated acts, final provisions"]], "hl": [2], "read": {"text": "Look at the table of contents of the GDPR: Chapter III follows immediately after the principles.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "First, where it sits in the Regulation. Look at the table. The GDPR has eleven chapters. You already know the first two: the scope and the definitions, and then the principles, with the basic principles, the legal bases and the special categories. That is about what an organisation may do. The third chapter turns the perspective around. It looks at the same processing through the eyes of the person the data are about: what may that person ask, and what must the organisation then do? That is the chapter of this module. It is no accident that it sits here. The principles require that processing is lawful, fair and transparent. The rights are the way the data subject can check and enforce that for himself. And the fourth chapter, on the obligations of the controller, builds on that: who answers, how you organise it, how you demonstrate it. So remember: after the principles come the rights, and those rights are the keystone of transparency."}, {"id": 3, "type": "chain", "chip": "The structure", "title": "Five sections: ground rules, information and access, rectification and erasure, objection and automated decisions, restrictions", "steps": [{"k": "Section 1", "t": "Transparency and modalities: the ground rules for every request (Article 12)."}, {"k": "Section 2", "t": "Information and access: information where data are collected directly and indirectly, and the right of access (Articles 13 to 15)."}, {"k": "Section 3", "t": "Rectification and erasure: rectification, erasure, restriction, notification to recipients and data portability (Articles 16 to 20)."}, {"k": "Section 4", "t": "Objection and automated individual decision-making (Articles 21 and 22)."}, {"k": "Section 5", "t": "Restrictions: when a law may limit the rights (Article 23)."}], "read": {"text": "Read the titles of the five sections in Chapter III.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "The chapter consists of five sections, and the order is logical. The first section contains no right, but the ground rules that apply to all rights: in what form, within what deadline, at what price. The second section is about knowing: what information you receive when an organisation collects your data, and the right to request access. The third section is about intervening in the data themselves: having them corrected, having them erased, having their use restricted, and taking them with you to another provider. The fourth section is about intervening in the processing: objecting, and not being subject to a decision taken by a machine alone. The fifth section is the exception: the cases in which a law may restrict those rights. So remember: first the ground rules, then knowing, then intervening in the data, then in the processing, and finally the limits."}, {"id": 4, "type": "figure", "chip": "How they fit together", "title": "Information is the starting point; the other rights intervene in the processing or in the data", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 540\" role=\"img\" aria-label=\"Flow chart: the right to information as the starting point; rights with an impact on the processing (withdrawing consent, objection, automated decisions) and rights with an impact on the data (access, portability), which can lead to rectification, erasure and restriction.\"><defs><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"ar pd\"/><\/marker><\/defs><rect class=\"lane\" x=\"330\" y=\"20\" width=\"250\" height=\"250\" rx=\"14\"/><text class=\"lane\" x=\"455\" y=\"42\" text-anchor=\"middle\">Impact on the processing<\/text><rect class=\"lane\" x=\"330\" y=\"300\" width=\"250\" height=\"220\" rx=\"14\"/><text class=\"lane\" x=\"455\" y=\"322\" text-anchor=\"middle\">Impact on the data<\/text><rect class=\"p\" x=\"20\" y=\"215\" width=\"190\" height=\"110\" rx=\"12\"/><text x=\"115.0\" y=\"253.65\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700\">Right to<\/text><text x=\"115.0\" y=\"276.65\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700\">information<\/text><text x=\"115.0\" y=\"299.65\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700\">(12 + 13 + 14)<\/text><text class=\"lbl\" x=\"115\" y=\"345\" text-anchor=\"middle\">Starting point<\/text><rect class=\"ee\" x=\"350\" y=\"55\" width=\"210\" height=\"60\" rx=\"12\"/><text x=\"455.0\" y=\"80.3\" text-anchor=\"middle\" style=\"font-size:18px\">Withdraw consent<\/text><text x=\"455.0\" y=\"102.3\" text-anchor=\"middle\" style=\"font-size:18px\">(7(3))<\/text><rect class=\"ee\" x=\"350\" y=\"125\" width=\"210\" height=\"60\" rx=\"12\"/><text x=\"455.0\" y=\"161.3\" text-anchor=\"middle\" style=\"font-size:18px\">Right to object (21)<\/text><rect class=\"ee\" x=\"350\" y=\"195\" width=\"210\" height=\"65\" rx=\"12\"/><text x=\"455.0\" y=\"213.1\" text-anchor=\"middle\" style=\"font-size:16px\">Not subject to<\/text><text x=\"455.0\" y=\"233.1\" text-anchor=\"middle\" style=\"font-size:16px\">automated<\/text><text x=\"455.0\" y=\"253.1\" text-anchor=\"middle\" style=\"font-size:16px\">decisions (22)<\/text><rect class=\"ee\" x=\"350\" y=\"340\" width=\"210\" height=\"70\" rx=\"12\"/><text x=\"455.0\" y=\"370.3\" text-anchor=\"middle\" style=\"font-size:18px\">Right of access<\/text><text x=\"455.0\" y=\"392.3\" text-anchor=\"middle\" style=\"font-size:18px\">and copy (15)<\/text><rect class=\"ee\" x=\"350\" y=\"430\" width=\"210\" height=\"70\" rx=\"12\"/><text x=\"455.0\" y=\"460.3\" text-anchor=\"middle\" style=\"font-size:18px\">Data portability<\/text><text x=\"455.0\" y=\"482.3\" text-anchor=\"middle\" style=\"font-size:18px\">(20)<\/text><rect class=\"p\" x=\"770\" y=\"60\" width=\"210\" height=\"80\" rx=\"12\"/><text x=\"875.0\" y=\"95.3\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700\">Restriction of<\/text><text x=\"875.0\" y=\"117.3\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700\">processing (18)<\/text><rect class=\"ee\" x=\"770\" y=\"230\" width=\"210\" height=\"65\" rx=\"12\"/><text x=\"875.0\" y=\"268.8\" text-anchor=\"middle\" style=\"font-size:18px\">Rectification (16)<\/text><rect class=\"ee\" x=\"770\" y=\"320\" width=\"210\" height=\"65\" rx=\"12\"/><text x=\"875.0\" y=\"358.8\" text-anchor=\"middle\" style=\"font-size:18px\">Erasure (17)<\/text><rect class=\"ee\" x=\"770\" y=\"420\" width=\"210\" height=\"80\" rx=\"12\"/><text x=\"875.0\" y=\"455.45\" text-anchor=\"middle\" style=\"font-size:17px\">Right to be forgotten<\/text><text x=\"875.0\" y=\"476.45\" text-anchor=\"middle\" style=\"font-size:17px\">(17(2))<\/text><line class=\"fl pd\" x1=\"212\" y1=\"250\" x2=\"330\" y2=\"150\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"255\" y=\"180\" text-anchor=\"middle\">impact on the processing<\/text><line class=\"fl pd\" x1=\"212\" y1=\"290\" x2=\"330\" y2=\"400\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"255\" y=\"365\" text-anchor=\"middle\">impact on the data<\/text><line class=\"fl pd\" x1=\"560\" y1=\"155\" x2=\"770\" y2=\"110\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"665\" y=\"115\" text-anchor=\"middle\">consequence<\/text><line class=\"fl pd\" x1=\"560\" y1=\"360\" x2=\"770\" y2=\"130\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"690\" y=\"215\" text-anchor=\"middle\">can lead to<\/text><line class=\"fl pd\" x1=\"560\" y1=\"465\" x2=\"770\" y2=\"460\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"665\" y=\"448\" text-anchor=\"middle\">can lead to<\/text><line class=\"fl pd\" x1=\"875\" y1=\"230\" x2=\"875\" y2=\"142\" marker-end=\"url(#arr)\"/><text class=\"lbl pd\" x=\"930\" y=\"190\" text-anchor=\"middle\">can lead to<\/text><\/svg>", "caption": "The rights as a whole: the right to information as the starting point, two groups of rights, and what can follow from them.", "script": "Now how they fit together, and this is the figure to remember. Everything starts on the left, with the right to information: whoever does not know that an organisation is processing his data will find it hard to exercise any other right. From there, two arrows leave. The upper one goes to the rights with an impact on the processing. The data subject says: stop, or not like this. He withdraws his consent, objects, or refuses to be subject to a decision taken by a machine alone. The lower arrow goes to the rights with an impact on the data themselves. The data subject says: show me, or hand it over. He asks for access and a copy, or for his data in a usable format so he can take them with him. And then the arrows to the right. Whoever obtained access sometimes discovers an error and asks for rectification, or feels the data can go and asks for erasure. While that is being examined, or an objection is being weighed, he can ask for restriction: the data stay where they are, but are not used. So remember: information is the beginning, and rectification, erasure and restriction are the consequences."}, {"id": 5, "type": "bullets", "chip": "Section 1 · the ground rules", "title": "One regime for every request: who, form, channel, deadline, costs, refusal and identity", "bullets": [{"k": "Who", "t": "the controller gives effect to the rights of the data subject; the processor may assist, but does not bear the final responsibility."}, {"k": "Form", "t": "concise, transparent, intelligible, easily accessible and in clear and plain language; in writing or electronically, orally if the data subject asks; adapted to the audience, for example tailored to children if the processing is aimed at them."}, {"k": "Channel", "t": "the controller chooses a clear channel to convey the information and to let the rights be exercised, without obstacles."}, {"k": "Deadline", "t": "answer without undue delay and at the latest within one month; for complex or numerous requests extendable by two months, provided the data subject is informed within the first month."}, {"k": "Free of charge", "t": "in principle free; only for manifestly unfounded or excessive requests may a reasonable fee be charged or the request refused, and the organisation must demonstrate that."}, {"k": "Refusal", "t": "whoever does not act on a request says why within the month, and points to the complaint with the supervisory authority and the judicial remedy."}, {"k": "Identity", "t": "in case of reasonable doubt the organisation may ask for additional information to confirm the identity."}], "read": {"text": "Read the full ground rules in Article 12, including the deadlines and the rule for manifestly unfounded requests.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "Let us first discuss the ground rules, because they apply to every request. First of all: although the processor may assist by supporting a request, it is the controller who gives effect to the rights of the data subject. This is possibly the most important consequence of being qualified as a controller, namely the final responsibility for giving effect to the rights of a data subject. We list the ground rules in six points. The first point is the form: the controller communicates information about the processing concisely, intelligibly, in clear and plain language, and adapted to the target audience. If the processing is aimed at children, for example, then the information must be tailored to them. A second ground rule is the information channel: the controller chooses a clear channel to convey the information or to let the rights be exercised. The third ground rule is the deadline within which the rights must be given effect. For a DPO this deadline is an important element: the controller answers without undue delay and at the latest within one month. Only for complex or numerous requests may that period be extended by two months, and you let the person know within that first month. The webshop from the beginning, after six weeks of forwarding, was therefore already too late. The fourth ground rule is that it is free of charge: only for a manifestly unfounded or excessive request, for example the same question every week, may you charge a fee or refuse, and you have to demonstrate that. The fifth ground rule is refusal: whoever rejects a request says why within the month, and points to the complaint with the supervisory authority and the appeal to the courts. The sixth and last measure is identity: in case of reasonable doubt you may ask for additional information, but no more than necessary. So remember: the controller gives effect, intelligibly, through a clear channel, within the month, free of charge, and with an explanation in case of refusal."}, {"id": 6, "type": "quote", "chip": "The exception before the chapter", "title": "Whoever cannot identify the data subject need not grant all rights", "source": "Article 11(2) GDPR", "quote": "Where, in cases referred to in paragraph 1 of this Article, the controller is able to demonstrate that it is not in a position to identify the data subject, the controller shall inform the data subject accordingly, if possible. In such cases, Articles 15 to 20 shall not apply except where the data subject, for the purpose of exercising his or her rights under those articles, provides additional information enabling his or her identification.", "bullets": [{"k": "Why this article sits in Chapter II", "t": "it is not a right of the data subject but a consequence of data minimisation: whoever needs no identifying data must not keep any, not even to comply with the GDPR."}, {"k": "The consequence for the rights", "t": "if the organisation can demonstrate that it cannot identify the data subject, then access, rectification, erasure, restriction, notification and portability do not apply, unless the data subject himself provides additional information."}, {"k": "The link with the ground rules", "t": "the controller may not simply refuse a request by arguing that it does not know the person; it must demonstrate that it cannot identify him."}], "read": {"text": "Read Article 11 in full, and Article 12(2), which refers to it.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "One more provision, and it sits just before the chapter, at the end of the principles. An example. A website counts visitors with data it cannot link to anyone. Someone emails: give me access to my data. The organisation cannot find him. The rule then says two things. One: whoever does not need identification for his purpose must not keep extra identifying data merely in order to comply with the Regulation. That is a consequence of data minimisation, and that is why this provision sits with the principles and not with the rights. Two: if the organisation can demonstrate that it cannot identify the data subject, then the rights that touch the data themselves do not apply: access, rectification, erasure, restriction, notification and portability. Unless the data subject himself provides additional information that does make it possible to find him. Note the word demonstrate: an organisation may not simply say that it does not know someone. So remember: whoever cannot identify anyone need not give anyone access either, but does have to demonstrate that."}, {"id": 7, "type": "compare", "chip": "Section 2 · information", "title": "The right to information: collected directly from the data subject, or not", "left": {"head": "Directly from the data subject (Article 13)", "items": ["Moment: when the data are obtained, so on the form, in the app, at the counter", "Content: who, for what purpose, on which legal basis, to whom, for how long, which rights, complaint with the supervisory authority", "Plus: whether the data subject is obliged to provide the data, and what happens if he does not", "Not needed: where and in so far as the data subject already has the information"]}, "right": {"head": "Not obtained from the data subject (Article 14)", "items": ["Moment: within a reasonable period and at the latest within one month, at the first contact, or at the first disclosure to another", "Content: the same information, plus the categories of data and the source", "Exceptions: the data subject already has the information, informing is impossible or disproportionate, the law requires the obtaining, or professional secrecy applies", "Typical: address lists, data of a partner or a parent, data from another organisation"]}, "deep": {"url": "verdieping/informatie/index.html", "text": "the two duties to inform in detail, with decisions of the Data Protection Authority on late, incomplete or missing information."}, "read": {"text": "Read the list of information to be provided in Articles 13 and 14.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "Then the starting point: the right to information. The Regulation makes a distinction depending on where the data come from. On the left: the data are collected directly from the data subject, on a form, in an app, at the counter. Then he receives the information at that moment: who the organisation is, for what purpose and on what legal basis it uses the data, to whom they are passed on, how long they are kept, what rights he has, and that he can lodge a complaint. And something that is often forgotten: whether he is obliged to provide the data, and what happens if he does not. On the right is the second situation: the data do not come from the data subject himself. Think of an address list you buy, of the partner an employee names as a contact person, or of data that another organisation sends you. In that situation the data subject is entitled to the same information as in the first situation, with two extra elements: which categories of data you hold, and where they come from. What does differ is the moment. You cannot give the information at the moment of collection, because the data subject is not there. That is why the Regulation gives three possible moments, and the earliest one applies: within a reasonable period and at the latest one month after you obtained the data; at the moment of the first contact, if you use the data to communicate with the person; or at the moment of the first disclosure, if you pass the data on to someone else. For this second situation there are also exceptions to the duty to inform, for example when the data subject already has the information, or when informing is impossible or would involve a disproportionate effort. The deep dive looks at both situations through decisions of the Data Protection Authority. So remember: if the data are collected directly from the data subject, you inform immediately; if they come from elsewhere, you inform within the month, and earlier if you make contact or pass the data on before then."}, {"id": 8, "type": "reveal", "chip": "Think-along exercise 1", "title": "The recruiter and the reference", "question": "A company receives from a recruitment agency the CV of a candidate, containing the name and telephone number of her previous manager as a reference. The company calls that manager and keeps his answers in the application file. Must the company inform the manager, and if so, when?", "verdict": "Yes: at the latest at the first contact, so during the phone call itself", "answer": [{"k": "Why", "t": "the manager's data (name, position, telephone number, his statements) do not come from him but from the candidate; so the duty to inform for data obtained indirectly applies."}, {"k": "When", "t": "the data are used to communicate with him, so at the latest at the moment of the first contact: at the start of the conversation you say who you are, why you are calling and what happens with his answers."}, {"k": "How", "t": "briefly and orally during the conversation, with a reference to the privacy notice for the full information; a separate letter is not needed if the information is given this way."}], "script": "First think-along exercise. A company receives from a recruitment agency the CV of a candidate, with the name and telephone number of her previous manager as a reference. The company calls that man and notes his answers in the application file. Must the company inform the manager, and if so, when? Think about it for a moment. … Yes. His name, his telephone number and soon his statements too are personal data, and they come not from him but from the candidate. So the duty to inform for data obtained indirectly applies. When? The data serve to communicate with him, and then the moment is at the latest the first contact: the phone call itself. At the start of the call you say who you are, why you are calling and what happens with his answers, and refer to the privacy notice for the rest. So remember: even someone who is not applying but ends up in the file has a right to information."}, {"id": 9, "type": "quote", "chip": "Section 2 · access", "title": "The right of access consists of two parts: the access itself and the copy", "source": "Article 15(1) GDPR", "quote": "The data subject shall have the right to obtain from the controller confirmation as to whether or not personal data concerning him or her are being processed, and, where that is the case, access to the personal data and the following information:", "bullets": [{"k": "Part 1 · the access (paragraph 1)", "t": "first confirmation: are you processing data about me, yes or no; then access to the data themselves, and information about the processing: purposes, categories, recipients, retention period, source, automated decision-making and the other rights."}, {"k": "Part 2 · the copy (paragraph 3)", "t": "the data subject receives a copy of the data, for an electronic request in a commonly used electronic form; only additional copies may cost something."}, {"k": "The limit", "t": "the copy does not adversely affect the rights and freedoms of others: data of third parties or trade secrets may be shielded, but that is no reason to refuse everything."}, {"k": "When not", "t": "only when the organisation demonstrates that it cannot identify the data subject, or when a law restricts the right."}], "deep": {"url": "verdieping/inzage/index.html", "text": "how you handle an access request, what the copy must contain, and what can follow afterwards: rectification, erasure, restriction and notification."}, "read": {"text": "Read the full list in Article 15(1), and the rules on the copy in paragraphs 3 and 4.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "The second right in this section is the right of access, in practice the most used. It is useful to open this article yourself, because it consists of two clearly different parts, and that is also the best way to look it up. The first part is the right of access in the strict sense. That starts with confirmation: the data subject may know whether data about him are being processed, yes or no. If the answer is yes, then he has a right of access to those data themselves, and on top of that to information about the processing: what the data are used for, to whom they have been disclosed, how long they are kept, where they come from, and whether there is automated decision-making. The second part is the right to a copy, and that comes further down in the article, in a separate paragraph. The data subject receives a copy of the data, for an electronic request in a commonly used electronic form, and that first copy is free. On that second part there is one limit: the copy may not adversely affect the rights of others. So you shield data of third parties or trade secrets, but that is never a reason to refuse the whole request. When does the right not apply? Only in two cases: when the organisation demonstrates that it cannot identify the person, and when a law restricts the right. An access request is often the beginning of something else: whoever sees his data discovers an error or feels they can go. The deep dive shows how you handle such a request and what follows from it. So remember: the article has two parts, first access with confirmation, the data and the context, and alongside that the copy; read it that way too."}, {"id": 10, "type": "cards", "chip": "Section 3 · intervening in the data", "title": "Rectification, erasure, restriction and notification: the consequences of access", "cols": 4, "cards": [{"k": "Rectification (16)", "t": "have inaccurate data corrected without undue delay and incomplete data completed, taking into account the purpose.", "sub": "Always applies"}, {"k": "Erasure (17)", "t": "have data erased when they are no longer needed, on withdrawal of consent, after an objection, in case of unlawful processing, under a legal obligation, or for online services to children.", "sub": "Not for: freedom of expression, legal obligation, public health, archiving, legal claims"}, {"k": "Restriction (18)", "t": "the data stay stored but are not used: during the check of their accuracy, in case of an objection, or if the data subject needs them for legal claims.", "sub": "A pause button, not erasure"}, {"k": "Notification (19)", "t": "every rectification, erasure or restriction is communicated to each recipient to whom the data have been disclosed, unless that is impossible or involves a disproportionate effort.", "sub": "The data subject may ask who those recipients are"}], "deep": {"url": "verdieping/inzage/index.html", "text": "the four consequences one by one, with the history of the right to be forgotten and the exceptions to erasure."}, "read": {"text": "Read the conditions and exceptions in Articles 16 to 19.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "The third section: intervening in the data themselves. Four rights, and they often follow an access request. The first right is rectification: inaccurate data you have corrected without undue delay, incomplete data you have completed. This right always applies. The second right is erasure, also called the right to be forgotten, and that right is not absolute. It applies in a list of cases: the data are no longer needed, consent has been withdrawn, an objection has been made, the processing was unlawful, a law requires erasure, or it concerns an online service for a child. And it does not apply when the processing is needed for freedom of expression, a legal obligation, public health, archiving or research, or legal claims. The third right is restriction, the pause button: the data stay stored but are not used, for example while their accuracy is being checked. A fourth way of intervening is notification after disclosure. If you have passed the data on to others, you also report every rectification, erasure or restriction to those recipients, unless that is impossible or involves a disproportionate effort. So remember: correct always, erase in certain cases, restrict as a pause, and notify the recipients."}, {"id": 11, "type": "quote", "chip": "Section 3 · portability", "title": "The right to data portability: taking your data with you, in a usable format", "source": "Article 20(1) GDPR", "quote": "The data subject shall have the right to receive the personal data concerning him or her, which he or she has provided to a controller, in a structured, commonly used and machine-readable format and have the right to transmit those data to another controller without hindrance from the controller to which the personal data have been provided, where:\n(a) the processing is based on consent pursuant to point (a) of Article 6(1) or point (a) of Article 9(2) or on a contract pursuant to point (b) of Article 6(1); and\n(b) the processing is carried out by automated means.", "bullets": [{"k": "What", "t": "the data the data subject himself provided, in a structured, commonly used and machine-readable format, and the right to transmit them to another organisation, directly where technically feasible."}, {"k": "Only your own data", "t": "the right covers what the data subject himself provided, not what the organisation derived from it; the conditions under which it applies you look up yourself on the next slide."}, {"k": "In practice", "t": "large platforms solve this with a self-service area: the user downloads his data himself or sends them directly to another service."}], "deep": {"url": "verdieping/overdraagbaarheid/index.html", "text": "how the right works in practice, with the example of a large platform, and why it is so often confused with access."}, "read": {"text": "Read Article 20 in full, including paragraphs 3 and 4.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "The last right in this section is data portability. The data subject may receive the data he himself gave to an organisation back in a structured, commonly used and machine-readable format, and transmit them to another organisation, even directly if technically feasible. Think of someone switching music service, bank or social network who wants to take his data along. The right applies only to what the data subject himself provided, not to what the organisation derived from it. It is also the first right that clearly does not always apply. Under which conditions it does apply, you will read for yourself on the next slide in the text of the Regulation. The big platforms have solved this right with a space where the user downloads his data himself or sends them to another service; the deep dive shows how. So remember: take along what you gave yourself, in a usable format."}, {"id": 12, "type": "reveal", "chip": "Exercise · look it up yourself", "title": "When does the right to data portability apply? Read it yourself in the Regulation", "question": "Pause the audio, open the Regulation via the button below and look in the third section of Chapter III for the article on the right to data portability. Read the first paragraph. For which legal bases does this right apply, and what second condition must the processing meet?", "verdict": "Only for consent or contract, and only for automated processing", "answer": [{"k": "The legal bases", "t": "the article refers expressly to two legal bases: consent and contract. For a legal obligation, a task in the public interest or a legitimate interest the right does not apply; so it does not apply, for example, against a municipality."}, {"k": "The second condition", "t": "the processing must be carried out by automated means; paper files fall outside it."}, {"k": "The pattern", "t": "whether a right applies sometimes depends on the legal basis, and that is always in the article itself: read the first sentence or the list of conditions. This pattern returns immediately with the right to object."}], "read": {"text": "Open the Regulation and look for the article on the right to data portability in Section 3 of Chapter III.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "Now an exercise, to discover it for yourself. Pause the audio, open the Regulation via the button on the slide, and look in the third section of the chapter for the article on the right to data portability. Read the first paragraph and answer two questions. For which legal bases does this right apply? And what second condition must the processing meet? Take your time. … The answer is literally in the text. The right applies only when the processing is based on consent or on a contract. For a legal obligation, a task in the public interest or a legitimate interest it therefore does not exist, and that is why it does not apply, for example, against a municipality. The second condition is that the processing is carried out by automated means, so not for paper files. You see here a pattern that will return: whether a right applies sometimes depends on the legal basis, and you read that in the article itself. So remember: if you doubt whether a right applies, open the text and read the conditions; for portability those are consent or contract, and automated processing."}, {"id": 13, "type": "bullets", "chip": "Section 4 · intervening in the processing", "title": "Objection and withdrawing consent: rights that are tied to a legal basis", "bullets": [{"k": "Objection on grounds relating to your particular situation", "t": "only against processing based on the public interest or the legitimate interest; the organisation stops, unless it demonstrates compelling legitimate grounds that override, or needs the data for legal claims."}, {"k": "Objection to direct marketing", "t": "always and without balancing: the processing for marketing stops; this right must be explicitly and separately brought to attention at the first contact."}, {"k": "Withdrawing consent", "t": "not a right from Chapter III but from the conditions for consent: at any time, as easy as giving it, without consequences for what happened before."}, {"k": "Why the link to the legal basis", "t": "for the legitimate interest the organisation itself made a balancing of interests; the objection lets the data subject contest that balancing for his situation. For a legal obligation or a contract there is nothing to weigh."}, {"k": "How you find that", "t": "read the first sentence of the article: that is where it says which legal bases the right covers. If in doubt, look up the article and read it yourself."}], "deep": {"url": "verdieping/bezwaar/index.html", "text": "the right to object in detail: the two variants, the balancing of interests, and how you find in the Regulation itself which legal basis a right belongs to."}, "read": {"text": "Read the first sentence of Article 21(1): that is where the legal bases covered by the objection are listed. Withdrawing consent is in Article 7(3).", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "The fourth section is about intervening in the processing. The first right is the right to object, and here the pattern from a moment ago becomes the rule: this right is tied to the legal basis. Objecting on grounds relating to your particular situation is possible only against processing based on the public interest or the legitimate interest. Why is that? Because for those two legal bases the organisation itself made a balancing of interests, for everyone together. The objection lets one person contest that balancing for his own situation. The organisation stops, unless it demonstrates compelling grounds that override. For a legal obligation or a contract that right does not exist, because there is nothing to weigh. The second variant is the objection to direct marketing, and there no balancing is needed: the marketing stops. That is why there is an unsubscribe link under every advertising email. Withdrawing consent is not in this chapter but in the conditions for consent: at any time, as easy as giving it. How do you find that? You read the first sentence of the article, because that is where it says which legal bases the right covers. So remember: objection belongs with the public interest and the legitimate interest, and the first sentence of the article says so."}, {"id": 14, "type": "quote", "chip": "Section 4 · automated decisions", "title": "Not subject to a decision taken solely by a machine", "source": "Article 22(1) GDPR", "quote": "The data subject shall have the right not to be subject to a decision based solely on automated processing, including profiling, which produces legal effects concerning him or her or similarly significantly affects him or her.", "bullets": [{"k": "Three conditions", "t": "a decision; based solely on automated processing, without meaningful human intervention; with legal effects or a significant impact, such as a refused loan, a rejected job application or a higher premium."}, {"k": "Three exceptions", "t": "necessary for a contract, authorised by law with suitable safeguards, or based on explicit consent."}, {"k": "The safeguards", "t": "for contract and consent at least: the right to human intervention, the right to express your point of view and the right to contest the decision."}, {"k": "Why this matters now", "t": "AI makes decisions without a human cheap and ordinary; the Court of Justice ruled in the SCHUFA case (C-634/21) that a credit score which a bank follows decisively is also such a decision."}], "deep": {"url": "verdieping/besluiten/index.html", "text": "the article paragraph by paragraph, the case law on credit scores, and what it means for organisations that use AI."}, "read": {"text": "Read Article 22 in full: the prohibition, the three exceptions, the safeguards and the rule for special categories. Judgment of the Court of Justice of 7 December 2023, SCHUFA Holding (C-634/21).", "links": [{"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, {"url": "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62021CJ0634", "label": "SCHUFA judgment (C-634/21)"}]}, "script": "The second right in this section long seemed a dormant article, until artificial intelligence put it at the centre of attention. Read the text on the slide. The data subject has the right not to be subject to a decision based solely on automated processing which significantly affects him. There are three conditions in there. There must be a decision. A machine must take that decision alone, without a human looking at it meaningfully. And the decision must really affect the person, such as a refused loan or an automatically rejected job application. There are three exceptions to the prohibition: the decision is necessary for a contract, a law allows it and provides safeguards, or the data subject has given explicit consent. For the exceptions of contract and consent, safeguards apply on top: the data subject has the right to human intervention, he can express his point of view, and he can contest the decision. Why does this article count so much now? Because artificial intelligence makes decisions without a human cheap and ordinary. And the Court of Justice ruled in the SCHUFA case that a credit score which a bank follows decisively is already such a decision, so that the scoring agency falls under it too. So remember: a machine may not decide alone about something that really affects you, unless law, contract or explicit consent allows it, and then with a human you can turn to."}, {"id": 15, "type": "reveal", "chip": "Think-along exercise 2", "title": "Three requests, three rights?", "question": "Three situations. One: a patient asks the hospital to erase her complete file, because she is changing hospital. Two: a customer of an energy supplier objects to the monthly invoicing of his consumption. Three: a resident asks the municipality for his data in a machine-readable format, to take them to another municipality. Which right applies in each case, and is the request well-founded?", "verdict": "Three times an existing right, three times not applicable in this situation", "answer": [{"k": "Erasing the file", "t": "the right to erasure exists, but the processing is necessary for a legal obligation and for public health: a patient file must be kept by law. She can, however, ask for access and a copy to take with her."}, {"k": "Objecting to the invoicing", "t": "objection is possible only against processing based on the public interest or the legitimate interest; the invoicing rests on the contract and on a legal obligation. So the objection does not apply; an error in the invoice is a rectification."}, {"k": "Taking data from the municipality", "t": "portability does not apply to processing in the context of a task in the public interest or official authority; the municipality processes on that basis. He can ask for access, and the move itself arranges the transfer via the National Register."}], "script": "Second think-along exercise, about when a right does not apply. Three situations. One: a patient asks the hospital to erase her complete file, because she is changing hospital. Two: a customer of an energy supplier objects to the monthly invoicing of his consumption. Three: a resident asks the municipality for his data in a machine-readable format, to take them to another municipality. Which right is invoked, and is the request well-founded? Think about it for a moment. … Three times the right exists, and three times it does not apply here. The patient asks for erasure, but a patient file must be kept by law: the exceptions for a legal obligation and public health apply. She can, however, ask for access and a copy and take those with her. The energy customer objects, but the invoicing rests on the contract and on a legal obligation, not on the public or legitimate interest. An error in the invoice is a rectification. And the resident asks for portability, but that right does not apply to a task in the public interest or official authority, and that is what a municipality does. So remember: first which right, then whether it applies in this situation, and you read that in the article itself."}, {"id": 16, "type": "quote", "chip": "Section 5 · restrictions", "title": "A law may restrict the rights, but only under strict conditions", "source": "Article 23(1) GDPR (opening words)", "quote": "Union or Member State law to which the data controller or processor is subject may restrict by way of a legislative measure the scope of the obligations and rights provided for in Articles 12 to 22 and Article 34, as well as Article 5 in so far as its provisions correspond to the rights and obligations provided for in Articles 12 to 22, when such a restriction respects the essence of the fundamental rights and freedoms and is a necessary and proportionate measure in a democratic society to safeguard:", "bullets": [{"k": "The logic", "t": "some rights collide with other interests: whoever conducts a tax investigation or reports a suspicious transaction cannot at the same time let the data subject see everything. Then the legislator may restrict the rights."}, {"k": "The conditions", "t": "only by law, respecting the essence of the fundamental rights, necessary and proportionate, and for one of the listed objectives: security, criminal prosecution, important economic or financial interests, supervision, the protection of others."}, {"k": "What the law must contain", "t": "specific provisions on the purpose, the categories of data, the scope of the restriction, the safeguards, the retention periods, the risks and the right to be informed about the restriction."}, {"k": "Belgian examples", "t": "the law on data processing by the FPS Finance restricts the right of access as long as someone is the subject of an audit or investigation; the anti-money-laundering law prohibits a bank from letting it be known that it has reported a suspicious transaction."}], "deep": {"url": "verdieping/beperkingen/index.html", "text": "the rationale of the restrictions through concrete examples, and what the legislator must include in such a law."}, "read": {"text": "Read the list of objectives in Article 23(1), and the content requirements for the law in paragraph 2.", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "label": "Open the GDPR on EUR-Lex"}, "script": "Finally the fifth section: the restrictions. We will not explain this article in detail, but you need to understand the logic. Some rights collide with other interests. The tax administration is investigating a suspicion of fraud: if the taxpayer obtains access at that moment to what the administration already knows, the investigation is worthless. A bank reports a suspicious transaction: if the customer learns through his right of access that he has been reported, the money disappears. That is why the legislator may restrict the rights. But the conditions are strict. The restriction can only be by law, it must respect the essence of the fundamental rights, it must be necessary and proportionate, and it may serve only one of the listed objectives: national security, criminal prosecution, important economic or financial interests such as taxation, supervision, the protection of others. And that law may not be vague: it says for what purpose, which data, how far the restriction reaches, what safeguards there are, and whether the data subject is informed of it. A legislator who wants to restrict a right therefore refers expressly to this provision and includes that content. Two Belgian examples are on the slide; the deep dive looks at them more closely. So remember: restricting is possible, but only by law, for a listed objective, and with a law that says precisely what it does."}, {"id": 17, "type": "summary", "chip": "Summary", "title": "What you take away", "key": "Chapter III lets the data subject check and enforce for himself what the principles promise: information is the starting point, access and portability put the data in his hands, objection and the prohibition of purely automated decisions intervene in the processing, and rectification, erasure and restriction are the consequences; every request follows the same ground rules, and only a law can restrict those rights.", "bullets": [{"k": "The ground rules", "t": "intelligible, easy, within the month, free of charge, and in case of refusal an explanation and a reference to the supervisory authority."}, {"k": "How the rights fit together", "t": "information as the starting point; two groups of rights; rectification, erasure and restriction as consequences; the recipients notified."}, {"k": "When a right does not apply", "t": "read the first sentence of the article: objection and portability depend on the legal basis, erasure has exceptions, and whoever cannot identify anyone need not grant everything."}, {"k": "The limits", "t": "a law may restrict rights, but only for listed objectives and with precise content; automated decisions require a human you can turn to."}], "script": "What do you take away? One key sentence: this chapter lets the data subject check and enforce for himself what the principles promise. Information is the starting point, access and portability put the data in his hands, objection and the prohibition of purely automated decisions intervene in the processing, and rectification, erasure and restriction are the consequences. Beyond that, four things. The ground rules: intelligible, easy, within the month, free of charge, and an explanation on refusal. The interplay: the starting point, the two groups and the consequences. When a right does not apply: read the first sentence of the article. And the limits: only a law may restrict the rights, for listed objectives and with precise content. Back to the webshop: those two sentences were an access request and an erasure request. Within the month the customer should have received a copy, and an answer on whether erasure was possible, for example not for the invoices the law requires to be kept. Before you go to the questions, one exercise. Pause the audio and look up how someone in your organisation can submit a request, and who answers it within the month. If you cannot find that in two minutes, the data subject will not find it either. For each right there is a button to a short deep dive; choose what matters to you. After that there are ten questions."}], "quiz": [{"q": "Why does the interplay between the rights of the data subject start with the right to information?", "options": ["Because the right to information is the only right that applies for every legal basis, even with a public authority.", "Because the duty to inform is the only obligation that the supervisory authority is able to check.", "Because the data subject can only give consent to the processing after receiving the information.", "Because whoever does not know that processing is taking place cannot exercise any other right."], "answer": 3, "feedback": ["Other rights too, such as access and rectification, apply regardless of the legal basis; that is not the reason.", "The supervisory authority can check all obligations; the order has to do with the logic of the rights.", "Consent is only one legal basis; the duty to inform applies for every legal basis.", "Correct. Information is the starting point: without knowing that processing is taking place, nobody can request access, object or ask for erasure."]}, {"q": "An organisation receives an access request on 3 March. The request is extensive. What may it do?", "options": ["Report by 3 April at the latest that the deadline is being extended by two months, and why.", "Answer as soon as it is internally possible, as long as that happens within three months of receipt.", "Refuse the request, because extensive requests count as excessive under the Regulation.", "Charge a fee for the administrative costs before answering the request at all."], "answer": 0, "feedback": ["Correct. For complex or numerous requests an extension by two months is possible, provided the data subject is informed within the first month.", "The basic deadline is one month; three months is only possible after a reasoned extension communicated within the first month.", "Size alone does not make a request manifestly unfounded or excessive; that requires, for example, a repetitive character, and the organisation has to demonstrate it.", "A first request is free of charge; only for manifestly unfounded or excessive requests or additional copies may something be charged."]}, {"q": "Why does the provision on processing which does not require identification sit before the chapter on the rights of the data subject and not in it?", "options": ["Because it applies only to public authorities, which do not fall under the chapter on the rights of the data subject.", "Because it regulates consent, which belongs with the legal bases of the Regulation.", "Because it is a consequence of data minimisation and not a right.", "Because it applies only to pseudonymised data that are used for research purposes."], "answer": 2, "feedback": ["The provision applies to every controller, not only to public authorities.", "The provision is not about consent but about the identification of the data subject.", "Correct. Whoever does not need identification for his purpose must not keep extra identifying data; that is a principle, with the consequence that certain rights do not apply.", "It applies to every processing in which the organisation cannot identify the data subject, not only to research."]}, {"q": "An association buys an address list to send out a mailing. When, at the latest, must it inform the people on that list?", "options": ["Only when someone on the list asks for information himself.", "At the latest at the moment of the first contact, so with the mailing itself.", "Within three months of buying the list, with a subsequent mailing.", "Not at all, because the seller of the list has already informed the people on it."], "answer": 1, "feedback": ["The duty to inform is proactive; the organisation does not wait until someone asks.", "Correct. The data do not come from the data subject and are used to communicate; then the moment is at the latest the first contact.", "The final deadline is one month after obtaining the data, and in case of communication the first contact; three months is too late.", "The seller has at most informed about its own processing; the association must inform about its own processing, unless the data subject already has that information."]}, {"q": "What does the right of access comprise?", "options": ["Only a confirmation that the organisation processes data about the data subject, without the data themselves.", "The data in a machine-readable format in order to transmit them to another organisation.", "A list of all employees who have ever consulted the data of the data subject.", "Confirmation, the data themselves, the context of the processing and a copy."], "answer": 3, "feedback": ["Confirmation is only the first layer; then come the data themselves, the context and the copy.", "That is the right to data portability, a different right with its own conditions.", "The data subject is entitled to the recipients or categories of recipients, not to a log of all internal consultations.", "Correct. Three layers plus a copy: yes or no, the data, the context (purposes, recipients, retention period, source, automated decision-making) and a copy."]}, {"q": "What is the difference between erasure and restriction of processing?", "options": ["With erasure the data disappear; with restriction they stay but are not used.", "Erasure applies to digital data, restriction to paper files and archives that are not digital.", "Only the data subject can request erasure; only the supervisory authority can impose restriction after a complaint.", "There is no difference: restriction is simply the term for a partial erasure."], "answer": 0, "feedback": ["Correct. Restriction is the pause button: the data stay, for example during the check of their accuracy or during an objection, but are not processed further.", "Both rights apply to every medium.", "Both rights belong to the data subject.", "They are two different rights with different consequences."]}, {"q": "A customer objects to his bank keeping his data for the performance of his account contract. What is the correct reaction?", "options": ["Grant the objection and stop the processing, because the right to object always applies and for every legal basis.", "Grant the objection, but only for the data the customer himself provided to the bank when opening the account.", "Explain that objection does not apply to processing based on a contract, and point to the rights that do apply.", "Forward the objection to the supervisory authority, which decides within the month whether the objection is well-founded or not."], "answer": 2, "feedback": ["Objection on grounds relating to your particular situation applies only against processing based on the public interest or the legitimate interest.", "That limitation belongs with portability, not with objection.", "Correct. The objection does not apply here; the bank explains that within the month and points to access, rectification and the possibility of a complaint.", "The organisation answers the request itself; the data subject can then lodge a complaint if he disagrees."]}, {"q": "When does the right to data portability apply?", "options": ["For every processing of personal data, regardless of the legal basis or the way of processing.", "Only for consent or contract, and if the processing is automated.", "Only for processing by public authorities in the context of their legal tasks in the public interest.", "Only when the data subject has first requested access and received a copy of his data."], "answer": 1, "feedback": ["The right is expressly limited to two legal bases and to automated processing.", "Correct. Consent or contract, automated processing, and only the data the data subject himself provided.", "On the contrary: the right does not apply to a task in the public interest or official authority.", "Portability is an independent right; access is not a condition."]}, {"q": "A webshop automatically rejects an order on the basis of a credit score from an external agency, without anyone looking at it. What does the GDPR say about that?", "options": ["That is always allowed, as long as the webshop informs the customer afterwards about the decision and the credit score.", "That is never allowed, because automated decisions are completely prohibited in the Regulation.", "That is only a problem for the credit agency that calculates the score, not for the webshop itself.", "That is allowed only under one of the three exceptions, with safeguards such as human intervention."], "answer": 3, "feedback": ["Informing afterwards is not enough; the right not to be subject to such a decision requires an exception and safeguards.", "It is not an absolute prohibition: there are three exceptions.", "According to the Court of Justice the scoring agency falls under it too, but so certainly does the webshop that takes the decision.", "Correct. A decision that is solely automated and significantly affects the person is allowed only under the three exceptions, with at least human intervention, the right to express a point of view and the right to contest the decision."]}, {"q": "Under which conditions may a law restrict the rights of the data subject?", "options": ["If the law respects the essence of fundamental rights, is necessary and proportionate, and serves a listed objective.", "If the government considers it necessary, by royal decree and for any objective that it determines itself.", "If the supervisory authority has approved the restriction in writing beforehand in a formal opinion.", "If the data subject has expressly agreed to the restriction when concluding the contract or when creating an online account."], "answer": 0, "feedback": ["Correct. Only by law, respecting the essence of the fundamental rights, necessary and proportionate, for a listed objective, and with specific provisions on purpose, data, scope, safeguards and retention periods.", "A restriction requires a legislative provision, for one of the listed objectives; a free choice by the government is not enough.", "The supervisory authority gives opinions on such laws, but approval is not a condition in the Regulation.", "Rights of the data subject cannot be removed by contract; only a law can restrict them."]}]}</script>

<script>
(function(){
  const C = JSON.parse(document.getElementById('content').textContent);
  const U = C.ui;
  const RS = C.recordings ? C.recordings : (C.recording ? [Object.assign({id:'main'}, C.recording)] : []);
  const AUDIO_DIR = 'audio';
  const $ = id => document.getElementById(id);
  const fmt = (s,o) => s.replace(/\{(\w+)\}/g,(m,k)=>o[k]);
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sections = ['intro','pres','quiz-intro','quiz','result','rec'];
  function show(id){ sections.forEach(s=>$(s).classList.toggle('hidden', s!==id)); $('nav-home').classList.toggle('on', id==='intro'); $('nav-slides').classList.toggle('on', id==='pres'); $('nav-quiz').classList.toggle('on', id==='quiz'||id==='quiz-intro'||id==='result'); $('nav-rec').classList.toggle('on', id==='rec'); if(id!=='rec' && typeof recPause==='function') recPause(); document.querySelector('.stage').classList.toggle('wide', id==='pres'); window.scrollTo({top:0,behavior:'smooth'}); }

  /* ---- teksten ---- */
  $('modlabel').textContent = C.course + ' · ' + C.module;
  $('footer').textContent = C.module + ' · ' + C.title + ' · Thomas More';
  $('intro-kicker').textContent = C.course + ' · ' + C.module;
  $('intro-title').textContent = C.title;
  $('intro-sub').textContent = C.subtitle;
  $('intro-lead').textContent = U.intro_lead;
  $('intro-goals').innerHTML = U.goals.map(g=>'<li><span>'+esc(g)+'</span></li>').join('');
  $('intro-meta').textContent = C.duration;
  $('btn-start').querySelector('span').textContent = U.start; $('btn-skip').textContent = U.skip_to_quiz;
  $('btn-skip').addEventListener('click',()=>{ show('quiz-intro'); });
  $('nav-home').textContent = U.nav_home; $('nav-slides').textContent = U.nav_slides; $('nav-quiz').textContent = U.nav_quiz;
  let started = false;
  /* verdieping: terug naar de hoofdmodule, op de slide vanwaar de cursist vertrok (?back=N → ?slide=N) */
  const QS = new URLSearchParams(location.search);
  function backUrl(){ const b=QS.get('back'); return (C.back&&C.back.url||'../../index.html') + (b ? '?slide='+encodeURIComponent(b) : ''); }
  if(C.back){ $('nav-back').textContent = '‹ ' + (C.back.label||U.back_label||U.nav_home); $('nav-back').classList.remove('hidden'); $('nav-back').addEventListener('click',()=>{ audio.pause(); location.href = backUrl(); }); }
  $('nav-home').addEventListener('click',()=>{ audio.pause(); show('intro'); });
  $('nav-slides').addEventListener('click',()=>{ if(C.profiles && !PROFILE){ show('intro'); return; } if($('pres').classList.contains('hidden')){ show('pres'); if(!started){ started=true; go(0,false); } } });
  $('nav-quiz').addEventListener('click',()=>{ audio.pause(); if(!$('quiz').classList.contains('hidden')||!$('result').classList.contains('hidden')) return; if(typeof paused!=='undefined' && paused){ $('btn-resume').click(); } else show('quiz-intro'); });
  $('btn-prev').querySelector('span').textContent = U.prev;
  $('btn-next').querySelector('span').textContent = U.next;
  $('lbl-autoplay').textContent = U.autoplay_short || U.autoplay; $('lbl-autoplay-wrap').title = U.autoplay; $('speed').title = U.speed; $('btn-prev').title = U.prev; $('btn-next').title = U.next;
