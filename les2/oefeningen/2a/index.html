<!DOCTYPE html>
<html lang="en" data-theme="tm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercises 2A · Reading a data flow diagram</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* figuur (inline svg, bv. dataflowdiagram) */
.figure{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:center;height:100%}
.figure.with-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.figure.stack{grid-template-columns:minmax(0,1fr);align-items:start}
.figure.stack .fig svg{max-height:40vh}
.figure.stack .side .reveal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.figure.stack .side .reveal .ans{grid-column:1/-1;margin-top:0}
.figure.stack .side .reveal .ans ul.bul{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
@media (max-width:640px){.figure.stack .side .reveal,.figure.stack .side .reveal .ans ul.bul{grid-template-columns:1fr}}
.figure .fig{display:flex;align-items:center;justify-content:center;min-height:0}
.figure .fig svg{width:100%;height:auto;max-height:52vh;font-family:var(--font);overflow:visible}
.figure .side ul.bul li{font-size:clamp(12px,1.3vw,16px)}
.figure .side .reveal .q{font-size:clamp(13px,1.45vw,18px);padding:clamp(10px,1.4vw,18px)}
.figure .side .reveal .ans ul.bul li{font-size:clamp(11px,1.2vw,15px)}
.figure .caption{font-size:clamp(11px,1.15vw,14px);color:var(--muted);text-align:center;margin-top:6px}
/* dfd-notatie (Yourdon/DeMarco) */
.fig .ee{fill:var(--card-bg);stroke:var(--text);stroke-width:2.5}
.fig .p{fill:var(--chain-bg);stroke:var(--accent);stroke-width:2.5}
.fig .ds{fill:none;stroke:var(--text);stroke-width:2.5}
.fig .fl{fill:none;stroke:var(--muted);stroke-width:2}
.fig .fl.pd{stroke:var(--accent);stroke-width:3.2}
.fig .fl.bad{stroke:var(--bad);stroke-dasharray:7 5;stroke-width:2.6}
.fig .ar{fill:var(--muted)}.fig .ar.pd{fill:var(--accent)}.fig .ar.bad{fill:var(--bad)}
.fig text{fill:var(--text);font-size:14px;font-family:var(--font)}
.fig text.lbl{font-size:12px;fill:var(--muted)}
.fig text.lbl.pd{fill:var(--accent);font-weight:700}
.fig text.id{font-size:11px;font-weight:700;fill:var(--accent)}
.fig text.big{font-size:16px;font-weight:700}
.fig rect.flag{fill:var(--bad)}.fig text.flag{fill:#fff;font-size:11px;font-weight:700}
.fig rect.lane{fill:var(--card-bg);stroke:var(--line);stroke-width:1.5}
.fig text.lane{font-weight:700;font-size:13px}
.fig rect.zone{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 6}
.fig text.zone{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:.06em}
.fig rect.ok{fill:var(--ok)}.fig text.ok{fill:#fff}
@media (max-width:640px){.figure.with-side{grid-template-columns:1fr}.figure .fig svg{max-height:none}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

:root{
  --font:"Century Gothic","URW Gothic","Avant Garde",Arial,sans-serif;
  --page-bg:#F3F2F1; --card-bg:#FFFFFF; --text:#00283C; --title:#FA6432; --muted:#5B6B75;
  --accent:#FA6432; --line:#E3E1DE; --chain-bg:#FFF1EA;
  --chip-bg:#00283C; --chip-text:#FFFFFF;

<script id="content" type="application/json">{"lang": "en", "course": "Data protection", "module": "Exercises 2A", "title": "Reading a data flow diagram", "subtitle": "Your first tool for showing where personal data goes", "duration": "± 15 minutes of presentation, 3 reading exercises, an optional deep dive and 10 questions", "ui": {"start": "Start the presentation", "intro_lead": "What you will learn in this module", "goals": ["What a data flow diagram (DFD) is, which building blocks and levels it has, and what it is used for beyond data protection.", "Why a DFD is a good way to talk to data professionals, and who the data protection officer (DPO) is that you will hand it to later.", "What a DFD for a DPO must show above all: where personal data comes in, where it is stored and where it goes out.", "How to read an existing DFD, step by step, so that you can draw your own in the coming lessons."], "slide_of": "Slide {n} of {total}", "play": "Play", "pause": "Pause", "replay": "Replay", "prev": "Previous", "next": "Next", "autoplay": "Continue automatically", "to_quiz": "Go to the exercises", "quiz_intro_title": "Test your knowledge", "quiz_intro_text": "Ten questions, each with four possible answers of which exactly one is correct. You get feedback immediately after each answer. Nothing is recorded: practise as often as you like.", "quiz_start": "Start the exercises", "question_of": "Question {n} of {total}", "correct": "Correct", "incorrect": "Incorrect", "next_question": "Next question", "show_result": "See your result", "result_title": "Your result", "result_text": "You answered {score} of the {total} questions correctly.", "result_good": "Well done. You can read a data flow diagram and you know what a DPO looks for in it.", "result_mid": "Good progress. Review the feedback on the questions you missed and try again.", "result_low": "Watch the presentation again and then try once more. The feedback on each question will help you.", "retry": "Practise again", "review": "Review the presentation", "your_answer": "Your answer", "footer": "Exercises 2A · Reading a data flow diagram", "open_link": "Open the link in a new tab", "practice_hint": "Practical exercise: pause, carry out the steps, then click Next.", "back_to_slides": "Back to the slides", "resume_quiz": "Continue the exercises", "download_pdf": "Download your result as PDF", "pdf_title": "Exercise results", "pdf_question": "Question", "pdf_your": "Your answer", "pdf_correct": "Correct answer", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "not answered", "transcript": "Spoken text", "show_text": "Show text", "hide_text": "Hide text", "ai_notice_title": "Transparency about AI", "ai_notice": "The voice in this module was generated by AI from the voice of Peter Berghmans, with his consent. The text, slides and diagrams were produced with AI assistance and reviewed for content by the trainer.", "ai_voice_label": "AI voice", "ai_icon_alt": "Official EU label: AI-generated content", "ai_footer": "Voice generated by AI (with the speaker's consent); text, slides and diagrams produced with AI assistance and reviewed by the trainer.", "skip_to_quiz": "Go straight to the exercises", "nav_home": "Home", "nav_slides": "Presentation", "nav_quiz": "Exercises", "speed": "Speed", "reveal_question": "What do you think?", "reveal_show": "Show the answer", "optional_label": "Deep dive (optional)", "optional_skip": "Skip the deep dive", "optional_intro": "The next slides are an optional deep dive. You can skip them and go straight to the exercises.", "autoplay_short": "Auto"}, "slides": [{"id": 1, "type": "title", "title": "Reading a data flow diagram", "subtitle": "Your first tool for showing where personal data goes", "script": "Welcome to this module. In the previous module you learned what personal data is, and that metadata and pseudonymised data are personal data too. From now on we add a practical skill to that knowledge: drawing a data flow diagram. A data flow diagram, or DFD, is a simple picture that shows where data comes in, what happens to it, where it is stored and where it goes out. In this module we do not draw yet: we learn to read. First I explain what a DFD is, which building blocks it has and what it is used for. Then I introduce someone you will meet often in this course: the data protection officer, or DPO. And finally you read three diagrams yourself, with a question for each. In the coming lessons you will draw your own diagram and extend it, lesson after lesson."}, {"id": 2, "type": "bullets", "chip": "Why a diagram", "title": "Data flows are invisible, and a diagram makes them visible", "bullets": [{"k": "The problem", "t": "data moves between people, applications, databases and organisations, and nobody sees it happening; a form is filled in, a file is exported, an API is called."}, {"k": "The solution", "t": "a data flow diagram draws those movements: where data enters, what transforms it, where it waits and where it leaves."}, {"k": "For whom", "t": "for yourself, to understand a system; for colleagues, to agree on how it works; and for people who must assess the system without building it, such as an auditor or a data protection officer."}, {"k": "In this course", "t": "you will draw a DFD and extend it lesson after lesson, so that at the end it shows everything a data protection officer needs to know."}], "script": "Why draw a diagram at all? Because data flows are invisible. Data moves between people, applications, databases and organisations, and nobody sees it happening. Someone fills in a form, a script exports a file, an application calls an API, and the data is somewhere else. Ask three colleagues where the customer data of a system ends up, and you often get three different answers. A data flow diagram solves that. It draws the movements: where data enters, what transforms it, where it waits and where it leaves. That is useful for yourself, to understand a system you did not build. It is useful for colleagues, to agree on how something works. And it is especially useful for people who must assess a system without building it, such as an auditor or a data protection officer."}, {"id": 3, "type": "figure", "chip": "The building blocks", "title": "A data flow diagram uses only four symbols", "svg": "<svg class=\"dfd\" viewBox=\"0 0 900 250\" role=\"img\" aria-label=\"The four symbols of a data flow diagram\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-pd-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-bad-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M10 0L0 5L10 10z\"/><\/marker><\/defs><rect class=\"ee\" x=\"45\" y=\"72\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"110\" y=\"97\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"110\">External<\/tspan><tspan x=\"110\" dy=\"16\">entity<\/tspan><\/text><circle class=\"p\" cx=\"340\" cy=\"100\" r=\"46\"/><text x=\"340\" y=\"74\" text-anchor=\"middle\" class=\"id\"><tspan x=\"340\">1<\/tspan><\/text><text x=\"340\" y=\"111\" text-anchor=\"middle\"><tspan x=\"340\">Process<\/tspan><\/text><path class=\"ds\" d=\"M515 80H665M515 120H665\"/><path class=\"ds\" d=\"M549 80V120\"/><text x=\"532\" y=\"105\" text-anchor=\"middle\" class=\"id\"><tspan x=\"532\">D1<\/tspan><\/text><text x=\"607\" y=\"105\" text-anchor=\"middle\"><tspan x=\"607\">Data store<\/tspan><\/text><path class=\"fl\" d=\"M736 100 L874 100\" marker-end=\"url(#ar)\"/><text x=\"805\" y=\"96\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"805\">data flow<\/tspan><\/text><text x=\"110\" y=\"187\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"110\">a person, organisation or<\/tspan><tspan x=\"110\" dy=\"16\">system outside your scope<\/tspan><\/text><text x=\"340\" y=\"187\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"340\">something that transforms<\/tspan><tspan x=\"340\" dy=\"16\">or uses data (a verb)<\/tspan><\/text><text x=\"590\" y=\"187\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"590\">where data waits between<\/tspan><tspan x=\"590\" dy=\"16\">two processes (a noun)<\/tspan><\/text><text x=\"805\" y=\"187\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"805\">data moving from one<\/tspan><tspan x=\"805\" dy=\"16\">element to another<\/tspan><\/text><\/svg>", "caption": "Yourdon/DeMarco notation, used in this module; other notations are allowed in your own diagrams", "script": "The good news: a data flow diagram uses only four symbols. A rectangle is an external entity: a person, an organisation or a system outside the scope of what you describe. A student, a supplier, the tax authority, a payment provider. A circle is a process: something that transforms or uses data. You name a process with a verb: register application, calculate invoice, send reminder. Two parallel lines form a data store: a place where data waits between two processes. A database, a file, an archive, but also a mailbox or a spreadsheet on a shared drive. And an arrow is a data flow: data moving from one element to another. You always write on the arrow which data it carries. There are several notations for these symbols. In this module we use the one on the slide, called Yourdon and DeMarco after its authors. In your own diagrams you may use another notation, as long as these four building blocks stay recognisable; the optional deep dive at the end shows two alternatives."}, {"id": 4, "type": "figure", "chip": "The rules", "title": "Four rules keep a diagram readable and correct", "svg": "<svg class=\"dfd\" viewBox=\"0 0 900 330\" role=\"img\" aria-label=\"What is allowed and what is not\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-pd-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-bad-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M10 0L0 5L10 10z\"/><\/marker><\/defs><rect class=\"zone\" x=\"20\" y=\"20\" width=\"420\" height=\"300\" rx=\"10\"/><text x=\"32\" y=\"39\" text-anchor=\"start\" class=\"zone\"><tspan x=\"32\">ALLOWED<\/tspan><\/text><rect class=\"zone\" x=\"460\" y=\"20\" width=\"420\" height=\"300\" rx=\"10\"/><text x=\"472\" y=\"39\" text-anchor=\"start\" class=\"zone\"><tspan x=\"472\">NOT ALLOWED<\/tspan><\/text><rect class=\"ee\" x=\"35\" y=\"92\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"100\" y=\"125\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"100\">Customer<\/tspan><\/text><circle class=\"p\" cx=\"290\" cy=\"120\" r=\"46\"/><text x=\"290\" y=\"94\" text-anchor=\"middle\" class=\"id\"><tspan x=\"290\">1<\/tspan><\/text><text x=\"290\" y=\"123\" text-anchor=\"middle\"><tspan x=\"290\">Handle<\/tspan><tspan x=\"290\" dy=\"16\">order<\/tspan><\/text><path class=\"ds\" d=\"M215 230H365M215 270H365\"/><path class=\"ds\" d=\"M249 230V270\"/><text x=\"232\" y=\"255\" text-anchor=\"middle\" class=\"id\"><tspan x=\"232\">D1<\/tspan><\/text><text x=\"307\" y=\"255\" text-anchor=\"middle\"><tspan x=\"307\">Orders<\/tspan><\/text><path class=\"fl\" d=\"M171 120 L238 120\" marker-end=\"url(#ar)\"/><text x=\"204.5\" y=\"116\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"204.5\">order<\/tspan><\/text><path class=\"fl\" d=\"M244.544 145.253 L200 170 L168 154\" marker-end=\"url(#ar)\"/><text x=\"221.798\" y=\"178.89\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"221.798\">confirmation<\/tspan><\/text><path class=\"fl\" d=\"M290 172 L290 224\" marker-end=\"url(#ar)\"/><text x=\"352\" y=\"203\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"352\">order record<\/tspan><\/text><rect class=\"ee\" x=\"485\" y=\"72\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"550\" y=\"105\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"550\">Customer<\/tspan><\/text><rect class=\"ee\" x=\"735\" y=\"72\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"800\" y=\"105\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"800\">Supplier<\/tspan><\/text><path class=\"fl bad\" d=\"M621 100 L729 100\" marker-end=\"url(#ar-bad)\"/><text x=\"675\" y=\"96\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"675\">order?<\/tspan><\/text><path class=\"ds\" d=\"M480 200H620M480 240H620\"/><path class=\"ds\" d=\"M514 200V240\"/><text x=\"497\" y=\"225\" text-anchor=\"middle\" class=\"id\"><tspan x=\"497\">D1<\/tspan><\/text><text x=\"567\" y=\"225\" text-anchor=\"middle\"><tspan x=\"567\">Orders<\/tspan><\/text><path class=\"ds\" d=\"M730 200H870M730 240H870\"/><path class=\"ds\" d=\"M764 200V240\"/><text x=\"747\" y=\"225\" text-anchor=\"middle\" class=\"id\"><tspan x=\"747\">D2<\/tspan><\/text><text x=\"817\" y=\"225\" text-anchor=\"middle\"><tspan x=\"817\">Invoices<\/tspan><\/text><path class=\"fl bad\" d=\"M626 220 L724 220\" marker-end=\"url(#ar-bad)\"/><text x=\"675\" y=\"216\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"675\">copy?<\/tspan><\/text><circle class=\"p\" cx=\"800\" cy=\"285\" r=\"28\"/><text x=\"800\" y=\"277\" text-anchor=\"middle\" class=\"id\"><tspan x=\"800\">2<\/tspan><\/text><text x=\"800\" y=\"296\" text-anchor=\"middle\"><tspan x=\"800\">Ship<\/tspan><\/text><path class=\"fl bad\" d=\"M800 246 L800 251\" marker-end=\"url(#ar-bad)\"/><text x=\"700\" y=\"289\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"700\">no label, and<\/tspan><tspan x=\"700\" dy=\"16\">no output<\/tspan><\/text><\/svg>", "bullets": [{"k": "Every flow has a label", "t": "the name of the data it carries, as a noun: 'order', 'student record', 'quarter-hour value'."}, {"k": "Every process has input and output", "t": "a process that only receives data, or only sends it, is a sign that something is missing."}, {"k": "Data does not flow between two entities", "t": "two external parties never exchange data directly in your diagram; either the exchange is outside your system, or a process is missing that you should draw, because the process tells the reader what the data is used for."}, {"k": "Data does not flow between two stores", "t": "data cannot move on its own; a process always sits in between."}], "script": "Four rules keep a diagram readable and correct. The left side of the slide is allowed, the right side is not. Rule one: every flow has a label, the name of the data it carries, written as a noun. Order, student record, quarter-hour value. An arrow without a name tells the reader nothing. Rule two: every process has both input and output. A process that only receives data, or only sends it, is a sign that something is missing. On the right you see a process that gets data from a store but never sends anything anywhere: that cannot be complete. Rule three: data does not flow directly between two external entities. If you are tempted to draw a customer sending data straight to a supplier, one of two things is true: either the exchange is outside your system, or a process is missing that you should draw. Drawing that process matters, because the process tells the reader what the data is used for. Rule four: data does not flow directly between two stores. Data cannot move on its own; a process always sits in between, and that process has to be drawn. You will need these rules in one of the reading exercises."}, {"id": 5, "type": "figure", "chip": "Levels", "title": "You draw a DFD in levels: from the whole to the detail", "svg": "<svg class=\"dfd\" viewBox=\"0 0 900 270\" role=\"img\" aria-label=\"Three levels of detail\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-pd-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-bad-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M10 0L0 5L10 10z\"/><\/marker><\/defs><circle class=\"p\" cx=\"130\" cy=\"110\" r=\"50\"/><text x=\"130\" y=\"80\" text-anchor=\"middle\" class=\"id\"><tspan x=\"130\">0<\/tspan><\/text><text x=\"130\" y=\"113\" text-anchor=\"middle\"><tspan x=\"130\">Whole<\/tspan><tspan x=\"130\" dy=\"16\">system<\/tspan><\/text><circle class=\"p\" cx=\"400\" cy=\"60\" r=\"30\"/><text x=\"400\" y=\"50\" text-anchor=\"middle\" class=\"id\"><tspan x=\"400\">1<\/tspan><\/text><text x=\"400\" y=\"71\" text-anchor=\"middle\"><tspan x=\"400\">Part<\/tspan><\/text><circle class=\"p\" cx=\"470\" cy=\"150\" r=\"30\"/><text x=\"470\" y=\"140\" text-anchor=\"middle\" class=\"id\"><tspan x=\"470\">2<\/tspan><\/text><text x=\"470\" y=\"161\" text-anchor=\"middle\"><tspan x=\"470\">Part<\/tspan><\/text><circle class=\"p\" cx=\"360\" cy=\"160\" r=\"30\"/><text x=\"360\" y=\"150\" text-anchor=\"middle\" class=\"id\"><tspan x=\"360\">3<\/tspan><\/text><text x=\"360\" y=\"171\" text-anchor=\"middle\"><tspan x=\"360\">Part<\/tspan><\/text><circle class=\"p\" cx=\"720\" cy=\"50\" r=\"26\"/><text x=\"720\" y=\"44\" text-anchor=\"middle\" class=\"id\"><tspan x=\"720\">2.1<\/tspan><\/text><text x=\"720\" y=\"61\" text-anchor=\"middle\"><tspan x=\"720\">Step<\/tspan><\/text><circle class=\"p\" cx=\"800\" cy=\"130\" r=\"26\"/><text x=\"800\" y=\"124\" text-anchor=\"middle\" class=\"id\"><tspan x=\"800\">2.2<\/tspan><\/text><text x=\"800\" y=\"141\" text-anchor=\"middle\"><tspan x=\"800\">Step<\/tspan><\/text><circle class=\"p\" cx=\"700\" cy=\"180\" r=\"26\"/><text x=\"700\" y=\"174\" text-anchor=\"middle\" class=\"id\"><tspan x=\"700\">2.3<\/tspan><\/text><text x=\"700\" y=\"191\" text-anchor=\"middle\"><tspan x=\"700\">Step<\/tspan><\/text><path class=\"fl\" d=\"M201 110 L309 110\" marker-end=\"url(#ar)\"/><text x=\"255\" y=\"106\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"255\">zoom in<\/tspan><\/text><path class=\"fl\" d=\"M526 110 L649 110\" marker-end=\"url(#ar)\"/><text x=\"587.5\" y=\"106\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"587.5\">zoom in<\/tspan><\/text><text x=\"130\" y=\"197\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"130\">Context diagram<\/tspan><tspan x=\"130\" dy=\"16\">one process, all external parties<\/tspan><\/text><text x=\"415\" y=\"222\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"415\">Level 0<\/tspan><tspan x=\"415\" dy=\"16\">the main processes and stores<\/tspan><\/text><text x=\"755\" y=\"232\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"755\">Level 1<\/tspan><tspan x=\"755\" dy=\"16\">one process worked out in steps<\/tspan><\/text><\/svg>", "bullets": [{"k": "Context diagram", "t": "one single process for the whole system, surrounded by all external entities; it answers: who exchanges data with us?"}, {"k": "Level 0", "t": "the main processes and data stores inside that system, numbered 1, 2, 3."}, {"k": "Level 1 and deeper", "t": "one process worked out in steps, numbered 2.1, 2.2, 2.3; you only go this deep where it matters."}], "script": "A large system does not fit on one page. That is why you draw a DFD in levels, from the whole to the detail. The highest level is the context diagram: one single circle for the whole system, surrounded by all external entities. It answers a simple question: who exchanges data with us? That is often the most important page for a data protection officer, because it shows at a glance every party that receives or supplies data. One level down is level zero: you open the circle and draw the main processes and data stores inside it, numbered one, two, three. Where it matters, you open one of those processes again into level one: the steps of that single process, numbered two point one, two point two, and so on. You only go this deep where it is useful. Let us look at a real example, first the context diagram and then level zero."}, {"id": 6, "type": "figure", "chip": "Example", "title": "Context diagram: the enrolment system of a college", "svg": "<svg class=\"dfd\" viewBox=\"0 0 900 440\" role=\"img\" aria-label=\"Context diagram of the enrolment system\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-pd-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-bad-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M10 0L0 5L10 10z\"/><\/marker><\/defs><circle class=\"p\" cx=\"450\" cy=\"220\" r=\"64\"/><text x=\"450\" y=\"176\" text-anchor=\"middle\" class=\"id\"><tspan x=\"450\">0<\/tspan><\/text><text x=\"450\" y=\"223\" text-anchor=\"middle\"><tspan x=\"450\">Enrolment<\/tspan><tspan x=\"450\" dy=\"16\">system<\/tspan><\/text><rect class=\"ee\" x=\"45\" y=\"82\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"110\" y=\"115\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"110\">Student<\/tspan><\/text><rect class=\"ee\" x=\"725\" y=\"82\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"790\" y=\"107\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"790\">Education<\/tspan><tspan x=\"790\" dy=\"16\">department<\/tspan><\/text><rect class=\"ee\" x=\"725\" y=\"302\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"790\" y=\"327\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"790\">Payment<\/tspan><tspan x=\"790\" dy=\"16\">provider<\/tspan><\/text><rect class=\"ee\" x=\"45\" y=\"302\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"110\" y=\"335\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"110\">Lecturer<\/tspan><\/text><path class=\"fl\" d=\"M181 132.971 L383.399 198.453\" marker-end=\"url(#ar)\"/><text x=\"241.72\" y=\"121.615\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"241.72\">application, ID copy,<\/tspan><tspan x=\"241.72\" dy=\"16\">diploma<\/tspan><\/text><path class=\"fl\" d=\"M380.347 213.035 L250 200 L162.889 144\" marker-end=\"url(#ar)\"/><text x=\"243.982\" y=\"225.198\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"243.982\">student card,<\/tspan><tspan x=\"243.982\" dy=\"16\">invoice<\/tspan><\/text><path class=\"fl\" d=\"M516.601 198.453 L719 132.971\" marker-end=\"url(#ar)\"/><text x=\"619.921\" y=\"159.437\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"619.921\">enrolment report<\/tspan><\/text><path class=\"fl\" d=\"M737.111 144 L650 200 L519.653 213.035\" marker-end=\"url(#ar)\"/><text x=\"668.018\" y=\"229.198\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"668.018\">diploma check result<\/tspan><\/text><path class=\"fl\" d=\"M516.601 241.547 L719 307.029\" marker-end=\"url(#ar)\"/><text x=\"615.681\" y=\"268.014\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"615.681\">payment request<\/tspan><\/text><path class=\"fl\" d=\"M719 355.357 L650 380 L504.661 263.729\" marker-end=\"url(#ar)\"/><text x=\"646.447\" y=\"400.158\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"646.447\">payment confirmation<\/tspan><\/text><path class=\"fl\" d=\"M383.399 241.547 L181 307.029\" marker-end=\"url(#ar)\"/><text x=\"276.199\" y=\"271.288\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"276.199\">class list<\/tspan><\/text><\/svg>", "caption": "One process, four external entities, seven labelled flows", "script": "Here is the context diagram of the enrolment system of a college, a system you know from the other side. In the middle is one circle, numbered zero: the enrolment system as a whole. Around it are four external entities. The student sends an application, a copy of an identity document and a diploma, and receives a student card and an invoice. The education department receives an enrolment report and sends back the result of a diploma check. The payment provider receives a payment request and sends back a confirmation. And the lecturer receives a class list. Notice that every arrow has a name, and that every name is data. Notice also how much you already know without seeing a single line of the system: which four parties are involved, which data leaves the college and which data comes in. That is what a context diagram is for."}, {"id": 7, "type": "figure", "chip": "Example", "title": "Level 0: the four processes and two stores inside the system", "svg": "<svg class=\"dfd\" viewBox=\"0 0 900 520\" role=\"img\" aria-label=\"Level 0 diagram of the enrolment system\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-pd-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-bad-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M10 0L0 5L10 10z\"/><\/marker><\/defs><rect class=\"ee\" x=\"25\" y=\"212\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"90\" y=\"245\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"90\">Student<\/tspan><\/text><rect class=\"ee\" x=\"765\" y=\"82\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"830\" y=\"107\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"830\">Education<\/tspan><tspan x=\"830\" dy=\"16\">department<\/tspan><\/text><rect class=\"ee\" x=\"765\" y=\"342\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"830\" y=\"367\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"830\">Payment<\/tspan><tspan x=\"830\" dy=\"16\">provider<\/tspan><\/text><circle class=\"p\" cx=\"310\" cy=\"110\" r=\"46\"/><text x=\"310\" y=\"84\" text-anchor=\"middle\" class=\"id\"><tspan x=\"310\">1<\/tspan><\/text><text x=\"310\" y=\"113\" text-anchor=\"middle\"><tspan x=\"310\">Register<\/tspan><tspan x=\"310\" dy=\"16\">application<\/tspan><\/text><circle class=\"p\" cx=\"580\" cy=\"110\" r=\"46\"/><text x=\"580\" y=\"84\" text-anchor=\"middle\" class=\"id\"><tspan x=\"580\">2<\/tspan><\/text><text x=\"580\" y=\"113\" text-anchor=\"middle\"><tspan x=\"580\">Check<\/tspan><tspan x=\"580\" dy=\"16\">diploma<\/tspan><\/text><circle class=\"p\" cx=\"580\" cy=\"370\" r=\"46\"/><text x=\"580\" y=\"344\" text-anchor=\"middle\" class=\"id\"><tspan x=\"580\">3<\/tspan><\/text><text x=\"580\" y=\"373\" text-anchor=\"middle\"><tspan x=\"580\">Collect<\/tspan><tspan x=\"580\" dy=\"16\">tuition<\/tspan><\/text><circle class=\"p\" cx=\"310\" cy=\"370\" r=\"46\"/><text x=\"310\" y=\"344\" text-anchor=\"middle\" class=\"id\"><tspan x=\"310\">4<\/tspan><\/text><text x=\"310\" y=\"373\" text-anchor=\"middle\"><tspan x=\"310\">Issue<\/tspan><tspan x=\"310\" dy=\"16\">student card<\/tspan><\/text><path class=\"ds\" d=\"M365 220H535M365 260H535\"/><path class=\"ds\" d=\"M399 220V260\"/><text x=\"382\" y=\"245\" text-anchor=\"middle\" class=\"id\"><tspan x=\"382\">D1<\/tspan><\/text><text x=\"467\" y=\"245\" text-anchor=\"middle\"><tspan x=\"467\">Student file<\/tspan><\/text><path class=\"ds\" d=\"M515 460H665M515 500H665\"/><path class=\"ds\" d=\"M549 460V500\"/><text x=\"532\" y=\"485\" text-anchor=\"middle\" class=\"id\"><tspan x=\"532\">D2<\/tspan><\/text><text x=\"607\" y=\"485\" text-anchor=\"middle\"><tspan x=\"607\">Payments<\/tspan><\/text><path class=\"fl\" d=\"M147.538 206 L265.232 136.454\" marker-end=\"url(#ar)\"/><text x=\"198.385\" y=\"168.227\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"198.385\">application<\/tspan><\/text><path class=\"fl\" d=\"M348.105 145.383 L422 214\" marker-end=\"url(#ar)\"/><text x=\"375.053\" y=\"188.692\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"375.053\">student record<\/tspan><\/text><path class=\"fl\" d=\"M476 214 L543.23 146.77\" marker-end=\"url(#ar)\"/><text x=\"519.615\" y=\"189.385\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"519.615\">diploma data<\/tspan><\/text><path class=\"fl\" d=\"M632 110 L759 110\" marker-end=\"url(#ar)\"/><text x=\"689.15\" y=\"105\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"689.15\">check request<\/tspan><\/text><path class=\"fl\" d=\"M759 131.846 L700 150 L629.332 126.444\" marker-end=\"url(#ar)\"/><text x=\"719.941\" y=\"164.864\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"719.941\">result<\/tspan><\/text><path class=\"fl\" d=\"M476 266 L543.23 333.23\" marker-end=\"url(#ar)\"/><text x=\"519.615\" y=\"308.615\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"519.615\">invoice data<\/tspan><\/text><path class=\"fl\" d=\"M632 370 L759 370\" marker-end=\"url(#ar)\"/><text x=\"689.15\" y=\"365\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"689.15\">payment request<\/tspan><\/text><path class=\"fl\" d=\"M759 391.846 L700 410 L629.332 386.444\" marker-end=\"url(#ar)\"/><text x=\"719.941\" y=\"424.864\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"719.941\">confirmation<\/tspan><\/text><path class=\"fl\" d=\"M584.708 421.786 L587.636 454\" marker-end=\"url(#ar)\"/><text x=\"598.172\" y=\"440.893\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"598.172\">payment<\/tspan><\/text><path class=\"fl\" d=\"M523.818 454 L358.399 389.014\" marker-end=\"url(#ar)\"/><text x=\"424.838\" y=\"439.258\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"424.838\">paid?<\/tspan><\/text><path class=\"fl\" d=\"M422 266 L348.105 334.617\" marker-end=\"url(#ar)\"/><text x=\"375.053\" y=\"309.308\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"375.053\">student data<\/tspan><\/text><path class=\"fl\" d=\"M265.232 343.546 L147.538 274\" marker-end=\"url(#ar)\"/><text x=\"198.385\" y=\"329.773\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"198.385\">student card<\/tspan><\/text><\/svg>", "caption": "The same system, one level deeper", "script": "Now we open the circle and look at level zero. The external entities are still there, but the single process has become four: register application, check diploma, collect tuition and issue student card. Two data stores have appeared: D1, the student file, and D2, the payments. Follow one flow with me. The student sends an application to process one, which stores a student record in the student file. Process two reads the diploma data from that file, sends a check request to the education department and receives a result. Process three reads the invoice data, sends a payment request to the payment provider, receives a confirmation and stores the payment in D2. Process four reads the student data, checks whether the tuition has been paid, and sends the student card to the student. Every process has input and output, every arrow has a name, and no two stores or entities are connected directly. This is a correct diagram."}, {"id": 8, "type": "compare", "chip": "In context", "title": "A DFD answers 'where does the data go', other diagrams answer other questions", "left": {"head": "A data flow diagram shows", "items": ["Which data enters, is transformed, stored and leaves", "Which external parties are involved", "Where data waits, and in which store", "Nothing about order, timing or decisions"]}, "right": {"head": "Other diagrams show", "items": ["Flowchart or process model: the order of steps and the decisions in a process", "Entity-relationship diagram: how data is structured at rest, in tables", "Sequence diagram: which component calls which, in time", "Network diagram: servers, cables and firewalls"]}, "script": "As a data student you will meet many kinds of diagrams, so it helps to know what a DFD is not. A data flow diagram answers one question: where does the data go? It shows which data enters, is transformed, stored and leaves, which external parties are involved and where data waits. It says nothing about order, timing or decisions. There are no if-then branches in a DFD, and no arrows that mean 'and then'. Other diagrams answer other questions. A flowchart or a process model shows the order of steps and the decisions in a process. An entity-relationship diagram shows how data is structured at rest. A sequence diagram shows which component calls which, in time. A network diagram shows servers, cables and firewalls. All useful, and none of them replaces a DFD, because none of them puts the data itself at the centre."}, {"id": 9, "type": "bullets", "chip": "In context", "title": "DFDs are used far beyond data protection", "bullets": [{"k": "Systems analysis", "t": "the original use since the nineteen-seventies: understanding and designing information systems before building them."}, {"k": "Security", "t": "security specialists start from a DFD and ask, for every flow and every store, what can go wrong here and who could get at the data."}, {"k": "Data governance and lineage", "t": "knowing where a figure in a report comes from, and which systems it passed through."}, {"k": "Audits and certification", "t": "an auditor asks for the data flows first, whether the subject is finance, quality or information security."}, {"k": "Data protection", "t": "the use we focus on in this course: showing where personal data goes, so that the risks and obligations can be assessed."}], "script": "Data flow diagrams are used far beyond data protection, and you will probably meet them in several of these settings later on. They were born in systems analysis in the nineteen-seventies, as a way to understand and design information systems before building them. In security they are the starting point for finding weak spots: security specialists take a DFD and ask, for every flow and every store, what can go wrong here and who could get at the data. In data governance they describe data lineage: where does this figure in the report come from, and which systems did it pass through? Auditors ask for data flows first, whatever the subject. And then there is the use we focus on in this course: data protection. A DFD shows where personal data goes, and that is the basis for assessing risks and obligations. The same drawing, read with a different question."}, {"id": 10, "type": "bullets", "chip": "The DPO", "title": "Meet the person you will hand your diagram to: the data protection officer", "bullets": [{"k": "Who", "t": "the data protection officer, or DPO, is the person in an organisation who advises on, and monitors, the correct handling of personal data."}, {"k": "Not a builder", "t": "the DPO does not design systems and often has no technical background; they depend on people like you to explain how the data actually flows."}, {"k": "The hand-over", "t": "in practice the ICT or data team draws the DFD and hands it to the DPO, who reads it and asks questions; the diagram is your common language."}, {"k": "Later in this course", "t": "we will look at the role of the DPO in detail; for now it is enough to know that this is the reader you are drawing for."}], "script": "Let me introduce the person you will be drawing for. Many organisations have a data protection officer, usually called the DPO. The DPO advises on, and monitors, the correct handling of personal data in the organisation. What matters for you now: the DPO is not a builder. They do not design systems, and they often have no technical background. They depend on people like you, who know the architecture, to explain how the data actually flows. In practice the ICT or data team draws the data flow diagram and hands it to the DPO, who reads it and comes back with questions. The diagram is your common language. You do not need to know the law to draw it, and the DPO does not need to know the code to read it. Later in this course we look at the role of the DPO in detail. For now, this is the reader you are drawing for."}, {"id": 11, "type": "figure", "chip": "The DPO's view", "title": "The same diagram, read by a DPO: where is the personal data?", "svg": "<svg class=\"dfd\" viewBox=\"0 0 900 520\" role=\"img\" aria-label=\"The same diagram, read by a DPO\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-pd-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-bad-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M10 0L0 5L10 10z\"/><\/marker><\/defs><rect class=\"zone\" x=\"190\" y=\"14\" width=\"520\" height=\"496\" rx=\"10\"/><text x=\"202\" y=\"33\" text-anchor=\"start\" class=\"zone\"><tspan x=\"202\">THE COLLEGE (your organisation)<\/tspan><\/text><rect class=\"ee\" x=\"25\" y=\"212\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"90\" y=\"245\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"90\">Student<\/tspan><\/text><rect class=\"ee\" x=\"765\" y=\"82\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"830\" y=\"107\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"830\">Education<\/tspan><tspan x=\"830\" dy=\"16\">department<\/tspan><\/text><rect class=\"ee\" x=\"765\" y=\"342\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"830\" y=\"367\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"830\">Payment<\/tspan><tspan x=\"830\" dy=\"16\">provider<\/tspan><\/text><circle class=\"p\" cx=\"310\" cy=\"110\" r=\"46\"/><text x=\"310\" y=\"84\" text-anchor=\"middle\" class=\"id\"><tspan x=\"310\">1<\/tspan><\/text><text x=\"310\" y=\"113\" text-anchor=\"middle\"><tspan x=\"310\">Register<\/tspan><tspan x=\"310\" dy=\"16\">application<\/tspan><\/text><circle class=\"p\" cx=\"580\" cy=\"110\" r=\"46\"/><text x=\"580\" y=\"84\" text-anchor=\"middle\" class=\"id\"><tspan x=\"580\">2<\/tspan><\/text><text x=\"580\" y=\"113\" text-anchor=\"middle\"><tspan x=\"580\">Check<\/tspan><tspan x=\"580\" dy=\"16\">diploma<\/tspan><\/text><circle class=\"p\" cx=\"580\" cy=\"370\" r=\"46\"/><text x=\"580\" y=\"344\" text-anchor=\"middle\" class=\"id\"><tspan x=\"580\">3<\/tspan><\/text><text x=\"580\" y=\"373\" text-anchor=\"middle\"><tspan x=\"580\">Collect<\/tspan><tspan x=\"580\" dy=\"16\">tuition<\/tspan><\/text><circle class=\"p\" cx=\"310\" cy=\"370\" r=\"46\"/><text x=\"310\" y=\"344\" text-anchor=\"middle\" class=\"id\"><tspan x=\"310\">4<\/tspan><\/text><text x=\"310\" y=\"373\" text-anchor=\"middle\"><tspan x=\"310\">Issue<\/tspan><tspan x=\"310\" dy=\"16\">student card<\/tspan><\/text><path class=\"ds\" d=\"M365 220H535M365 260H535\"/><path class=\"ds\" d=\"M399 220V260\"/><text x=\"382\" y=\"245\" text-anchor=\"middle\" class=\"id\"><tspan x=\"382\">D1<\/tspan><\/text><text x=\"467\" y=\"245\" text-anchor=\"middle\"><tspan x=\"467\">Student file<\/tspan><\/text><path class=\"ds\" d=\"M515 460H665M515 500H665\"/><path class=\"ds\" d=\"M549 460V500\"/><text x=\"532\" y=\"485\" text-anchor=\"middle\" class=\"id\"><tspan x=\"532\">D2<\/tspan><\/text><text x=\"607\" y=\"485\" text-anchor=\"middle\"><tspan x=\"607\">Payments<\/tspan><\/text><path class=\"fl pd\" d=\"M147.538 206 L265.232 136.454\" marker-end=\"url(#ar-pd)\"/><text x=\"198.385\" y=\"168.227\" text-anchor=\"end\" class=\"lbl pd\"><tspan x=\"198.385\">application<\/tspan><\/text><path class=\"fl pd\" d=\"M348.105 145.383 L422 214\" marker-end=\"url(#ar-pd)\"/><text x=\"375.053\" y=\"188.692\" text-anchor=\"end\" class=\"lbl pd\"><tspan x=\"375.053\">student record<\/tspan><\/text><path class=\"fl pd\" d=\"M476 214 L543.23 146.77\" marker-end=\"url(#ar-pd)\"/><text x=\"519.615\" y=\"189.385\" text-anchor=\"start\" class=\"lbl pd\"><tspan x=\"519.615\">diploma data<\/tspan><\/text><path class=\"fl pd\" d=\"M632 110 L759 110\" marker-end=\"url(#ar-pd)\"/><text x=\"689.15\" y=\"105\" text-anchor=\"middle\" class=\"lbl pd\"><tspan x=\"689.15\">check request<\/tspan><\/text><path class=\"fl\" d=\"M759 131.846 L700 150 L629.332 126.444\" marker-end=\"url(#ar)\"/><text x=\"719.941\" y=\"164.864\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"719.941\">result<\/tspan><\/text><path class=\"fl pd\" d=\"M476 266 L543.23 333.23\" marker-end=\"url(#ar-pd)\"/><text x=\"519.615\" y=\"308.615\" text-anchor=\"start\" class=\"lbl pd\"><tspan x=\"519.615\">invoice data<\/tspan><\/text><path class=\"fl pd\" d=\"M632 370 L759 370\" marker-end=\"url(#ar-pd)\"/><text x=\"689.15\" y=\"365\" text-anchor=\"middle\" class=\"lbl pd\"><tspan x=\"689.15\">payment request<\/tspan><\/text><path class=\"fl\" d=\"M759 391.846 L700 410 L629.332 386.444\" marker-end=\"url(#ar)\"/><text x=\"719.941\" y=\"424.864\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"719.941\">confirmation<\/tspan><\/text><path class=\"fl pd\" d=\"M584.708 421.786 L587.636 454\" marker-end=\"url(#ar-pd)\"/><text x=\"598.172\" y=\"440.893\" text-anchor=\"start\" class=\"lbl pd\"><tspan x=\"598.172\">payment<\/tspan><\/text><path class=\"fl\" d=\"M523.818 454 L358.399 389.014\" marker-end=\"url(#ar)\"/><text x=\"424.838\" y=\"439.258\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"424.838\">paid?<\/tspan><\/text><path class=\"fl pd\" d=\"M422 266 L348.105 334.617\" marker-end=\"url(#ar-pd)\"/><text x=\"375.053\" y=\"309.308\" text-anchor=\"end\" class=\"lbl pd\"><tspan x=\"375.053\">student data<\/tspan><\/text><path class=\"fl pd\" d=\"M265.232 343.546 L147.538 274\" marker-end=\"url(#ar-pd)\"/><text x=\"198.385\" y=\"329.773\" text-anchor=\"end\" class=\"lbl pd\"><tspan x=\"198.385\">student card<\/tspan><\/text><rect class=\"flag\" x=\"774.8\" y=\"142\" width=\"110.4\" height=\"20\" rx=\"10\"/><text x=\"830\" y=\"157\" text-anchor=\"middle\" class=\"flag\"><tspan x=\"830\">external party<\/tspan><\/text><rect class=\"flag\" x=\"774.8\" y=\"402\" width=\"110.4\" height=\"20\" rx=\"10\"/><text x=\"830\" y=\"417\" text-anchor=\"middle\" class=\"flag\"><tspan x=\"830\">external party<\/tspan><\/text><\/svg>", "caption": "Highlighted: the flows that carry personal data, the boundary of the organisation and the external parties", "script": "Now look at the level zero diagram again, this time through the eyes of the DPO. The DPO does not ask how the system works. The DPO asks: where is the personal data? Three things are highlighted. First, the orange flows: every arrow that carries data about a person. The application, the student record, the diploma data, the invoice data, the student card. Almost every flow is orange, which is normal for a system about students. Second, the dashed line: the boundary of the organisation. Everything inside is under the college's control; everything that crosses the line goes somewhere else. Third, the red labels: the external parties that receive personal data, the education department and the payment provider. A DPO who reads this immediately has three questions ready: what exactly do we send to those two parties, why, and what have we agreed with them? That is the conversation your diagram makes possible."}, {"id": 12, "type": "chain", "chip": "Step by step", "title": "Lesson after lesson, we add a new layer to your diagram", "steps": [{"k": "Now", "t": "the four symbols and the levels; which flows and stores contain personal data, including metadata and pseudonymised data"}, {"k": "Next", "t": "who the parties in the diagram are, and what role they play towards the data"}, {"k": "Then", "t": "why each process exists, and which data is sensitive enough to deserve a flag"}, {"k": "Later", "t": "how flows are protected when they cross a boundary, how long stores keep data, and how the person behind the data can exercise their rights"}], "note": "You do not need to know any of the later layers yet. Each lesson gives you exactly the criteria you need to extend your diagram.", "script": "How does this continue? Lesson after lesson, we add a new layer to your diagram. Right now you learn the four symbols and the levels, and you learn to mark which flows and stores contain personal data, including the metadata and the pseudonymised data from the previous module. Next we look at the parties in the diagram: who they are, and what role they play towards the data. Then we add why each process exists, and which data is sensitive enough to deserve a flag. Later we look at how flows are protected when they cross a boundary, how long stores keep their data, and how the person behind the data can exercise their rights. You do not need to know any of that yet. Each lesson gives you exactly the criteria you need, and at the end of the course your diagram will contain everything a DPO needs to assess the system."}, {"id": 13, "type": "bullets", "chip": "Reading method", "title": "How to read any data flow diagram in five steps", "bullets": [{"k": "1. Start at the edges", "t": "find the external entities first: who supplies data, who receives it?"}, {"k": "2. Follow one flow", "t": "pick one arrow at an entity and follow it through processes and stores until it leaves the system or comes to rest."}, {"k": "3. Check the rules", "t": "does every process have input and output, does every arrow have a name, is nothing connected that should not be?"}, {"k": "4. List the stores", "t": "every data store is a place where data stays; note what is in it."}, {"k": "5. Ask the DPO question", "t": "which flows and stores contain data about a person, and which external parties receive it?"}], "script": "Before you read the three diagrams that follow, here is a method in five steps that works for any data flow diagram. Step one: start at the edges. Find the external entities first: who supplies data and who receives it? Step two: follow one flow. Pick one arrow at an entity and follow it through processes and stores until it leaves the system or comes to rest. Then take the next one. Step three: check the rules. Does every process have input and output? Does every arrow have a name? Is nothing connected that should not be? Step four: list the stores and note what is in them. Step five, the question of the DPO: which flows and stores contain data about a person, and which external parties receive it? For each of the three diagrams you first see the question. Pause, read, think, and only then click 'Show the answer'."}, {"id": "13a", "type": "figure", "chip": "Reading exercise 1", "title": "The library system", "svg": "<svg class=\"dfd\" viewBox=\"0 0 900 440\" role=\"img\" aria-label=\"Library system\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-pd-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-bad-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M10 0L0 5L10 10z\"/><\/marker><\/defs><rect class=\"ee\" x=\"35\" y=\"92\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"100\" y=\"125\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"100\">Student<\/tspan><\/text><rect class=\"ee\" x=\"735\" y=\"302\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"800\" y=\"335\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"800\">Management<\/tspan><\/text><circle class=\"p\" cx=\"330\" cy=\"120\" r=\"46\"/><text x=\"330\" y=\"94\" text-anchor=\"middle\" class=\"id\"><tspan x=\"330\">1<\/tspan><\/text><text x=\"330\" y=\"123\" text-anchor=\"middle\"><tspan x=\"330\">Lend<\/tspan><tspan x=\"330\" dy=\"16\">book<\/tspan><\/text><circle class=\"p\" cx=\"330\" cy=\"330\" r=\"46\"/><text x=\"330\" y=\"304\" text-anchor=\"middle\" class=\"id\"><tspan x=\"330\">2<\/tspan><\/text><text x=\"330\" y=\"333\" text-anchor=\"middle\"><tspan x=\"330\">Send<\/tspan><tspan x=\"330\" dy=\"16\">reminder<\/tspan><\/text><circle class=\"p\" cx=\"600\" cy=\"330\" r=\"46\"/><text x=\"600\" y=\"304\" text-anchor=\"middle\" class=\"id\"><tspan x=\"600\">3<\/tspan><\/text><text x=\"600\" y=\"333\" text-anchor=\"middle\"><tspan x=\"600\">Compile<\/tspan><tspan x=\"600\" dy=\"16\">statistics<\/tspan><\/text><path class=\"ds\" d=\"M525 100H675M525 140H675\"/><path class=\"ds\" d=\"M559 100V140\"/><text x=\"542\" y=\"125\" text-anchor=\"middle\" class=\"id\"><tspan x=\"542\">D1<\/tspan><\/text><text x=\"617\" y=\"125\" text-anchor=\"middle\"><tspan x=\"617\">Loans<\/tspan><\/text><path class=\"ds\" d=\"M255 210H405M255 250H405\"/><path class=\"ds\" d=\"M289 210V250\"/><text x=\"272\" y=\"235\" text-anchor=\"middle\" class=\"id\"><tspan x=\"272\">D2<\/tspan><\/text><text x=\"347\" y=\"235\" text-anchor=\"middle\"><tspan x=\"347\">Catalogue<\/tspan><\/text><path class=\"fl\" d=\"M171 120 L278 120\" marker-end=\"url(#ar)\"/><text x=\"224.5\" y=\"115\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"224.5\">student card scan<\/tspan><\/text><path class=\"fl\" d=\"M330 204 L330 172\" marker-end=\"url(#ar)\"/><text x=\"390\" y=\"197\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"390\">title, availability<\/tspan><\/text><path class=\"fl\" d=\"M382 120 L519 120\" marker-end=\"url(#ar)\"/><text x=\"450.5\" y=\"115\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"450.5\">loan record<\/tspan><\/text><path class=\"fl\" d=\"M566.571 146 L371.046 298.075\" marker-end=\"url(#ar)\"/><text x=\"498.809\" y=\"241.038\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"498.809\">overdue loans<\/tspan><\/text><path class=\"fl\" d=\"M278 330 L100 330 L100 154\" marker-end=\"url(#ar)\"/><text x=\"171.8\" y=\"351\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"171.8\">reminder email<\/tspan><\/text><path class=\"fl\" d=\"M600 146 L600 278\" marker-end=\"url(#ar)\"/><text x=\"656\" y=\"221\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"656\">loan records<\/tspan><\/text><path class=\"fl\" d=\"M652 330 L729 330\" marker-end=\"url(#ar)\"/><text x=\"690.5\" y=\"353\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"690.5\">monthly totals<\/tspan><\/text><\/svg>", "question": "Use the reading method. Which flows carry personal data? Which store contains personal data? And is there a flow that does not?", "verdict": "Four flows and one store", "answer": [{"k": "Personal data", "t": "student card scan, loan record, overdue loans and reminder email all relate to an identifiable student; store D1 'Loans' contains them."}, {"k": "No personal data", "t": "D2 'Catalogue' contains books, not people; 'title, availability' is about a book."}, {"k": "Be careful", "t": "'monthly totals' to management is aggregated and normally not personal data, unless a total is about a very small group; remember the small cells from the previous module."}], "script": "First reading exercise: the library system of a college. Read the diagram with the five steps. Start at the edges: a student and the management. Then follow the flows. Which flows carry personal data, which store contains personal data, and is there a flow that does not? Pause and think before you click. The answer. Four flows relate to an identifiable student: the student card scan, the loan record, the overdue loans and the reminder email. All of those end up in, or come out of, store D1, the loans, so that store contains personal data. Store D2, the catalogue, contains books, not people, and 'title, availability' is about a book. And then the interesting one: the monthly totals that go to management. Those are aggregated figures, and normally that is not personal data. But be careful: if a total is about a very small group, one department with two students for example, it points to a person after all. You know that from the previous module: small cells."}, {"id": "13b", "type": "figure", "chip": "Reading exercise 2", "title": "The smart meter, drawn with three mistakes", "svg": "<svg class=\"dfd\" viewBox=\"0 0 900 440\" role=\"img\" aria-label=\"Smart meter, with three mistakes\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-pd-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-bad-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M10 0L0 5L10 10z\"/><\/marker><\/defs><rect class=\"ee\" x=\"35\" y=\"92\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"100\" y=\"125\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"100\">Household<\/tspan><\/text><rect class=\"ee\" x=\"735\" y=\"92\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"800\" y=\"117\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"800\">Grid<\/tspan><tspan x=\"800\" dy=\"16\">operator<\/tspan><\/text><rect class=\"ee\" x=\"735\" y=\"312\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"800\" y=\"337\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"800\">Energy<\/tspan><tspan x=\"800\" dy=\"16\">supplier<\/tspan><\/text><circle class=\"p\" cx=\"330\" cy=\"120\" r=\"46\"/><text x=\"330\" y=\"94\" text-anchor=\"middle\" class=\"id\"><tspan x=\"330\">1<\/tspan><\/text><text x=\"330\" y=\"123\" text-anchor=\"middle\"><tspan x=\"330\">Measure<\/tspan><tspan x=\"330\" dy=\"16\">consumption<\/tspan><\/text><circle class=\"p\" cx=\"570\" cy=\"120\" r=\"46\"/><text x=\"570\" y=\"94\" text-anchor=\"middle\" class=\"id\"><tspan x=\"570\">2<\/tspan><\/text><text x=\"570\" y=\"123\" text-anchor=\"middle\"><tspan x=\"570\">Transmit<\/tspan><tspan x=\"570\" dy=\"16\">readings<\/tspan><\/text><circle class=\"p\" cx=\"330\" cy=\"340\" r=\"46\"/><text x=\"330\" y=\"314\" text-anchor=\"middle\" class=\"id\"><tspan x=\"330\">3<\/tspan><\/text><text x=\"330\" y=\"343\" text-anchor=\"middle\"><tspan x=\"330\">Prepare<\/tspan><tspan x=\"330\" dy=\"16\">invoice<\/tspan><\/text><path class=\"ds\" d=\"M495 230H645M495 270H645\"/><path class=\"ds\" d=\"M529 230V270\"/><text x=\"512\" y=\"255\" text-anchor=\"middle\" class=\"id\"><tspan x=\"512\">D1<\/tspan><\/text><text x=\"587\" y=\"255\" text-anchor=\"middle\"><tspan x=\"587\">Readings<\/tspan><\/text><path class=\"fl\" d=\"M171 120 L278 120\" marker-end=\"url(#ar)\"/><text x=\"224.5\" y=\"115\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"224.5\">consumption<\/tspan><\/text><path class=\"fl\" d=\"M382 120 L518 120\" marker-end=\"url(#ar)\"/><text x=\"450\" y=\"115\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"450\">quarter-hour value<\/tspan><\/text><path class=\"fl\" d=\"M570 172 L570 224\" marker-end=\"url(#ar)\"/><path class=\"fl\" d=\"M622 120 L729 120\" marker-end=\"url(#ar)\"/><text x=\"675.5\" y=\"115\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"675.5\">readings<\/tspan><\/text><path class=\"fl\" d=\"M800 154 L800 306\" marker-end=\"url(#ar)\"/><t
