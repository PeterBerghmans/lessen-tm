ext x=\"814\" y=\"239\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"814\">readings<\/tspan><\/text><path class=\"fl\" d=\"M500.667 276 L378.689 321.742\" marker-end=\"url(#ar)\"/><text x=\"439.678\" y=\"319.871\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"439.678\">readings<\/tspan><\/text><\/svg>", "question": "This diagram breaks three of the four rules. Which ones? And for each mistake: what would a DPO want to see instead?", "verdict": "Three rule violations", "answer": [{"k": "No label", "t": "the arrow from process 2 to store D1 has no name; what is stored?"}, {"k": "Entity to entity", "t": "the grid operator sends readings straight to the energy supplier; the process in between is missing, and that process is exactly what tells a DPO what the supplier does with the readings; the final destination of personal data belongs in the diagram, even when it lies outside your own organisation."}, {"k": "No output", "t": "process 3, 'prepare invoice', receives readings but sends nothing anywhere; the invoice, and the household it goes to, are missing."}], "script": "Second reading exercise, in a context you know from the previous module: the smart meter. The diagram is deliberately wrong. It breaks three of the four rules. Which ones? Pause, check every arrow and every circle, and then click. The answer. Mistake one: the arrow from process two to store D1 has no label. What is being stored? We cannot tell. Mistake two: the grid operator sends readings straight to the energy supplier. That is a flow between two external entities, and what is missing is the process in between. For a DPO that process is not a detail: it shows what the supplier does with the readings, invoicing for example, and from that the purpose of the processing can be derived. So do not simply delete the arrow. When personal data leaves your organisation, the DPO wants to see where it finally ends up and what happens to it there, even when that happens outside your own walls. Mistake three: process three, prepare invoice, receives readings but sends nothing anywhere. A process without output is incomplete: the invoice is missing, and so is the household it goes to. Notice that spotting these mistakes takes no technical knowledge at all. It only takes the rules, and a careful reader."}, {"id": "13c", "type": "figure", "chip": "Reading exercise 3", "title": "The messaging app: content versus metadata", "svg": "<svg class=\"dfd\" viewBox=\"0 0 900 300\" role=\"img\" aria-label=\"Messaging app, as drawn by the ICT department\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-pd-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-bad-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M10 0L0 5L10 10z\"/><\/marker><\/defs><rect class=\"ee\" x=\"35\" y=\"102\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"100\" y=\"135\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"100\">Sender<\/tspan><\/text><rect class=\"ee\" x=\"735\" y=\"102\" width=\"130\" height=\"56\" rx=\"3\"/><text x=\"800\" y=\"135\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"800\">Receiver<\/tspan><\/text><circle class=\"p\" cx=\"330\" cy=\"130\" r=\"46\"/><text x=\"330\" y=\"104\" text-anchor=\"middle\" class=\"id\"><tspan x=\"330\">1<\/tspan><\/text><text x=\"330\" y=\"133\" text-anchor=\"middle\"><tspan x=\"330\">Encrypt and<\/tspan><tspan x=\"330\" dy=\"16\">send<\/tspan><\/text><circle class=\"p\" cx=\"620\" cy=\"130\" r=\"46\"/><text x=\"620\" y=\"104\" text-anchor=\"middle\" class=\"id\"><tspan x=\"620\">2<\/tspan><\/text><text x=\"620\" y=\"141\" text-anchor=\"middle\"><tspan x=\"620\">Deliver<\/tspan><\/text><path class=\"ds\" d=\"M385 226H565M385 274H565\"/><path class=\"ds\" d=\"M419 226V274\"/><text x=\"402\" y=\"255\" text-anchor=\"middle\" class=\"id\"><tspan x=\"402\">D1<\/tspan><\/text><text x=\"492\" y=\"247\" text-anchor=\"middle\"><tspan x=\"492\">Message queue<\/tspan><tspan x=\"492\" dy=\"16\">(encrypted)<\/tspan><\/text><path class=\"fl\" d=\"M171 130 L278 130\" marker-end=\"url(#ar)\"/><text x=\"224.5\" y=\"125\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"224.5\">message text<\/tspan><\/text><path class=\"fl\" d=\"M370.061 163.154 L438.75 220\" marker-end=\"url(#ar)\"/><text x=\"390.405\" y=\"212.577\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"390.405\">encrypted message<\/tspan><\/text><path class=\"fl\" d=\"M511.25 220 L579.939 163.154\" marker-end=\"url(#ar)\"/><text x=\"559.595\" y=\"212.577\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"559.595\">encrypted message<\/tspan><\/text><path class=\"fl\" d=\"M672 130 L729 130\" marker-end=\"url(#ar)\"/><text x=\"700.5\" y=\"125\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"700.5\">message<\/tspan><\/text><\/svg>", "question": "The ICT department says: 'The content is end-to-end encrypted, so this diagram contains no personal data worth mentioning.' Read critically: which metadata does the system need to deliver a message, and where is that metadata in the diagram?", "verdict": "The metadata is nowhere in the diagram", "answer": [{"k": "Content versus metadata", "t": "the diagram only shows the content; the metadata, who sends to whom, when, how often and from which device, is not drawn anywhere, and metadata is personal data."}, {"k": "Missing store", "t": "somewhere there is a delivery log or a contact list that links sender and receiver, with timestamps and probably IP addresses; that is a data store full of metadata."}, {"k": "Missing flows", "t": "the phone numbers or account names of sender and receiver flow into process 1 and out of process 2, even though only 'message' is written on the arrows; that metadata should be on the labels."}, {"k": "Lesson", "t": "encryption of the content protects the content, not the metadata; a DPO reads a diagram for what is not there, and metadata is the first thing to look for."}], "script": "Third reading exercise, and this one is about reading critically. The diagram shows a messaging app, as drawn by the ICT department. Their comment: the content is end-to-end encrypted, so this diagram contains no personal data worth mentioning. Is that right? Think back to the previous module, and to the difference between content and metadata. Which metadata does the system need to deliver a message, and where is that metadata in the diagram? Pause and think. The answer: the metadata is nowhere in the diagram. The drawing only shows the content. Who sends to whom, when, how often and from which device is not drawn anywhere, and yet the system must know all of that to deliver a single message. Somewhere there is a delivery log or a contact list that links sender and receiver, with timestamps and probably IP addresses. That is a data store full of metadata, and metadata is personal data, whether the content is encrypted or not. The lesson: encryption protects the content, not the metadata. A DPO reads a diagram for what is not there, and metadata is the first thing to look for."}, {"id": 14, "type": "summary", "chip": "Remember", "title": "What to take away from this module", "key": "A data flow diagram shows where data enters, is transformed, stored and leaves; for a DPO it must show, above all, where the personal data is.", "bullets": [{"k": "Four symbols", "t": "external entity, process, data store, data flow; four rules keep the diagram correct."}, {"k": "Levels", "t": "context diagram, level 0, level 1: from who exchanges data with us to the detail of one process."}, {"k": "The DPO", "t": "reads your diagram without technical knowledge; the diagram is your common language."}, {"k": "Read for the data", "t": "which flows and stores contain data about a person, which parties receive it, and what is not drawn but should be."}], "script": "What do you take away? One key sentence: a data flow diagram shows where data enters, is transformed, stored and leaves, and for a DPO it must show, above all, where the personal data is. Concretely: four symbols, external entity, process, data store and data flow, and four rules that keep the diagram correct. Three levels, from the context diagram that shows who exchanges data with us, down to the detail of one process. A reader, the DPO, who reads your diagram without technical knowledge, which is why the diagram is your common language. And a way of reading: which flows and stores contain data about a person, which parties receive it, and what is not drawn but should be. In the next exercise you will draw a diagram yourself. Those who wish can first follow a short deep dive on tools and naming conventions."}, {"id": "V1", "type": "bullets", "optional": true, "chip": "Deep dive (optional)", "title": "Tools and conventions for drawing your own DFD", "bullets": [{"k": "Tools", "t": "draw.io (diagrams.net), Lucidchart, Visio and even PowerPoint all have DFD shapes; draw.io is free and exports to PNG, PDF and SVG."}, {"k": "Naming", "t": "processes get a verb ('check diploma'), flows and stores get a noun ('diploma data', 'student file'); avoid 'data', 'info' and 'file' on their own."}, {"k": "Numbering", "t": "0 for the context process, 1, 2, 3 on level 0, 2.1, 2.2 on level 1; stores D1, D2, D3."}, {"k": "Balancing", "t": "every flow that crosses the edge of a lower level must also exist on the level above; if not, one of the two diagrams is wrong."}, {"k": "Keep it readable", "t": "seven processes per page is a practical maximum; if you need more, add a level."}], "script": "For those who want to prepare for drawing: some tools and conventions. Almost every diagramming tool has DFD shapes: draw.io, also known as diagrams dot net, Lucidchart, Visio and even PowerPoint. Draw.io is free and exports to PNG, PDF and SVG, which makes it a good choice for this course. Naming: processes get a verb, such as check diploma; flows and stores get a noun, such as diploma data or student file. Avoid words like data, info or file on their own; they say nothing. Numbering: zero for the context process, one, two, three on level zero, two point one and two point two on level one, and D1, D2, D3 for the stores. Balancing: every flow that crosses the edge of a lower level must also exist on the level above. If not, one of the two diagrams is wrong. And keep it readable: about seven processes per page is a practical maximum. If you need more, add a level instead of shrinking the font."}, {"id": "V2", "type": "figure", "optional": true, "chip": "Deep dive (optional)", "title": "Other notations you may use: Gane-Sarson and swimlanes", "svg": "<svg class=\"dfd\" viewBox=\"0 0 900 330\" role=\"img\" aria-label=\"The enrolment flow drawn with swimlanes\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-pd\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-pd-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar pd\" d=\"M10 0L0 5L10 10z\"/><\/marker><marker id=\"ar-bad\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M0 0L10 5L0 10z\"/><\/marker><marker id=\"ar-bad-s\" viewBox=\"0 0 10 10\" refX=\"1\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path class=\"ar bad\" d=\"M10 0L0 5L10 10z\"/><\/marker><\/defs><rect class=\"lane\" x=\"20\" y=\"15\" width=\"860\" height=\"100\"/><path class=\"ds\" d=\"M110 15V115\" style=\"stroke-width:1.5\"/><text x=\"65\" y=\"70\" text-anchor=\"middle\" class=\"lane\"><tspan x=\"65\">Student<\/tspan><\/text><rect class=\"lane\" x=\"20\" y=\"115\" width=\"860\" height=\"100\"/><path class=\"ds\" d=\"M110 115V215\" style=\"stroke-width:1.5\"/><text x=\"65\" y=\"170\" text-anchor=\"middle\" class=\"lane\"><tspan x=\"65\">College<\/tspan><\/text><rect class=\"lane\" x=\"20\" y=\"215\" width=\"860\" height=\"100\"/><path class=\"ds\" d=\"M110 215V315\" style=\"stroke-width:1.5\"/><text x=\"65\" y=\"262\" text-anchor=\"middle\" class=\"lane\"><tspan x=\"65\">Payment<\/tspan><tspan x=\"65\" dy=\"16\">provider<\/tspan><\/text><rect class=\"p\" x=\"145\" y=\"40\" width=\"110\" height=\"50\" rx=\"12\"/><text x=\"200\" y=\"62\" text-anchor=\"middle\"><tspan x=\"200\">Submit<\/tspan><tspan x=\"200\" dy=\"16\">application<\/tspan><\/text><rect class=\"p\" x=\"145\" y=\"140\" width=\"110\" height=\"50\" rx=\"12\"/><text x=\"200\" y=\"162\" text-anchor=\"middle\"><tspan x=\"200\">Register<\/tspan><tspan x=\"200\" dy=\"16\">application<\/tspan><\/text><rect class=\"p\" x=\"345\" y=\"140\" width=\"110\" height=\"50\" rx=\"12\"/><text x=\"400\" y=\"162\" text-anchor=\"middle\"><tspan x=\"400\">Send<\/tspan><tspan x=\"400\" dy=\"16\">invoice<\/tspan><\/text><rect class=\"p\" x=\"465\" y=\"40\" width=\"110\" height=\"50\" rx=\"12\"/><text x=\"520\" y=\"62\" text-anchor=\"middle\"><tspan x=\"520\">Pay<\/tspan><tspan x=\"520\" dy=\"16\">tuition<\/tspan><\/text><rect class=\"p\" x=\"605\" y=\"240\" width=\"110\" height=\"50\" rx=\"12\"/><text x=\"660\" y=\"262\" text-anchor=\"middle\"><tspan x=\"660\">Process<\/tspan><tspan x=\"660\" dy=\"16\">payment<\/tspan><\/text><rect class=\"p\" x=\"605\" y=\"140\" width=\"110\" height=\"50\" rx=\"12\"/><text x=\"660\" y=\"162\" text-anchor=\"middle\"><tspan x=\"660\">Issue<\/tspan><tspan x=\"660\" dy=\"16\">student card<\/tspan><\/text><rect class=\"p\" x=\"770\" y=\"40\" width=\"100\" height=\"50\" rx=\"12\"/><text x=\"820\" y=\"62\" text-anchor=\"middle\"><tspan x=\"820\">Receive<\/tspan><tspan x=\"820\" dy=\"16\">card<\/tspan><\/text><path class=\"fl\" d=\"M200 96 L200 134\" marker-end=\"url(#ar)\"/><text x=\"210\" y=\"124\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"210\">application<\/tspan><\/text><path class=\"fl\" d=\"M261 165 L339 165\" marker-end=\"url(#ar)\"/><text x=\"300\" y=\"160\" text-anchor=\"middle\" class=\"lbl\"><tspan x=\"300\">student record<\/tspan><\/text><path class=\"fl\" d=\"M437.2 134 L482.8 96\" marker-end=\"url(#ar)\"/><text x=\"452\" y=\"114\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"452\">invoice<\/tspan><\/text><path class=\"fl\" d=\"M541.7 96 L638.3 234\" marker-end=\"url(#ar)\"/><text x=\"582\" y=\"170\" text-anchor=\"end\" class=\"lbl\"><tspan x=\"582\">payment<\/tspan><\/text><path class=\"fl\" d=\"M660 234 L660 196\" marker-end=\"url(#ar)\"/><text x=\"670\" y=\"224\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"670\">confirmation<\/tspan><\/text><path class=\"fl\" d=\"M709.6 134 L770.4 96\" marker-end=\"url(#ar)\"/><text x=\"750\" y=\"124\" text-anchor=\"start\" class=\"lbl\"><tspan x=\"750\">student card<\/tspan><\/text><\/svg>", "caption": "The enrolment flow drawn with swimlanes: one lane per actor, every lane crossing is data changing hands", "bullets": [{"k": "Gane-Sarson", "t": "rounded rectangles for processes and open-ended rectangles for stores; common in business analysis and in Visio templates."}, {"k": "Swimlanes", "t": "one horizontal lane per actor (student, college, payment provider); each step sits in the lane of whoever performs it, and an arrow crossing a lane is data leaving one party for another."}, {"k": "Same meaning", "t": "whatever the shapes: an external entity, a process, a store and a flow; if you can read one notation, you can read them all."}, {"k": "Your choice", "t": "use the notation your tool offers, but keep it consistent, label every flow, and keep the four building blocks and the personal data recognisable."}], "script": "You will sometimes see data flow diagrams that look different from the ones in this module, and you are free to use those notations in your own work. The most common variant is Gane-Sarson: rounded rectangles for processes and open-ended rectangles for stores, which you will find in business analysis and in many Visio templates. Another popular representation is the swimlane diagram, shown on the slide. Each horizontal band, or lane, belongs to one actor: the student, the college, the payment provider. Every step sits in the lane of the actor who performs it, and every arrow that crosses a lane is data changing hands. For a DPO that is a very readable picture, because the moment personal data leaves your organisation is literally visible as a line crossing into another lane. Whatever the shapes, the meaning is the same: an external entity, a process, a store and a flow. If you can read one notation, you can read them all. Whichever one you choose, keep it consistent within a diagram, label every flow, and make sure the four building blocks and the personal data remain recognisable, because that is what your reader needs."}], "quiz": [{"q": "Which four symbols make up a data flow diagram?", "options": ["External entity, process, data store and data flow.", "Start, decision, action and end.", "Table, relation, attribute and key.", "Server, client, firewall and connection."], "answer": 0, "feedback": ["Correct. Rectangle, circle, two parallel lines and an arrow: that is all you need.", "Those are flowchart symbols; a flowchart shows order and decisions, not where data goes.", "Those are the building blocks of an entity-relationship diagram, which shows data at rest.", "Those belong to a network diagram; a DFD is about data, not infrastructure."]}, {"q": "What does a data flow diagram deliberately NOT show?", "options": ["The order of the steps and the decisions taken in between.", "Which external parties exchange data with the system.", "Where data is stored between two processes.", "Which data an arrow carries."], "answer": 0, "feedback": ["Correct. A DFD has no 'and then' and no if-then branches; that is what a flowchart or a process model is for.", "External entities are one of the four symbols; the context diagram exists precisely to show them.", "That is what a data store is for.", "Every flow carries a label with the name of the data; an arrow without a label breaks the rules."]}, {"q": "What is a context diagram?", "options": ["A single process for the whole system, surrounded by all external entities.", "A diagram of one process worked out in numbered sub-steps.", "A list of all data stores with their contents.", "A diagram of the network on which the system runs."], "answer": 0, "feedback": ["Correct. It answers the question 'who exchanges data with us?' and is often the most useful page for a DPO.", "That is level 1: one process opened up into steps such as 2.1, 2.2, 2.3.", "A DFD is a diagram, not a list; the stores appear from level 0 onwards.", "A network diagram is a different tool with a different question."]}, {"q": "Which of the following flows is NOT allowed in a data flow diagram?", "options": ["An arrow directly from one external entity to another external entity.", "An arrow from a process to a data store.", "An arrow from a data store to a process.", "An arrow from an external entity to a process."], "answer": 0, "feedback": ["Correct. Two external parties never exchange data directly in your diagram: either the exchange is outside your system, or a process is missing that you should draw, so that the reader sees what the data is used for.", "That is a normal write: the process stores data.", "That is a normal read: the process retrieves data.", "That is how data enters the system."]}, {"q": "A process in a diagram has two incoming arrows and no outgoing arrow. What does that tell you?", "options": ["The diagram is probably incomplete: every process must have input and output.", "The process is a data store and has been drawn with the wrong symbol.", "Nothing; processes that only receive data are common.", "The process is an external entity."], "answer": 0, "feedback": ["Correct. A process transforms data, so something has to come out; a missing output is a sign that a flow or a receiver was forgotten.", "A store has no arrows of its own; a process with only inputs is simply incomplete.", "A process without output cannot do anything useful; it is one of the four rule violations.", "External entities are rectangles at the edge; a circle is always a process."]}, {"q": "Why should a data flow diagram be your common language with the DPO?", "options": ["Because the DPO usually has no technical background and needs to see how the data actually flows without reading code.", "Because the DPO is responsible for building the system and needs the diagram as a specification.", "Because the law requires every organisation to draw DFDs.", "Because a DFD replaces all other documentation about the system."], "answer": 0, "feedback": ["Correct. The technical team draws, the DPO reads and asks questions; the diagram bridges the two.", "The DPO advises and monitors; they do not design or build systems.", "There is no such obligation; the DFD is a practical tool, not a legal requirement.", "A DFD answers one question, where the data goes; other diagrams and documents remain necessary."]}, {"q": "What does a DPO look for first when reading your diagram?", "options": ["Which flows and stores contain data about a person, and which external parties receive it.", "Whether the numbering of the processes is consecutive.", "How many servers are needed to run the system.", "Whether the diagram was drawn in draw.io or in Visio."], "answer": 0, "feedback": ["Correct. The DPO's question is 'where is the personal data?', with special attention to what crosses the boundary of the organisation.", "Numbering is a convention that helps readability, but it is not what the DPO is after.", "Infrastructure is not part of a DFD.", "The tool is irrelevant; the notation and the content are what matter."]}, {"q": "In the library exercise, 'monthly totals' flow from the statistics process to management. Why did the answer say 'be careful'?", "options": ["Because aggregated figures about a very small group can still point to one person.", "Because management is an external entity and may not receive any data.", "Because statistics are always personal data.", "Because totals must always be stored in a data store first."], "answer": 0, "feedback": ["Correct. Aggregated data is normally not personal data, but a small cell, such as one department with two students, identifies people after all.", "External entities may receive data; that is exactly what the diagram shows.", "Aggregated statistics about large groups are not personal data; it depends on the size of the group.", "There is no such rule; a process may send data straight to an entity."]}, {"q": "The messaging app diagram showed only the encrypted message. What was missing from a data protection point of view?", "options": ["The metadata: who sends to whom, when, how often, and the log or contact list that holds it.", "The colour of the arrows.", "A network diagram of the servers.", "Nothing; encrypted content means there is no personal data."], "answer": 0, "feedback": ["Correct. Encryption protects the content, not the metadata; the metadata is personal data and lives in stores and flows that were not drawn.", "Colour is a presentation choice; the problem was missing elements.", "Infrastructure is not part of a DFD, and it was not the point of the exercise.", "Metadata is personal data, as you learned in the previous module; encryption of the content changes nothing about that."]}, {"q": "Which statement about levels in a DFD is correct?", "options": ["Every flow that crosses the edge of a lower level must also appear on the level above.", "Level 1 always contains more external entities than the context diagram.", "You must always draw at least five levels.", "Data stores appear only in the context diagram."], "answer": 0, "feedback": ["Correct. This is called balancing; if a flow exists on one level and not on the other, one of the two diagrams is wrong.", "External entities are fixed at the context level; lower levels do not invent new ones.", "You go only as deep as is useful; three levels are usually enough.", "The context diagram has no stores at all; they appear from level 0 onwards."]}]}</script>

  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }
  $('dots').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.n,true); });

  function go(n, play){
    i = Math.max(0, Math.min(S.length-1, n)); seen.add(i);
    $('slidecard').innerHTML = render(S[i]); setTranscript(S[i].script);
    const rb = $('btn-reveal'); if(rb){ rb.addEventListener('click',()=>{ rb.classList.add('hidden'); $('reveal-ans').classList.remove('hidden'); }); }
    const firstOpt = S.findIndex(x=>x.optional); const isFirstOpt = S[i].optional && (i===0 || !S[i-1].optional);
    $('optbar').classList.toggle('hidden', !isFirstOpt); if(isFirstOpt){ $('optbar-text').textContent = U.optional_intro||''; }
    $('counter').textContent = (i+1)+' / '+S.length; $('counter').title = fmt(U.slide_of,{n:i+1,total:S.length});
    $('btn-prev').disabled = i===0;
    const last = i===S.length-1;
    $('btn-next').querySelector('span').textContent = last ? U.to_quiz : U.next; $('btn-next').title = last ? U.to_quiz : U.next;
    dots();
    audio.pause(); audio.currentTime = 0; audioOk = true; $('audio-hint').classList.add('hidden');
    { const nn=String(i+1).padStart(2,'0'); audio.src = (typeof AUDIO_DATA!=='undefined' && AUDIO_DATA[nn]) ? AUDIO_DATA[nn] : AUDIO_DIR + '/slide-' + nn + '.mp3'; }
    audio.playbackRate = rate; setPlay(false); $('barfill').style.width='0'; $('time').textContent='0:00 / 0:00';
    if(play){ audio.play().catch(()=>{}); }
  }
  function setPlay(on){ $('btn-play').textContent = on ? '❚❚' : '▶'; $('btn-play').title = on ? U.pause : U.play; }
  const mmss = t => isFinite(t) ? Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0') : '0:00';
  audio.addEventListener('play',()=>setPlay(true));
  audio.addEventListener('pause',()=>setPlay(false));
  audio.addEventListener('timeupdate',()=>{ highlight(); if(audio.duration){ $('barfill').style.width=(audio.currentTime/audio.duration*100)+'%'; $('time').textContent=mmss(audio.currentTime)+' / '+mmss(audio.duration); } });
  audio.addEventListener('loadedmetadata',()=>{ $('time').textContent='0:00 / '+mmss(audio.duration); });
  audio.addEventListener('ended',()=>{ setPlay(false); if($('autoplay').checked && i<S.length-1 && S[i].type!=='practice'){ setTimeout(()=>go(i+1,true),700); } });
  audio.addEventListener('error',()=>{ audioOk=false; setPlay(false); $('audio-hint').textContent = 'Audio file not found. Check that the "audio" folder sits next to this file.'; $('audio-hint').classList.remove('hidden'); });
  $('btn-play').addEventListener('click',()=>{ if(!audioOk) return; if(audio.paused){ if(audio.ended) audio.currentTime=0; audio.play().catch(()=>{});} else audio.pause(); });
  $('bar').addEventListener('click',e=>{ if(!audio.duration) return; const r=e.currentTarget.getBoundingClientRect(); audio.currentTime = (e.clientX-r.left)/r.width*audio.duration; });
  $('btn-prev').addEventListener('click',()=>go(i-1,true));
  $('btn-next').addEventListener('click',()=>{ if(i===S.length-1){ audio.pause(); show('quiz-intro'); } else go(i+1,true); });
  $('btn-start').addEventListener('click',()=>{ started=true; show('pres'); go(0,true); });
  if(U.optional_skip){ $('btn-opt-skip').textContent = U.optional_skip; }
  $('btn-opt-skip').addEventListener('click',()=>{ audio.pause(); let k=i; while(k<S.length && S[k].optional) k++; if(k>=S.length) show('quiz-intro'); else go(k,true); });
  setRate(rate);
  document.addEventListener('keydown',e=>{
    if($('pres').classList.contains('hidden')) return;
    if(e.key==='ArrowRight'){ if(i<S.length-1) go(i+1,true); }
    else if(e.key==='ArrowLeft'){ go(i-1,true); }
    else if(e.key===' '){ e.preventDefault(); $('btn-play').click(); }
  });

  /* ---- quiz ---- */
  const Q = C.quiz; let qi = 0, answers = [];
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');
    $('btn-q-next').textContent = qi===Q.length-1 ? U.show_result : U.next_question;
  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const n = +b.dataset.n, q = Q[qi], ok = n===q.answer;
    answers[qi] = n;
    [...$('opts').children].forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add('ok'); else if(k===n) o.classList.add('bad'); else o.classList.add('dim'); });
    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n]);
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>';
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});
    $('r-msg').textContent = score>=tot*0.8 ? U.result_good : (score>=tot*0.5 ? U.result_mid : U.result_low);
    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');
  }
  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
})();
