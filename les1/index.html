<!DOCTYPE html>
<html lang="en" data-theme="tm">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 1 · How rules are made and who supervises them</title>
<style>
/* ---------- basis ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- lay-out ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:var(--header-bg);color:var(--header-text);border-bottom:var(--header-border)}
header.top .logo{height:38px;width:auto;display:block}
nav.main{display:flex;gap:6px;margin-left:auto}
nav.main button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
nav.main button:hover{color:var(--accent);border-color:var(--accent)}
nav.main button.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
@media (max-width:640px){nav.main button{padding:6px 10px;font-size:12px}}
header.top .modlabel{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;width:100%}
.stage{width:100%;max-width:1080px}
.stage.wide{max-width:1480px}
footer.bottom{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 18px}

/* ---------- kaart / slide ---------- */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.slide{aspect-ratio:16/9;display:flex;flex-direction:column;padding:clamp(20px,4vw,48px) clamp(20px,5vw,60px);position:relative}
.slide>*{position:relative;z-index:1}
.slide .decor{z-index:0!important}
.slide .chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-text);background:var(--chip-bg);padding:5px 12px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.slide h2{font-size:clamp(20px,2.6vw,32px);line-height:1.2;font-weight:700;color:var(--title);margin-bottom:clamp(14px,2.4vw,28px)}
.slide .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.slide .decor{position:absolute;right:0;bottom:0;width:30%;height:55%;pointer-events:none;opacity:var(--decor-opacity);background:var(--decor);background-repeat:no-repeat;background-position:right bottom;background-size:contain}

/* titel-slide */
.slide.title{justify-content:center;background:var(--title-bg);color:var(--title-text)}
.slide.title .decor{width:100%;height:100%;opacity:var(--title-decor-opacity);background:var(--title-decor);background-size:cover;background-position:center}
.slide.title .inner{position:relative;max-width:78%}
.slide.title .kicker{font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;margin-bottom:14px}
.slide.title h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:700;margin-bottom:16px}
.slide.title p{font-size:clamp(15px,1.7vw,21px);opacity:.92}
.slide.title .logo{position:absolute;right:clamp(16px,3vw,36px);top:clamp(16px,3vw,32px);height:clamp(26px,3.6vw,44px);width:auto}

/* bullets */
ul.bul{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.4vw,16px)}
ul.bul li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:clamp(13px,1.45vw,18px)}
ul.bul li::before{content:"";width:.7em;height:.7em;border-radius:var(--bullet-radius);background:var(--accent);margin-top:.42em}
ul.bul b{color:var(--accent);font-weight:700}

/* vergelijking */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,28px)}
.compare .col{border:2px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vw,20px);position:relative}
.compare .col h3{font-size:clamp(15px,1.7vw,21px);color:var(--accent);margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.compare .col li{list-style:none;font-size:clamp(12px,1.3vw,16px);padding:5px 0 5px 1.1em;position:relative}
.compare .col li::before{content:"";position:absolute;left:0;top:.85em;width:.5em;height:.5em;border-radius:var(--bullet-radius);background:var(--accent)}

/* tijdlijn */
.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,14px);position:relative;padding-top:16px}
.timeline::before{content:"";position:absolute;left:4%;right:4%;top:calc(16px + .55em);height:3px;background:var(--line)}
.timeline .st{text-align:center;position:relative;font-size:clamp(11px,1.25vw,15px)}
.timeline .st .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--accent);margin:0 auto 10px;position:relative;box-shadow:0 0 0 4px var(--card-bg)}
.timeline .st .y{font-weight:700;color:var(--accent);font-size:clamp(14px,1.7vw,22px);margin-bottom:6px}

/* keten */
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:clamp(6px,1vw,12px);align-items:stretch}
.chain .st{background:var(--chain-bg);border-radius:12px;padding:clamp(8px,1.2vw,16px) clamp(6px,1vw,12px);position:relative;font-size:clamp(11px,1.1vw,14px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.chain .st .n{width:2em;height:2em;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:clamp(12px,1.3vw,16px)}
.chain .st b{display:block;color:var(--title);margin-bottom:6px;font-size:clamp(12px,1.35vw,17px)}
.chain .st:not(:last-child)::after{content:"";position:absolute;right:-.9em;top:50%;transform:translateY(-50%);border:.5em solid transparent;border-left-color:var(--accent);border-right:0}
.note{margin-top:clamp(12px,2vw,24px);font-size:clamp(12px,1.25vw,15px);color:var(--muted);border-left:4px solid var(--accent);padding-left:12px}

/* AI-transparantie */
.ai-notice{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--chain-bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 22px;font-size:14px;line-height:1.5}
.ai-notice img{height:48px;width:auto}
.ai-notice b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ai-badge img{height:30px;width:auto;margin:-5px 0}
footer.bottom .ai-line{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
footer.bottom .ai-line img{height:22px;width:auto;opacity:.85}

/* meeleestekst */
.pres-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:1100px){.pres-grid.with-text{grid-template-columns:minmax(0,1fr) 360px}}
.transcript{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.transcript .t-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.transcript .t-body{padding:14px 18px 18px;overflow:auto;font-size:15px;line-height:1.65}
.transcript .t-body span{transition:background .2s;border-radius:4px;padding:1px 0}
.transcript .t-body span.now{background:var(--chain-bg);box-shadow:0 0 0 3px var(--chain-bg);color:var(--title);font-weight:700}
.t-toggle{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.t-toggle:hover{color:var(--accent);border-color:var(--accent)}
#btn-text-show{margin-top:12px}

/* citaat */
.quote{background:var(--chain-bg);border-left:6px solid var(--accent);border-radius:0 12px 12px 0;padding:clamp(12px,1.8vw,22px) clamp(14px,2vw,26px);margin-bottom:clamp(10px,1.6vw,18px)}
.quote .src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quote .txt{font-size:clamp(13px,1.45vw,18px);line-height:1.5;font-style:italic;color:var(--title)}
/* denkoefening */
.reveal .q{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:var(--title);background:var(--chain-bg);border-radius:12px;padding:clamp(12px,1.8vw,22px)}
.reveal .q b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-style:normal}
.reveal .ans{margin-top:clamp(10px,1.6vw,18px)}
.reveal .verdict{display:inline-block;font-weight:700;color:#fff;background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-size:clamp(13px,1.4vw,17px)}
.reveal .btn{margin-top:clamp(10px,1.6vw,18px)}
/* optioneel */
.optbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--muted);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
.slide .chip.opt{background:var(--muted);color:#fff}

/* praktijkopdracht */
.practice{display:grid;grid-template-columns:1fr auto;gap:clamp(12px,2vw,28px);align-items:start}
.practice ol{padding-left:1.4em;display:flex;flex-direction:column;gap:clamp(5px,.9vw,10px);font-size:clamp(12px,1.3vw,16px)}
.practice ol li::marker{color:var(--accent);font-weight:700}
.practice .side{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:180px;max-width:240px}
.practice .side .hint{font-size:clamp(11px,1.15vw,14px);color:var(--muted);background:var(--chain-bg);padding:10px 12px;border-radius:10px}
.practice .side a.btn{text-decoration:none;justify-content:center;text-align:center}
.practice .intro{font-size:clamp(13px,1.4vw,17px);margin-bottom:clamp(8px,1.4vw,16px);font-weight:700;color:var(--title)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chain-bg);border-left:6px solid var(--accent);padding:12px 16px;border-radius:0 12px 12px 0;margin-bottom:14px;font-size:14px}
@media (max-width:640px){.practice{grid-template-columns:1fr}.practice .side{max-width:none}}

/* samenvatting */
.keyline{font-size:clamp(15px,1.8vw,22px);font-weight:700;color:var(--title);background:var(--chain-bg);border-left:6px solid var(--accent);padding:clamp(10px,1.4vw,18px);border-radius:0 12px 12px 0;margin-bottom:clamp(12px,2vw,24px)}

/* ---------- bediening ---------- */
.controls{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;margin-top:16px}
.controls .grow{flex:1;min-width:50px;display:flex;align-items:center;gap:8px}
.controls .ai-badge>span{display:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--btn-bg);color:var(--btn-text);transition:transform .08s,filter .15s;border:2px solid var(--btn-bg);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--btn-bg)}
.btn.icon{width:46px;height:46px;padding:0;justify-content:center;border-radius:50%;font-size:18px;flex-shrink:0}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.big{padding:14px 28px;font-size:17px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;cursor:pointer}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.counter{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.speedbtn{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--btn-bg);border:2px solid var(--btn-bg);background:transparent;min-width:52px;white-space:nowrap}
.speedbtn.fast{background:var(--btn-bg);color:var(--btn-text)}
.navbtns{display:inline-flex;gap:8px;flex-shrink:0}
.pres-main{container-type:inline-size}
@container (max-width:660px){.navbtns .btn span{display:none}.navbtns .btn{padding:10px 14px}}
@container (max-width:560px){.controls{flex-wrap:wrap}.controls .grow{min-width:140px}}
.audio-hint{font-size:13px;color:var(--warn);margin-top:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}

/* ---------- intro / quiz / resultaat ---------- */
.panel{padding:clamp(24px,4vw,56px)}
.panel h1{font-size:clamp(26px,3.4vw,40px);color:var(--title);line-height:1.15;margin-bottom:10px}
.panel .sub{font-size:clamp(15px,1.7vw,19px);color:var(--muted);margin-bottom:24px}
.panel h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.panel .meta{font-size:14px;color:var(--muted);margin:18px 0 26px}
.panel ul.bul li{font-size:clamp(14px,1.5vw,17px)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-text{font-size:clamp(18px,2.1vw,24px);font-weight:700;color:var(--title);line-height:1.3;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:clamp(14px,1.5vw,17px);background:var(--card-bg);transition:border-color .12s,background .12s}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--chain-bg);color:var(--title);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;border-left:6px solid;font-size:clamp(14px,1.5vw,17px)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.q-foot{display:flex;justify-content:flex-end;margin-top:18px;gap:10px}
.score{font-size:clamp(40px,7vw,80px);font-weight:700;color:var(--accent);line-height:1;margin:10px 0 6px}
.score small{font-size:.4em;color:var(--muted)}
.review-list{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.review-list .it{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--chain-bg)}
.review-list .it .m{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.review-list .it.ok .m{background:var(--ok)}
.review-list .it.bad .m{background:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

@media (max-width:640px){
  header.top{padding:10px 14px}header.top .logo{height:28px}header.top .modlabel{display:none}
  .slide{aspect-ratio:auto;min-height:60vh}
  .timeline,.chain{grid-auto-flow:row;grid-auto-columns:auto}
  .timeline::before{display:none}.chain .st:not(:last-child)::after{display:none}
  .compare{grid-template-columns:1fr}.slide .decor{display:none}.slide.title .inner{max-width:100%}
}

/* ---------- huisstijl ---------- */

  --chip-bg:#00283C; --chip-text:#FFFFFF;

<script id="content" type="application/json">{"lang": "en", "course": "Data protection", "module": "Module 1", "title": "How rules are made and who supervises them", "subtitle": "From European directive to Belgian supervisory authority, with the GDPR as the common thread", "duration": "± 15 minutes of presentation, 5 short practical exercises and 10 questions", "ui": {"start": "Start the presentation", "intro_lead": "What you will learn in this module", "goals": ["The difference between a European directive and a regulation, and what a Member State still has to do with each.", "What the text of a law is worth compared with the recitals and the preparatory documents.", "How supervision works: supervisory authorities, courts and the Court of Justice of the European Union, with the Belgian chain as an example.", "Why interpretation by supervisory authorities and judges is what gives the rules their real content."], "slide_of": "Slide {n} of {total}", "play": "Play", "pause": "Pause", "replay": "Replay", "prev": "Previous", "next": "Next", "autoplay": "Continue automatically", "to_quiz": "Go to the exercises", "quiz_intro_title": "Test your knowledge", "quiz_intro_text": "Ten questions, each with four possible answers of which exactly one is correct. You get feedback immediately after each answer. Nothing is recorded: practise as often as you like.", "quiz_start": "Start the exercises", "question_of": "Question {n} of {total}", "correct": "Correct", "incorrect": "Incorrect", "next_question": "Next question", "show_result": "See your result", "result_title": "Your result", "result_text": "You answered {score} of the {total} questions correctly.", "result_good": "Well done. You have mastered the essentials of this module.", "result_mid": "Good progress. Review the feedback on the questions you missed and try again.", "result_low": "Watch the presentation again and then try once more. The feedback on each question will help you.", "retry": "Practise again", "review": "Review the presentation", "your_answer": "Your answer", "footer": "Module 1 · How rules are made and who supervises them", "open_link": "Open the link in a new tab", "practice_hint": "Practical exercise: pause, carry out the steps, then click Next.", "back_to_slides": "Back to the slides", "resume_quiz": "Continue the exercises", "download_pdf": "Download your result as PDF", "pdf_title": "Exercise results", "pdf_question": "Question", "pdf_your": "Your answer", "pdf_correct": "Correct answer", "pdf_feedback": "Feedback", "pdf_score": "Score", "pdf_date": "Date", "pdf_not_answered": "not answered", "transcript": "Spoken text", "show_text": "Show text", "hide_text": "Hide text", "ai_notice_title": "Transparency about AI", "ai_notice": "The voice in this module was generated by AI from the voice of Peter Berghmans, with his consent. The text and slides were produced with AI assistance and reviewed for content by the trainer.", "ai_voice_label": "AI voice", "ai_icon_alt": "Official EU label: AI-generated content", "ai_footer": "Voice generated by AI (with the speaker's consent); text and slides produced with AI assistance and reviewed by the trainer.", "skip_to_quiz": "Go straight to the exercises", "nav_home": "Home", "nav_slides": "Presentation", "nav_quiz": "Exercises", "speed": "Speed", "autoplay_short": "Auto"}, "slides": [{"id": 1, "type": "title", "title": "How rules are made and who supervises them", "subtitle": "From European directive to Belgian supervisory authority", "script": "Welcome to the first module. Over the next quarter of an hour we will look at how rules come about and who then makes sure they are followed. We will do that on two levels: the European and the national. And we will use one common thread: the General Data Protection Regulation, the GDPR. Not because data protection is the only field where this matters, quite the opposite, but because the GDPR shows very concretely how a European rule is made, how a Member State still adds something to it, and how supervisory authorities and judges then give it its meaning. At the end of the module, ten questions let you check whether you have grasped the principles."}, {"id": 2, "type": "bullets", "chip": "Two instruments", "title": "Europe makes rules through a directive or through a regulation", "bullets": [{"k": "Regulation", "t": "applies directly and in the same way in every Member State, without transposition into national law."}, {"k": "Directive", "t": "sets a result to be achieved; each Member State transposes it into its own legislation and chooses the form and the means."}, {"k": "Who decides", "t": "the European Commission proposes; the European Parliament and the Council of the European Union adopt together."}], "script": "Let us start with the two main instruments the European Union uses to make rules: the regulation and the directive. A regulation is the most direct form. As soon as it applies, it is valid in every Member State, directly, and with exactly the same text. A citizen or a company in Belgium can rely on it immediately. A directive works differently. It imposes a result on the Member States, but leaves them free in how they achieve that result. Each Member State therefore has to transpose the directive into its own legislation, within a set period. The way both instruments are adopted is usually the same: the European Commission makes a proposal, and the European Parliament and the Council of the European Union, where the governments of the Member States sit, both have to approve it."}, {"id": 3, "type": "compare", "chip": "The difference", "title": "A regulation works uniformly, a directive leaves room to the Member State", "left": {"head": "Regulation", "items": ["One text for the whole Union", "Directly applicable from its date of application", "National law only to organise practical matters and where the regulation leaves room", "Example: the GDPR, Regulation 2016/679"]}, "right": {"head": "Directive", "items": ["Objective binding, route free to choose", "Transposition into national law within a deadline", "Differences between Member States are possible", "Example: Directive 95/46, the predecessor of the GDPR"]}, "script": "Why does that difference matter? With a regulation, the same text applies everywhere. That gives legal certainty: a company active in five Member States knows one rule. The national legislator may only still regulate practical matters, such as which body carries out supervision, and may only add its own rules on the points where the regulation expressly allows it. With a directive, the objective is binding, but the route to it is not. Each Member State writes its own law, and those laws can therefore differ from one another. That is precisely why data protection legislation moved from a directive to a regulation in 2016. The old directive of 1995 had been transposed slightly differently in each of the various Member States. With the GDPR, Europe chose one uniform text. So remember: a regulation is uniform, a directive leaves room."}, {"id": 4, "type": "bullets", "chip": "National layer", "title": "Even with a regulation, there is still work for the national legislator", "bullets": [{"k": "With a directive", "t": "the national law is the actual rule: it gives the directive concrete effect."}, {"k": "With a regulation", "t": "the national law implements: it designates the supervisory authority and regulates the procedures."}, {"k": "Opening clauses", "t": "the GDPR allows national choices on certain points, for example the age from which a minor can give consent (Article 8)."}, {"k": "Belgium", "t": "the Act of 3 December 2017 establishes the Data Protection Authority; the Act of 30 July 2018 supplements the GDPR and sets the age at 13."}], "script": "Alongside the European rules there are therefore always national rules, but their role differs. With a directive, the national law is the actual rule that citizens and companies must comply with; it gives the directive concrete effect. With a regulation, the national law does two things. First, it implements the regulation in the Member State: it designates who carries out supervision and how the procedures run. Second, on the points where the regulation allows it, the so-called opening clauses, it can make its own choices. The GDPR contains dozens of them. A well-known example is Article 8: a minor can consent to the processing of their personal data by online services from the age of sixteen, but a Member State may lower that age to thirteen. In Belgium these are two acts: the Act of 3 December 2017, which establishes the Data Protection Authority, and the Act of 30 July 2018, also called the framework act, which supplements the GDPR and sets the age of consent at thirteen."}, {"id": 5, "type": "bullets", "chip": "Anatomy of a legal text", "title": "A piece of legislation consists of more than its articles alone", "bullets": [{"k": "The articles", "t": "the binding part: rights, obligations, prohibitions and sanctions are found here and nowhere else."}, {"k": "The recitals", "t": "the reasoning at the front of the text; they explain why and how the articles are intended. The GDPR has 173 of them."}, {"k": "Preparatory documents", "t": "the Commission proposal, opinions, amendments and parliamentary reports that document how the text came about."}, {"k": "Example", "t": "Article 4, point 1 defines personal data; recital 26 explains how to determine whether someone is identifiable."}], "script": "Let us now zoom in on the legal text itself. When you open a European regulation, you see three layers. First the articles. That is the binding part: only there do you find the rights, the obligations, the prohibitions and the sanctions. Before the articles come the recitals. These are numbered paragraphs that explain why the rule exists and how the legislator intended the articles. The GDPR has 173 of them. And then there are the preparatory documents: the Commission's original proposal, the opinions of other institutions, Parliament's amendments and the reports of the negotiations. A concrete example: Article 4, point 1 of the GDPR defines what personal data is. But how you determine whether someone is identifiable, by what means and at what cost, you read in recital 26."}, {"id": "5b", "type": "practice", "chip": "Practical exercise", "title": "Look in the GDPR yourself: recital 26 next to Article 4", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "url_label": "Open the GDPR on EUR-Lex", "intro": "Pause the presentation and follow the steps. Take two minutes.", "steps": ["Open the link. At the top you see the title \"Regulation (EU) 2016/679\" and below it the numbered recitals, each in brackets: (1), (2), and so on.", "Find recital (26) with Ctrl+F or Cmd+F and read it. It explains when someone is \"identifiable\": look at all the means reasonably likely to be used, taking into account cost and time.", "Scroll further to \"Article 4 — Definitions\" and read point 1, the definition of personal data. Notice how short and general it is: not a word about cost, time or means.", "Compare the two: recital 26 says how to read Article 4, but only Article 4 is the binding rule.", "Finally: scroll to Article 83 and find the amounts of the fines. They are in an article, not in a recital, and are therefore enforceable."], "script": "Pause the presentation for a moment and open the legal text via the button on your screen. You arrive on EUR-Lex, the official publication site of the European Union. Follow the steps on the slide and pay particular attention to the difference in tone between a recital and an article. Take a good two minutes."}, {"id": 6, "type": "bullets", "chip": "Value and use", "title": "Only the articles bind; recitals guide the interpretation", "bullets": [{"k": "Rule", "t": "a recital has no binding force and can never derogate from what an article says. That is settled case law of the Court of Justice of the European Union."}, {"k": "Use", "t": "when an article is unclear, the supervisory authority and the judge turn to the recitals to find the intention."}, {"k": "Practice", "t": "always read the article first, then the recital that goes with it, and only in case of doubt the preparatory documents."}, {"k": "Pitfall", "t": "quoting a recital as if it were an obligation; the other side will rightly point out that no article backs it up."}], "script": "So what is the value of those recitals compared with the articles? The rule is clear and the Court of Justice of the European Union has repeated it for decades: a recital has no binding force. You cannot derive a right or an obligation from it, and it can never derogate from what an article says. But that does not make recitals worthless, quite the opposite. As soon as an article is unclear, and that happens often, supervisory authorities and judges turn to the recitals to find the legislator's intention. In practice, you therefore always read the article first, then the recital that goes with it, and only if it is still not clear, the preparatory documents. The classic pitfall is quoting a recital as if it were an obligation. Anyone who does that will rightly be told by the other side that no article backs it up."}, {"id": "6b", "type": "practice", "chip": "Practical exercise", "title": "A definition and its recital: consent", "url": "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679", "url_label": "Open the GDPR on EUR-Lex", "intro": "Read the definition first, then the recital. Take two to three minutes.", "steps": ["Go to Article 4 and read point 11, the definition of consent. Note the four characteristics: freely given, specific, informed and unambiguous, given by a statement or by a clear affirmative action.", "Now find recital (32) and read it in full.", "What does the recital add? Concrete examples of an affirmative action (ticking a box, choosing a technical setting) and, more importantly, what is not consent: silence, pre-ticked boxes and inactivity.", "Consider: the definition in the article is the binding rule, but anyone who reads only the article does not yet know whether a pre-ticked box is enough. That answer comes from the recital."], "script": "One more short exercise. Open the legal text again and first read a definition from Article 4, then the recital that goes with it. Pay attention to what the definition says, and to what you only learn from the recital. Take two to three minutes."}, {"id": 7, "type": "timeline", "chip": "Common thread: the GDPR", "title": "The GDPR grew from a directive of 1995 into a regulation in 2016", "steps": [{"y": "1992", "t": "Belgium: Privacy Act of 8 December 1992, even before the European rules"}, {"y": "1995", "t": "Directive 95/46: each Member State must adopt or adapt its own privacy law"}, {"y": "2012", "t": "The Commission proposes a regulation after a patchwork of national laws"}, {"y": "2016", "t": "Regulation 2016/679 adopted on 27 April"}, {"y": "2018", "t": "Applicable since 25 May; Belgian framework act of 30 July"}], "script": "Now look at the history of the GDPR, because it illustrates everything we have just seen. In 1995, Europe adopted Directive 95/46 on the protection of personal data. As a directive, it had to be transposed by every Member State. Belgium already had a Privacy Act of 8 December 1992 and adapted it to the directive. The result, twenty years later, was a patchwork of twenty-eight national laws that differed on important points. That is why the Commission proposed a regulation in 2012. After four years of negotiation, the GDPR was adopted on 27 April 2016. It had a transition period of two years and has applied since 25 May 2018. Belgium supplemented it with the framework act of 30 July 2018. From directive to regulation, then: from freedom for the Member States to one uniform text."}, {"id": 8, "type": "bullets", "chip": "Supervision", "title": "Classic supervision is carried out by courts, national and European", "bullets": [{"k": "National judge", "t": "applies the European rule in concrete disputes; the first to apply Union law."}, {"k": "Court of Justice of the European Union", "t": "safeguards uniform interpretation; it rules on the meaning of a European rule, not on the facts of the case."}, {"k": "Preliminary question", "t": "a national judge in doubt about the interpretation refers the question to the Court; the answer binds all Member States."}, {"k": "Data protection", "t": "the GDPR adds a mandatory extra layer: an independent supervisory authority per Member State."}], "script": "Making rules is one thing, supervising them is another. Classic supervision is carried out by courts. First of all the national judge: they apply European rules in concrete disputes and are therefore the first to apply Union law. Above them stands the Court of Justice of the European Union in Luxembourg. That Court does not rule on the facts of a case, but on the meaning of a European rule. When a national judge is in doubt about the interpretation of a European provision, they suspend the case and put their question to the Court. The answer binds not only that judge, but all judges and authorities across the Union."}, {"id": 9, "type": "bullets", "chip": "Supervisory authorities in Belgium", "title": "Belgium has one national and a few special supervisory authorities", "bullets": [{"k": "Data Protection Authority (DPA)", "t": "the national supervisory authority, established by the Act of 3 December 2017; represents Belgium in the European Data Protection Board."}, {"k": "Supervisory Body for Police Information (COC)", "t": "supervisory authority for the processing of data by the police services."}, {"k": "Flemish Supervisory Commission (VTC)", "t": "supervisory authority for the Flemish institutions."}, {"k": "European Data Protection Board (EDPB)", "t": "European body in which all national supervisory authorities sit; ensures uniform application through guidelines. It is not itself a supervisory authority and does not impose fines."}], "script": "What does this look like in Belgium? The national supervisory authority is the Data Protection Authority, the DPA, in Dutch the Gegevensbeschermingsautoriteit. It is the body that represents Belgium in the European Data Protection Board. But the DPA is not alone. For the processing of data by the police services, for example, Belgium has a separate supervisory authority, the Supervisory Body for Police Information, the COC. And because Belgium is a federal country, Flanders has used the possibility to set up its own supervisory authority for the Flemish institutions: the Flemish Supervisory Commission. I would also like to explain briefly what the European Data Protection Board, the EDPB, is. It is the European body in which the heads of all national supervisory authorities sit together, along with the European Data Protection Supervisor. The EDPB is not a court. It ensures uniform application of the GDPR: among other things, it publishes guidelines, clear texts, often with examples, that explain particular topics. These texts are the result of coordination between the national supervisory authorities of the Member States. Note: the EDPB is not a supervisory authority like the national or regional ones, and so it will not, for example, impose a fine on a company or a public body."}, {"id": "9b", "type": "practice", "chip": "Practical exercise", "title": "Look at EDPB guidelines", "url": "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_201903_video_devices_en_0.pdf", "url_label": "Open the guidelines (pdf)", "intro": "The link opens a pdf file; in some browsers it is downloaded. Open it and follow the steps.", "steps": ["Click the button. You get a pdf file from the EDPB: Guidelines 3/2019 on processing of personal data through video devices, version 2.0, adopted after a public consultation. If the file is downloaded, open it from your downloads folder.", "Go to paragraphs 12 and 13, in the chapter on the household exemption. Paragraph 12 cites the Ryneš judgment of the Court of Justice: a camera on a private home that also films public space, even partially, does not fall under that exemption. Paragraph 13 lists what to take into account, including whether the camera also captures a public space or the neighbours' property.", "Also read paragraph 14 with the examples: the tourist filming holiday videos, the mountain biker with an action camera, the fenced private garden. Such concrete examples are found nowhere in the legal text.", "Look at the numbering of the paragraphs. Supervisory authorities and lawyers refer to those numbers, just as they do to recitals and articles.", "Remember: this is not law. But the Belgian DPA, and every other supervisory authority in Europe, will assess your video surveillance against these guidelines."], "script": "Time for a third short exercise. Use the button on your screen to open the guidelines of the European Data Protection Board on video surveillance. It is a pdf file, which some browsers download straight away. Go to the paragraphs shown on the slide and read them at your own pace."}, {"id": 10, "type": "bullets", "chip": "Sanctions", "title": "A supervisory authority is an administrative sanctioning body with a wide arsenal", "bullets": [{"k": "Reprimand", "t": "a formal finding that the rules have been infringed, without a fine; the lightest sanction, but an official decision that counts in case of repetition (Article 58(2)(b))."}, {"k": "Order and ban", "t": "the supervisory authority can order the processing to be adapted or halted, temporarily or definitively."}, {"k": "Fine", "t": "up to 20 million euros or 4 percent of worldwide annual turnover."}, {"k": "Administrative, not judicial", "t": "the decision comes from an administrative body; in Belgium, the Litigation Chamber of the DPA decides."}], "script": "What can a national or regional supervisory authority do? It is important to understand that the DPA is not a court, but an administrative sanctioning body. It takes decisions as an administration, and in Belgium it is the Litigation Chamber of the DPA that does so. The lightest sanction is the reprimand. A reprimand is a formal finding that the rules have been infringed, without a fine. Do not underestimate it: it is an official decision that is often published and that counts if the organisation later gets it wrong again. The supervisory authority can also issue an order to adapt the processing, or halt it temporarily or definitively. And of course there are the fines: up to twenty million euros, or four percent of worldwide annual turnover."}, {"id": 11, "type": "chain", "chip": "The chain", "title": "From complaint to the Court of Justice: this is how the Belgian supervision chain runs", "steps": [{"k": "Complaint or investigation", "t": "at the DPA"}, {"k": "Litigation Chamber", "t": "decides and imposes a sanction where appropriate"}, {"k": "Market Court", "t": "appeal within 30 days before the Brussels Court of Appeal"}, {"k": "Court of Justice of the European Union", "t": "preliminary question if the interpretation of the GDPR is uncertain"}, {"k": "Back to Brussels", "t": "the Market Court decides with the Court's answer"}], "note": "Example: the Proximus case (C-129/21, judgment of 27 October 2022) went through exactly this chain.", "script": "And now the chain you need to be able to explain. Everything starts with a complaint from a citizen, or with an investigation the DPA opens itself. The Litigation Chamber of the DPA handles the case and takes a decision, possibly with a sanction. Because the DPA is an administrative body, it must be possible to challenge that decision before a judge. Article 78 of the GDPR guarantees that. In Belgium that judge is the Market Court, a section of the Brussels Court of Appeal. If the Market Court is in doubt about the interpretation of the GDPR, it refers a preliminary question to the Court of Justice of the European Union. The Court answers, and with that answer the Market Court takes its final decision. That is not theory. Take the Proximus case. A subscriber asked no longer to be listed in the telephone directories, but his data reappeared anyway. He lodged a complaint with the DPA, the Litigation Chamber fined Proximus twenty thousand euros, Proximus appealed to the Market Court, and the Market Court referred questions to the Court of Justice. It asked, among other things, whether a subscriber has to give consent to be listed in a directory, whether his request to be removed is a request for erasure, and whether Proximus also has to pass that withdrawal on to the other directories and to search engines such as Google. The Court answered on 27 October 2022. So the chain runs from Brussels to Luxembourg and back."}, {"id": "11b", "type": "practice", "chip": "Practical exercise", "title": "Find the judgment on the website of the Court of Justice", "url": "https://curia.europa.eu/juris/liste.jsf?num=C-129/21&language=en", "url_label": "Open InfoCuria (curia.europa.eu)", "intro": "Find the Proximus judgment, case C-129/21, and look above all at its structure. Take three minutes.", "steps": ["Open the link. You arrive on InfoCuria, the Court's search engine, with the results for case C-129/21. If that does not work, type C-129/21 in the \"Case number\" field and choose English.", "Open the judgment of 27 October 2022. At the top you read the title of the case: Proximus v Gegevensbeschermingsautoriteit, and the referring court: the Brussels Court of Appeal, Market Court.", "Find the section \"The dispute in the main proceedings and the questions referred for a preliminary ruling\". There you find the subscriber's story and the four questions from the Market Court: among others, whether a subscriber must consent to being listed in a directory, whether his request to be removed is a request for erasure, and whether Proximus must also pass that withdrawal on to other directories and search engines. Recognise the chain from slide 11: complaint, Litigation Chamber, appeal, preliminary question.", "Note that the Court does not say whether Proximus must pay the fine. The Market Court decides that itself, with the Court's answer in hand. The Court interprets, the national judge decides."], "script": "A final exercise. Open the website of the Court of Justice via the button on your screen and look up the Proximus judgment using the case number C-129/21. Do not look at the content but at the structure of the judgment: who asks what of whom, and where the answer is. Take three minutes."}, {"id": 12, "type": "bullets", "chip": "Interpretation", "title": "Supervisory authorities and judges are the ones who give the rule its real meaning", "bullets": [{"k": "Why", "t": "the text of a regulation is general; what it means in a concrete case only emerges from decisions and judgments."}, {"k": "Breyer (C-582/14, 2016)", "t": "a dynamic IP address is personal data for anyone who can reasonably identify the person via a third party, such as the internet provider."}, {"k": "Nowak (C-434/16, 2017)", "t": "a candidate's answers in an exam, and even the examiner's comments, are personal data of that candidate."}], "script": "Why do we pay so much attention to supervisory authorities and judges? Because the text of a regulation is general. What a concept means in a concrete case only emerges from decisions and judgments. Take the most basic concept in the GDPR: personal data. In the Breyer judgment of 2016, the Court held that a dynamic IP address is personal data for a website operator, because they can reasonably have the person identified via the internet provider. In the Nowak judgment of 2017, the Court decided that a candidate's answers in an exam are personal data, and even the examiner's comments on them. None of those answers is found literally in Article 4. They are the result of interpretation, and that interpretation is as binding as the text."}, {"id": 13, "type": "bullets", "chip": "Wider view", "title": "You see the same pattern in the AI Act, the Data Act and other frameworks", "bullets": [{"k": "AI Act", "t": "Regulation 2024/1689: directly applicable, applied in phases; supervision by national market surveillance authorities and a European AI Office within the Commission."}, {"k": "Data Act", "t": "Regulation 2023/2854: applicable since 12 September 2025; each Member State designates competent authorities."}, {"k": "NIS2", "t": "Directive 2022/2555 on cybersecurity: had to be transposed by each Member State; Belgium did so with the Act of 26 April 2024."}, {"k": "Same questions", "t": "directive or regulation? Which national layer? Who supervises, and who interprets?"}], "script": "Finally, a wider view, because this pattern is not unique to data protection. Look at the AI Act. It is a regulation, so directly applicable, with a phased entry into application. Supervision is carried out by national market surveillance authorities that each Member State designates, and at European level by an AI Office within the Commission. The Data Act, on access to data from connected products, has applied since 12 September 2025, and there too each Member State has to designate competent authorities. And NIS2 on cybersecurity is, by contrast, a directive, which Belgium transposed with the Act of 26 April 2024. So with every new framework you ask the same four questions: is it a directive or a regulation? Which national layer is added? Who supervises? And who, in the end, gives the interpretation?"}, {"id": 14, "type": "summary", "chip": "Remember", "title": "What to take away from this module", "key": "A European rule gets its meaning in three steps: the text, the national layer and the interpretation by supervisory authorities and judges.", "bullets": [{"k": "Distinguish", "t": "a regulation is uniform and direct, a directive has to be transposed."}, {"k": "Read", "t": "the article first, then the recital; only the article binds."}, {"k": "Know the chain", "t": "DPA, Market Court, Court of Justice of the European Union, and the EDPB for uniform application."}, {"k": "Look up the case law", "t": "what a concept means is found in judgments and decisions, not only in the text."}], "script": "What do you take away from this module? One key sentence: a European rule gets its meaning in three steps. First the text, then the national layer, and finally the interpretation by supervisory authorities and judges. Concretely: distinguish between a regulation, which works uniformly and directly, and a directive, which has to be transposed. Always read the article first and only then the recital, because only the article binds. Know the chain in Belgium: the Data Protection Authority, the Market Court and the Court of Justice of the European Union, with the European Data Protection Board as guardian of uniform application. And look up the case law, because what a concept really means is found in judgments and decisions. Ready? Then you can now test your knowledge with ten questions."}], "quiz": [{"q": "What is the main difference between a European regulation and a directive?", "options": ["A regulation applies directly in every Member State; a directive first has to be transposed into national law.", "A regulation is adopted by the Commission alone; a directive also by Parliament and the Council.", "A regulation applies only to public authorities; a directive also applies to companies and citizens.", "A directive is binding on the Member States; a regulation is merely a recommendation without binding force."], "answer": 0, "feedback": ["That is exactly the distinction in Article 288 TFEU: a regulation applies uniformly and directly, a directive sets a result that the Member State itself has to put into legislation.", "Both instruments follow the same procedure: a Commission proposal, adoption by the European Parliament and the Council. The difference lies in how they work, not in who adopts them.", "Both instruments can bind public authorities as well as companies and citizens. The difference lies in transposition, not in who is addressed.", "Both are binding. A recommendation is a separate instrument without binding force. The difference between a regulation and a directive lies in transposition."]}, {"q": "Why did Europe convert the data protection rules from a directive into a regulation in 2016?", "options": ["Because a directive binds only public authorities and they now wanted to bind companies directly as well.", "Because the transposition of the directive had turned out differently in each Member State and they wanted one uniform text.", "Because the Court of Justice of the European Union had declared the 1995 directive invalid for breaching the Treaties.", "Because a regulation does not require national supervisory authorities and so limits the costs for Member States."], "answer": 1, "feedback": ["Directive 95/46 also applied to companies, through the national transposition laws. The reason was the patchwork of differing national laws.", "Twenty-eight national laws with differences between them gave no legal certainty to anyone active in several Member States. A regulation gives one text for the whole Union.", "The directive was never declared invalid; it was repealed by the GDPR itself. The reason was the fragmentation of the national transpositions.", "On the contrary, the GDPR obliges every Member State in Article 51 to establish at least one independent supervisory authority."]}, {"q": "The GDPR is a regulation. What role does the Belgian legislator still play?", "options": ["None: a regulation is complete and leaves no room at all for national legislation.", "It has to copy the full text of the GDPR into a Belgian act, otherwise the GDPR does not apply in Belgium.", "It designates the supervisory authority, regulates procedures and makes choices where the GDPR allows it.", "It may adapt the GDPR to the Belgian context wherever it considers that necessary or desirable itself."], "answer": 2, "feedback": ["Even with a regulation there is still work: someone has to designate the supervisory authority and regulate the procedures. Belgium did that with the Acts of 3 December 2017 and 30 July 2018.", "A regulation applies directly; copying it into a national act is not necessary and not even allowed, because it would disturb its uniform application.", "The national law implements and supplements where the GDPR allows it, for example the age of consent in Article 8, which Belgium set at 13.", "The national legislator may only make its own choices on the points where the regulation expressly allows it, the opening clauses. Free adaptation is not possible."]}, {"q": "What is the legal value of a recital in a European regulation?", "options": ["A recital is as binding as an article and can supplement an article with additional obligations.", "A recital only matters during the negotiations and has no value whatsoever afterwards.", "A recital binds only the Member States and their authorities, not citizens and companies.", "A recital is not binding, but helps to interpret the intention of an article correctly."], "answer": 3, "feedback": ["The Court of Justice of the European Union consistently repeats that a recital has no binding force and cannot derogate from or add to what an article provides.", "Recitals remain part of the published text and are used constantly in interpretation, for example recital 26 on identifiability.", "Recitals bind no one. They are an aid to interpretation, not a source of rights or obligations.", "Recitals are the legislator's reasoning. They do not bind, but supervisory authorities and judges use them to interpret an unclear article."]}, {"q": "You are trying to find out whether a certain data processing operation is prohibited. What is the right reading order?", "options": ["First the preparatory documents, then the recitals and only at the end the articles themselves.", "First the recitals, because they are written most clearly; the articles only in case of doubt.", "First the article, then its recital and only in case of doubt the preparatory documents.", "Only the articles; recitals and preparatory documents are of no legal relevance whatsoever."], "answer": 2, "feedback": ["The preparatory documents are the last step, not the first. The binding answer is in the article.", "A recital does not bind. Anyone who bases their conclusion on a recital without reading the article risks seeing an obligation that does not exist.", "Only the article binds; the recital clarifies the intention; the preparatory documents are the last resort for understanding the context.", "Recitals and preparatory documents are not binding, but they are certainly not irrelevant: judges and supervisory authorities use them to interpret unclear articles."]}, {"q": "What is the European Data Protection Board (EDPB)?", "options": ["A European court that hears appeals against decisions of the national supervisory authorities.", "The body of all national supervisory authorities that ensures uniform application of the GDPR.", "The department of the European Commission that wrote the GDPR and monitors its application.", "The Belgian supervisory authority competent for the federal government and its institutions."], "answer": 1, "feedback": ["The EDPB is not a court. An appeal against a decision of the Belgian DPA goes to the Market Court; the interpretation of the GDPR comes from the Court of Justice of the European Union.", "The EDPB (Articles 68 to 70 GDPR) publishes guidelines and settles disagreements between supervisory authorities in cross-border cases with a binding decision.", "The EDPB is independent of the Commission. It consists of the heads of the national supervisory authorities and the European Data Protection Supervisor.", "The Belgian national supervisory authority is the Data Protection Authority (DPA), which represents Belgium in the EDPB."]}, {"q": "What is a reprimand as a sanction from a supervisory authority?", "options": ["A fine of at most 10,000 euros that the supervisory authority can impose without any procedure.", "An informal warning by letter that has no legal consequences whatsoever for the company.", "The temporary halting of the processing until the company has remedied the infringement found.", "A formal finding that the rules were infringed, without a fine, but counted in case of repetition."], "answer": 3, "feedback": ["A reprimand does not include a fine. Fines are a separate sanction under Article 83 GDPR.", "A warning also exists, but it applies before an infringement, when an intended processing operation is likely to infringe the rules. A reprimand finds that the infringement has already taken place and is a formal decision.", "Halting a processing operation is a separate, heavier measure. The reprimand is the finding of the infringement without any further measure.", "The reprimand is in Article 58(2)(b) of the GDPR. It is the lightest sanction, but a real decision that can be appealed and that counts in a later case."]}, {"q": "A company disagrees with a sanction from the Litigation Chamber of the Data Protection Authority. Where can it turn?", "options": ["To the Market Court, a section of the Brussels Court of Appeal, within thirty days.", "Directly to the Court of Justice of the European Union in Luxembourg, within two months of the decision.", "To the European Data Protection Board, which reviews the decisions of national supervisory authorities.", "Nowhere: the decision of the Litigation Chamber is final and not open to appeal."], "answer": 0, "feedback": ["Because the DPA is an administrative body, Article 78 GDPR guarantees an appeal before a judge. In Belgium that is the Market Court.", "A company cannot go directly to the Court of Justice of the European Union. Only a national court, such as the Market Court, can refer a preliminary question to it.", "The EDPB does not hear appeals from companies. It watches over uniform application among the supervisory authorities themselves.", "Against a decision of an administrative sanctioning body, an appeal before a judge must always be possible. That is a basic guarantee, also laid down in Article 78 GDPR."]}, {"q": "When does the Market Court refer a preliminary question to the Court of Justice of the European Union?", "options": ["When the company asks for it and the fine imposed exceeds one million euros.", "When it cannot establish the facts of the case itself and further investigation is needed.", "When the Data Protection Authority agrees to it and co-signs the question.", "When it doubts the interpretation of European law and needs the answer to decide the case."], "answer": 3, "feedback": ["Neither a party's request nor the amount of the fine is decisive. The judge decides for themselves whether they have a question of interpretation.", "The Court of Justice of the European Union does not assess the facts. It only answers questions about the meaning of European law; the facts remain for the national court.", "The judge does not need a party's permission for this. The decision to refer a question is the judge's alone.", "That is the procedure of Article 267 TFEU. The Court interprets the European rule; the answer binds all courts in the Union. The Proximus case (C-129/21) is an example."]}, {"q": "Why is the Breyer judgment (C-582/14) of the Court of Justice of the European Union important for the concept of personal data?", "options": ["Because the Court decided that an IP address can never be personal data, not even for the internet provider.", "Because the Court rewrote and broadened the definition of personal data in the GDPR.", "Because it shows that case law helps shape the meaning of a concept: a dynamic IP address can be personal data.", "Because the Court condemned the Belgian supervisory authority for reading the concept too broadly."], "answer": 2, "feedback": ["The Court decided the opposite: a dynamic IP address can indeed be personal data, if the operator can reasonably have the person identified via the internet provider.", "A judge does not rewrite the text; they interpret it. The definition stayed the same, but the judgment clarifies what \"identifiable\" means in practice.", "The text of the definition says nothing about IP addresses. We know that a dynamic IP address can be personal data through the Court's interpretation. That is how concepts acquire their real content.", "Breyer was a German case, brought by a citizen against the German federal government. The Belgian supervisory authority played no part in it."]}]}</script>

  function dots(){ $('dots').innerHTML = S.map((s,n)=>'<button data-n="'+n+'" class="'+(n===i?'on':(seen.has(n)?'seen':''))+'" title="'+(n+1)+'"></button>').join(''); }
  $('dots').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) go(+b.dataset.n,true); });

  function go(n, play){
    i = Math.max(0, Math.min(S.length-1, n)); seen.add(i);
    $('slidecard').innerHTML = render(S[i]); setTranscript(S[i].script);
    const rb = $('btn-reveal'); if(rb){ rb.addEventListener('click',()=>{ rb.classList.add('hidden'); $('reveal-ans').classList.remove('hidden'); }); }
    const firstOpt = S.findIndex(x=>x.optional); const isFirstOpt = S[i].optional && (i===0 || !S[i-1].optional);
    $('optbar').classList.toggle('hidden', !isFirstOpt); if(isFirstOpt){ $('optbar-text').textContent = U.optional_intro||''; }
    $('counter').textContent = (i+1)+' / '+S.length; $('counter').title = fmt(U.slide_of,{n:i+1,total:S.length});
    $('btn-prev').disabled = i===0;
    const last = i===S.length-1;
    $('btn-next').querySelector('span').textContent = last ? U.to_quiz : U.next; $('btn-next').title = last ? U.to_quiz : U.next;
    dots();
    audio.pause(); audio.currentTime = 0; audioOk = true; $('audio-hint').classList.add('hidden');
    { const nn=String(i+1).padStart(2,'0'); audio.src = (typeof AUDIO_DATA!=='undefined' && AUDIO_DATA[nn]) ? AUDIO_DATA[nn] : AUDIO_DIR + '/slide-' + nn + '.mp3'; }
    audio.playbackRate = rate; setPlay(false); $('barfill').style.width='0'; $('time').textContent='0:00 / 0:00';
    if(play){ audio.play().catch(()=>{}); }
  }
  function setPlay(on){ $('btn-play').textContent = on ? '❚❚' : '▶'; $('btn-play').title = on ? U.pause : U.play; }
  const mmss = t => isFinite(t) ? Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0') : '0:00';
  audio.addEventListener('play',()=>setPlay(true));
  audio.addEventListener('pause',()=>setPlay(false));
  audio.addEventListener('timeupdate',()=>{ highlight(); if(audio.duration){ $('barfill').style.width=(audio.currentTime/audio.duration*100)+'%'; $('time').textContent=mmss(audio.currentTime)+' / '+mmss(audio.duration); } });
  audio.addEventListener('loadedmetadata',()=>{ $('time').textContent='0:00 / '+mmss(audio.duration); });
  audio.addEventListener('ended',()=>{ setPlay(false); if($('autoplay').checked && i<S.length-1 && S[i].type!=='practice'){ setTimeout(()=>go(i+1,true),700); } });
  audio.addEventListener('error',()=>{ audioOk=false; setPlay(false); $('audio-hint').textContent = 'Audio file not found. Check that the "audio" folder sits next to this file.'; $('audio-hint').classList.remove('hidden'); });
  $('btn-play').addEventListener('click',()=>{ if(!audioOk) return; if(audio.paused){ if(audio.ended) audio.currentTime=0; audio.play().catch(()=>{});} else audio.pause(); });
  $('bar').addEventListener('click',e=>{ if(!audio.duration) return; const r=e.currentTarget.getBoundingClientRect(); audio.currentTime = (e.clientX-r.left)/r.width*audio.duration; });
  $('btn-prev').addEventListener('click',()=>go(i-1,true));
  $('btn-next').addEventListener('click',()=>{ if(i===S.length-1){ audio.pause(); show('quiz-intro'); } else go(i+1,true); });
  $('btn-start').addEventListener('click',()=>{ started=true; show('pres'); go(0,true); });
  if(U.optional_skip){ $('btn-opt-skip').textContent = U.optional_skip; }
  $('btn-opt-skip').addEventListener('click',()=>{ audio.pause(); let k=i; while(k<S.length && S[k].optional) k++; if(k>=S.length) show('quiz-intro'); else go(k,true); });
  setRate(rate);
  document.addEventListener('keydown',e=>{
    if($('pres').classList.contains('hidden')) return;
    if(e.key==='ArrowRight'){ if(i<S.length-1) go(i+1,true); }
    else if(e.key==='ArrowLeft'){ go(i-1,true); }
    else if(e.key===' '){ e.preventDefault(); $('btn-play').click(); }
  });

  /* ---- quiz ---- */
  const Q = C.quiz; let qi = 0, answers = [];
  const L = ['A','B','C','D'];
  function askQ(){
    const q = Q[qi];
    $('q-counter').textContent = fmt(U.question_of,{n:qi+1,total:Q.length});
    $('q-text').textContent = q.q;
    $('opts').innerHTML = q.options.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="l">'+L[n]+'</span><span>'+esc(o)+'</span></button>').join('');
    $('fb').className='hidden'; $('fb').innerHTML='';
    $('btn-q-next').classList.add('hidden');
    $('btn-q-next').textContent = qi===Q.length-1 ? U.show_result : U.next_question;
  }
  $('opts').addEventListener('click',e=>{
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    const n = +b.dataset.n, q = Q[qi], ok = n===q.answer;
    answers[qi] = n;
    [...$('opts').children].forEach((o,k)=>{ o.disabled=true; if(k===q.answer) o.classList.add('ok'); else if(k===n) o.classList.add('bad'); else o.classList.add('dim'); });
    $('fb').className = 'fb '+(ok?'ok':'bad');
    $('fb').innerHTML = '<b>'+(ok?U.correct:U.incorrect)+'</b>'+esc(q.feedback[n]);
    $('btn-q-next').classList.remove('hidden'); $('btn-q-next').focus();
  });
  $('btn-q-next').addEventListener('click',()=>{ if(qi<Q.length-1){ qi++; askQ(); window.scrollTo({top:0,behavior:'smooth'}); } else showResult(); });
  function startQuiz(){ qi=0; answers=[]; show('quiz'); askQ(); }
  let paused = null;
  $('btn-q-back').addEventListener('click',()=>{ paused = {qi, answers:answers.slice()}; $('resume').classList.remove('hidden'); $('resume-text').textContent = fmt(U.question_of,{n:qi+1,total:Q.length}); show('pres'); go(0,false); });
  $('btn-resume').addEventListener('click',()=>{ if(!paused) return; audio.pause(); $('resume').classList.add('hidden'); qi = paused.qi; answers = paused.answers; paused = null; show('quiz'); askQ(); });
  function clearResume(){ paused=null; $('resume').classList.add('hidden'); }
  function showResult(){
    const score = answers.filter((a,k)=>a===Q[k].answer).length, tot = Q.length;
    $('r-score').innerHTML = score+'<small> / '+tot+'</small>';
    $('r-text').textContent = fmt(U.result_text,{score,total:tot});
    $('r-msg').textContent = score>=tot*0.8 ? U.result_good : (score>=tot*0.5 ? U.result_mid : U.result_low);
    $('r-list').innerHTML = Q.map((q,k)=>{ const ok = answers[k]===q.answer; return '<div class="it '+(ok?'ok':'bad')+'"><span class="m">'+(ok?'✓':'✕')+'</span><span>'+esc(q.q)+(ok?'':' <em>('+esc(U.your_answer)+': '+L[answers[k]]+')</em>')+'</span></div>'; }).join('');
    show('result');
  }
  $('btn-quiz-start').addEventListener('click',startQuiz);
  $('btn-retry').addEventListener('click',startQuiz);
  $('btn-review-1').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-review-2').addEventListener('click',()=>{ clearResume(); show('pres'); go(0,true); });
  $('btn-start').addEventListener('click',clearResume);
  $('btn-pdf').addEventListener('click',()=>downloadPdf());

  /* ---- PDF (zonder externe bibliotheek) ---- */
  function downloadPdf(){
    const W=595.28,H=841.89,M=50,LH=14; let y=H-M; const pages=[]; let ops=[];
    const enc=t=>{ const out=[]; for(const ch of t){ let c=ch.charCodeAt(0); if(c>255){ c={0x2019:0x92,0x2018:0x91,0x201C:0x93,0x201D:0x94,0x2013:0x96,0x2014:0x97,0x2026:0x85,0x20AC:0x80,0x2713:0x2713,0x2715:0x2715}[c]||63; if(c>255) c=63; } if(c===40||c===41||c===92) out.push('\\'+ch); else if(c<32||c>126) out.push('\\'+('00'+c.toString(8)).slice(-3)); else out.push(ch); } return out.join(''); };
    const width=(t,sz,b)=>t.length*sz*(b?0.56:0.52);
    const wrap=(t,sz,b,maxw)=>{ const words=t.split(/\s+/),lines=[]; let cur=''; for(const w of words){ const tst=cur?cur+' '+w:w; if(width(tst,sz,b)>maxw&&cur){ lines.push(cur); cur=w; } else cur=tst; } if(cur) lines.push(cur); return lines; };
    const newPage=()=>{ if(ops.length) pages.push(ops); ops=[]; y=H-M; };
    const text=(t,sz,b,ind,color)=>{ for(const ln of wrap(t,sz,b,W-2*M-(ind||0))){ if(y<M+LH) newPage(); ops.push('BT /'+(b?'F2':'F1')+' '+sz+' Tf '+(color||'0 0 0')+' rg '+(M+(ind||0))+' '+y.toFixed(2)+' Td ('+enc(ln)+') Tj ET'); y-=sz*1.35; } };
    const gap=n=>{ y-=n; if(y<M) newPage(); };
    const score=answers.filter((a,k)=>a===Q[k].answer).length;
    newPage();
    text(C.course+' – '+C.module,10,false,0,'0.4 0.4 0.4'); gap(2);
    text(C.title,16,true); gap(4);
    text(U.pdf_title,13,true); gap(2);
    text(U.pdf_date+': '+new Date().toLocaleDateString(C.lang)+'    '+U.pdf_score+': '+score+' / '+Q.length,11,false); gap(10);
    Q.forEach((q,k)=>{
      const a=answers[k], ok=a===q.answer;
      if(y<M+90) newPage();
      text(U.pdf_question+' '+(k+1)+' – '+(ok?U.correct:U.incorrect),11,true,0,ok?'0.12 0.55 0.35':'0.78 0.1 0.15'); gap(1);
      text(q.q,10.5,false); gap(3);
      q.options.forEach((o,n)=>text(L[n]+'. '+o,9.5,n===q.answer,12,n===q.answer?'0 0 0':'0.3 0.3 0.3')); gap(3);
      text(U.pdf_your+': '+(a==null?U.pdf_not_answered:L[a])+'    '+U.pdf_correct+': '+L[q.answer],9.5,true,0); gap(1);
      text(U.pdf_feedback+': '+(a==null?'':q.feedback[a]),9.5,false,0,'0.25 0.25 0.25'); gap(9);
    });
    pages.push(ops);
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const pageIds=[];
    pages.forEach(p=>{ const stream=p.join('\n'); const c=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'); pageIds.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Contents '+c+' 0 R /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> >>')); });
    add('<< /Type /Pages /Kids ['+pageIds.map(i=>i+' 0 R').join(' ')+'] /Count '+pageIds.length+' >>');
    const cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
    let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
    objs.forEach((o,i)=>{ offs.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    const xref=out.length;
    out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
    const blob=new Blob([bytes],{type:'application/pdf'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(C.module+' - '+U.pdf_title+'.pdf').replace(/[\/\\:]/g,'-'); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }
})();
</script>
